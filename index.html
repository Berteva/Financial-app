<style>
:root {
  --bg:#0a0c10; --surface:#111318; --surface2:#181b22; --border:#1e2130;
  --accent:#00e5a0; --accent-dim:rgba(0,229,160,0.12);
  --danger:#ff4d6d; --danger-dim:rgba(255,77,109,0.12);
  --warning:#f5a623; --warning-dim:rgba(245,166,35,0.12);
  --purple:#a78bfa; --blue:#38bdf8; --orange:#fb923c; --green:#34d399; --yellow:#fbbf24;
  --text:#eef0f6; --text-muted:#6b7280;
  --radius:16px; --radius-sm:10px; --nav-h:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden;}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;flex-shrink:0;z-index:50;}
.header-left{display:flex;align-items:center;gap:12px;}
.menu-btn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:6px 8px;border-radius:8px;line-height:1;}
.header-logo{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--accent);}
.header-sub{font-size:10px;color:var(--text-muted);margin-top:2px;}
.header-balance{text-align:right;}
.header-balance-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
.header-balance-value{font-size:18px;font-weight:700;}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:280px;height:100%;background:var(--surface);border-right:1px solid var(--border);z-index:1000;transform:translateX(-100%);transition:transform .3s ease;display:flex;flex-direction:column;overflow-y:auto;}
.sidebar.open{transform:translateX(0);}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:999;display:none;}
.sidebar-overlay.open{display:block;}
.sidebar-header{padding:24px 20px;border-bottom:1px solid var(--border);background:var(--surface2);}
.sidebar-header h2{font-size:17px;color:var(--accent);font-family:'Syne',sans-serif;}
.sidebar-header p{font-size:11px;color:var(--text-muted);margin-top:4px;}
.sidebar-nav{flex:1;padding:12px 0;}
.sidebar-item{display:flex;align-items:center;gap:14px;padding:14px 20px;background:none;border:none;width:100%;text-align:left;color:var(--text-muted);font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;}
.sidebar-item.active{color:var(--accent);background:var(--accent-dim);border-left:3px solid var(--accent);}
.sidebar-icon{font-size:20px;}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);text-align:center;}

/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));}
.page{display:none;padding:16px;flex-direction:column;gap:14px;}
.page.active{display:flex;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(17,19,24,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100;height:var(--nav-h);box-shadow:0 -4px 24px rgba(0,0,0,.6);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--text-muted);font-size:10px;font-family:'DM Sans',sans-serif;cursor:pointer;padding:6px 2px;position:relative;}
.nav-btn.active{color:var(--accent);}
.nav-icon{font-size:21px;line-height:1;}
.nav-btn::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:var(--accent);border-radius:2px 2px 0 0;transition:width .2s;}
.nav-btn.active::after{width:28px;}
.nav-btn.nav-add{color:var(--accent);font-weight:700;}
.nav-btn.nav-add .nav-icon{font-size:25px;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.stat-value{font-size:22px;font-weight:700;}
.section-title{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* PROGRESS */
.progress-wrap{height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
.progress-bar{height:100%;border-radius:99px;transition:width .5s ease;}

/* TRANSACTIONS */
.tx-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.tx-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tx-info{flex:1;min-width:0;}
.tx-desc{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-meta{font-size:11px;color:var(--text-muted);margin-top:2px;}
.tx-amount{font-size:14px;font-weight:700;flex-shrink:0;}
.tx-detail{display:none;padding:10px 0 8px 52px;flex-wrap:wrap;gap:6px;}
.tx-detail.open{display:flex;animation:fadeIn .2s ease;}

/* CHIPS */
.cat-chip{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--text-muted);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

/* CAT GRID */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:var(--radius-sm);border:1px solid var(--border);background:none;cursor:pointer;}
.cat-btn .ci{font-size:18px;}
.cat-btn .cl{font-size:9px;color:var(--text-muted);text-align:center;line-height:1.2;}
.cat-btn.selected{border-color:currentColor;background:var(--accent-dim);}

/* SCORE */
.score-wrap{display:flex;align-items:center;gap:18px;}
.score-ring-container{position:relative;width:100px;height:100px;flex-shrink:0;}
.score-ring-container svg{transform:rotate(-90deg);}
.score-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-num{font-size:26px;font-weight:800;font-family:'Syne',sans-serif;}
.score-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}

/* BUTTONS */
.btn{padding:13px 20px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;width:100%;}
.btn-accent{background:var(--accent);color:#000;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-ghost{background:var(--border);color:var(--text-muted);}
.btn:active{opacity:.85;}

/* FORMS */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.field input,.field select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;width:100%;}
.field input:focus,.field select:focus{border-color:var(--accent);}
.field select option{background:var(--surface2);}
.toggle-row{display:flex;gap:8px;}
.toggle-btn{flex:1;padding:11px;border-radius:var(--radius-sm);border:1px solid var(--border);background:none;color:var(--text-muted);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:600;}
.toggle-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
.toggle-btn.active-red.active{background:var(--danger-dim);border-color:var(--danger);color:var(--danger);}
.search-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;width:100%;}
.search-bar:focus{border-color:var(--accent);}

/* UPLOAD */
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:28px 20px;text-align:center;cursor:pointer;}
.upload-area:active{border-color:var(--accent);}

/* MEMBER AVATAR */
.member-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;font-family:'Syne',sans-serif;flex-shrink:0;}

/* ALERTS */
.alert{border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;margin-bottom:8px;line-height:1.5;}
.alert-success{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);}
.alert-warning{background:var(--warning-dim);border:1px solid var(--warning);color:var(--warning);}
.alert-danger{background:var(--danger-dim);border:1px solid var(--danger);color:var(--danger);}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:1100;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface2);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:24px 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:88vh;overflow-y:auto;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:var(--border);border:none;color:var(--text-muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);padding:11px 22px;border-radius:40px;font-size:13px;font-weight:600;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.5);border:1px solid var(--border);opacity:0;transition:opacity .3s ease;pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>

<div id="app">
  <header class="header">
    <div class="header-left">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div>
        <div class="header-logo">FinançaFamiliar</div>
        <div class="header-sub" id="headerSub">Minha Família · 0 transações</div>
      </div>

</div>

<!-- SIDEBAR -->

<!-- MODALS -->
<div class="modal-bg" id="modalQuick">

  </div>
</div>

<div class="modal-bg" id="modalGoal">
  <div class="modal">
    <div class="modal-title">Nova Meta <button class="modal-close" data-close="modalGoal">✕</button></div>
    <div class="field"><label>Nome da Meta</label><input id="goalName" placeholder="Ex: Viagem, Reserva..."/></div>

  </div>
</div>

<div class="modal-bg" id="modalContribution">

    <div class="modal-title">Registrar Aporte <button class="modal-close" data-close="modalContribution">✕</button></div>

    <div class="field"><label>Valor do Aporte (R$)</label><input id="contribAmount" type="number" step="0.01" placeholder="0,00"/></div>
    <button class="btn btn-accent" id="contribSaveBtn">Confirmar Aporte</button>
  </div>
</div>

<div class="modal-bg" id="modalMember">
  <div class="modal">
    <div class="modal-title">Novo Membro <button class="modal-close" data-close="modalMember">✕</button></div>
    <div class="field"><label>Nome</label><input id="memberName" placeholder="Ex: Maria, João..."/></div>
    <div class="field"><label>Limite de Gastos (Opcional)</label><input id="memberLimit" type="number" step="0.01" placeholder="0,00"/></div>
    <button class="btn btn-accent" id="memberSaveBtn">Adicionar Membro</button>
  </div>
</div>

<div class="modal-bg" id="modalImportPreview">
  <div class="modal">
    <div class="modal-title">Confirmar Importação <button class="modal-close" data-close="modalImportPreview">✕</button></div>

    <button class="btn btn-accent" id="importConfirmBtn">Confirmar e Salvar</button>
  </div>
</div>

<div class="modal-bg" id="modalConfirm">
  <div class="modal">
    <div class="modal-title">Confirmar Ação <button class="modal-close" data-close="modalConfirm">✕</button></div>
    <p id="confirmMsg" style="font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:24px"></p>

      <button class="btn btn-ghost" data-close="modalConfirm">Cancelar</button>
      <button class="btn btn-danger" id="confirmYes">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

const U = {
  fmt(v){return 'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});},
  fmtShort(v){return v>=1000?'R$ '+(v/1000).toFixed(1).replace('.',',')+' k':this.fmt(v);},
  fmtDate(d){if(!d)return'';const parts=d.split('-');return parts.length===3?parts[2]+'/'+parts[1]:d;},
  today(){return new Date().toISOString().split('T')[0];},
  uid(p='id'){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);},
  pct(v,t){return t>0?Math.min(100,Math.round(v/t*100)):0;},
  barColor(p){return p>=100?'var(--danger)':p>=75?'var(--warning)':'var(--accent)';},
  num(v){const n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?0:n;},
  esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');},
  cat(id){return CATS.find(c=>c.id===id)||CATS[CATS.length-1];},
  autoCat(desc){
    const d=desc.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    for(const cat in KW){if(KW[cat].some(k=>d.includes(k)))return cat;}
    return 'outros';
  },
  isCreditLine(line){return /crédito|credito|pagamento rec|pix rec|ted rec|depósito|deposito|salário|salario|credito em conta|entrada|recebido/i.test(line);}
};

function calcScore(){
  let score=0;const details=[];
  const income=S.config.monthlyIncome||S.totalC()||1;
  const bal=S.balance();const td=S.totalD();const savings=Math.max(0,bal);const reserve=S.config.emergencyFund||0;
  if(bal>=0){score+=30;details.push('✅ Saldo positivo (+30)');}else{details.push('❌ Saldo negativo (0)');}
  if(savings>=income*.1){score+=20;details.push('✅ Poupança ≥ 10% (+20)');}else{details.push('⚠️ Poupança abaixo de 10% (0)');}
  const over=CATS.filter(c=>c.id!=='renda'&&S.catTotal(c.id)>S.catLim(c.id)&&S.catLim(c.id)>0);
  if(over.length===0){score+=20;details.push('✅ Sem categorias estouradas (+20)');}else{details.push('❌ '+over.length+' categoria(s) estourada(s) (0)');}
  if(reserve>=td*3){score+=15;details.push('✅ Reserva de emergência OK (+15)');}else{details.push('⚠️ Reserva insuficiente (0)');}
  const food=S.catTotal('alimentacao');
  if(td>0&&food<=td*.3){score+=15;details.push('✅ Alimentação ≤ 30% (+15)');}else{details.push('⚠️ Alimentação > 30% dos gastos (0)');}
  const color=score>=71?'var(--accent)':score>=41?'var(--warning)':'var(--danger)';
  const msg=score>=71?'Excelente! 🎉':score>=41?'Bom, pode melhorar ⚠️':'Atenção Necessária 🚨';
  return{value:score,color:color,msg:msg,details:details};
}

function genTips(){
  const tips=[];const bal=S.balance();const td=S.totalD();const income=S.config.monthlyIncome||1;const reserve=S.config.emergencyFund||0;
  if(bal<0)tips.push({icon:'🚨',color:'var(--danger)',title:'Gastos maiores que receitas!',text:'Saldo negativo de '+U.fmt(Math.abs(bal))+'. Corte gastos imediatamente.'});
  const food=S.catTotal('alimentacao');if(food>1500)tips.push({icon:'🍽️',color:'var(--orange)',title:'Alimentação acima do ideal',text:U.fmt(food)+' em alimentação. Cozinhar em casa pode economizar até R$300/mês.'});
  const sub=S.catTotal('assinaturas');if(sub>200)tips.push({icon:'📱',color:'var(--blue)',title:'Revise suas assinaturas',text:U.fmt(sub)+'/mês em serviços. Cancele os que não usa há mais de 2 semanas.'});
  const laz=S.catTotal('lazer');if(laz>500)tips.push({icon:'🎬',color:'var(--yellow)',title:'Lazer elevado',text:U.fmt(laz)+' em lazer. Estabeleça um teto e busque opções gratuitas.'});
  const trp=S.catTotal('transporte');if(trp>600)tips.push({icon:'🚗',color:'var(--purple)',title:'Transporte elevado',text:U.fmt(trp)+' em transporte. Avalie caronas, ônibus ou home office.'});
  const poup=Math.max(0,bal);if(poup<income*.1)tips.push({icon:'🏦',color:'var(--accent)',title:'Aumente sua poupança',text:'Meta: 20% da renda ('+U.fmt(income*.2)+'). Transfira automaticamente no dia do salário.'});
  const mc=td>0?(reserve/td).toFixed(1):'0';
  tips.push({icon:'🛡️',color:'var(--green)',title:'Reserva: '+mc+' meses',text:'Meta: 6 meses = '+U.fmt(td*6)+'. Reserva atual: '+U.fmt(reserve)+'.'});

  return tips;
}

// ─── PDF PARSER (CORRIGIDO COM PDF.JS) ───────────────────────────────────────
async function extractPDFText(file) {
  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
    let fullText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(item => item.str).join(' ');
      fullText += pageText + '\n';
    }
    return fullText;
  } catch (error) {
    console.error('Erro PDF.js:', error);
    throw new Error('Não foi possível ler o PDF.');
  }
}

function parsePDF(text){
  const txs=[];
  const lines = text.split('\n');
  lines.forEach(line => {
    const dm=line.match(/(\d{2}[\/\-]\d{2}(?:[\/\-]\d{2,4})?)/);
    const vm=line.match(/(?:R?\$?\s*)?([\d]{1,3}(?:\.[\d]{3})*,\d{2})/);
    if(!dm||!vm)return;
    
    const raw=parseFloat(vm[1].replace(/\./g,'').replace(',','.'));
    if(isNaN(raw)||raw<=0||raw>100000)return;
    
    const isCred=U.isCreditLine(line);
    let desc=line.replace(dm[0],'').replace(vm[0],'').replace(/[|*—\-]{2,}/g,' ').replace(/\s+/g,' ').trim().slice(0,60)||'Transação importada';
    
    const parts=dm[1].split(/[\/\-]/);
    let dateISO=U.today();
    if(parts.length>=2){
      const day=parts[0].padStart(2,'0'),month=parts[1].padStart(2,'0'),year=parts[2]?(parts[2].length===2?'20'+parts[2]:parts[2]):new Date().getFullYear();
      dateISO=year+'-'+month+'-'+day;
    }
    txs.push({id:U.uid('imp'),date:dateISO,description:desc,amount:raw,type:isCred?'credit':'debit',category:isCred?'renda':U.autoCat(desc),memberId:''});
  });
  return txs;
}

    <div class="card" style="margin-bottom:0">

function renderImport(){
  const el=document.getElementById('page-import');
  el.innerHTML=`
    <div class="upload-area" id="uploadArea">
      <div style="font-size:44px;margin-bottom:12px">📄</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">Importar Extrato PDF</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">Nubank · Itaú · Bradesco · Inter · C6 · Santander</div>
      <div style="background:var(--accent);color:#000;display:inline-block;padding:10px 24px;border-radius:var(--radius-sm);font-weight:700;font-size:14px;cursor:pointer">Selecionar PDF</div>
      <input type="file" id="pdfInput" accept=".pdf" style="display:none"/>
    </div>
    <div id="importStatus"></div>`;
  
  document.getElementById('uploadArea')?.addEventListener('click',()=>document.getElementById('pdfInput').click());
  document.getElementById('pdfInput')?.addEventListener('change',async e=>{
    const file = e.target.files[0]; if(!file) return;
    const status = document.getElementById('importStatus');
    status.innerHTML = '<div class="alert alert-warning">⏳ Processando PDF...</div>';
    try {
      const text = await extractPDFText(file);
      const parsed = parsePDF(text);
      if(parsed.length > 0) {
        _pendingImport = parsed;
        const pv = document.getElementById('importPreviewList');
        pv.innerHTML = `
          <div class="alert alert-success">✅ <LaTex>${parsed.length} transações encontradas</div>
          $</LaTex>{parsed.map(t=>{const c=U.cat(t.category);return`
            <div class="tx-item"><div class="tx-icon" style="background:<LaTex>${c.color}22">$</LaTex>{c.icon}</div><div class="tx-info"><div class="tx-desc"><LaTex>${U.esc(t.description)}</div><div class="tx-meta">$</LaTex>{U.fmtDate(t.date)}</div></div><div class="tx-amount">${U.fmt(t.amount)}</div></div>`}).join('')}`;
        openModal('modalImportPreview');
        status.innerHTML = '';
      } else {
        status.innerHTML = '<div class="alert alert-danger">⚠️ Nenhuma transação encontrada. O PDF pode ser uma imagem ou ter formato não suportado.</div>';
      }
    } catch (err) {
      status.innerHTML = '<div class="alert alert-danger">❌ Erro ao ler PDF.</div>';
    }
    e.target.value = '';
  });
}

function buildCatGrid(gridId){
  const el=document.getElementById(gridId);if(!el)return;
  el.innerHTML=CATS.filter(c=>c.id!=='renda').map(c=>`<button class="cat-btn" data-cat="${c.id}" style="color:<LaTex>${c.color}"><span class="ci">$</LaTex>{c.icon}</span><span class="cl">${c.label}</span></button>`).join('');
  el.querySelectorAll('.cat-btn').forEach(btn=>btn.addEventListener('click',()=>{el.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');}));
}

  const el=document.getElementById('page-reports');

  const cats=CATS.filter(c=>c.id!=='renda'&&S.catTotal(c.id)>0).sort((a,b)=>S.catTotal(b.id)-S.catTotal(a.id));

    <div class="card">
      <div class="section-title">Resumo do Período</div>
      <div style="display:flex;justify-content:space-around;padding:16px 0">
        <div style="text-align:center"><div style="font-size:26px;font-weight:700;color:var(--accent)">${U.fmt(tc)}</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">Receitas</div></div>
        <div style="width:1px;background:var(--border)"></div>
        <div style="text-align:center"><div style="font-size:26px;font-weight:700;color:var(--danger)"><LaTex>${U.fmt(td)}</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">Despesas</div></div>

            <div style="text-align:right"><div style="font-size:13px;font-weight:700"><LaTex>${U.fmt(val)}</div><div style="font-size:11px;color:var(--text-muted)">$</LaTex>{p}%</div></div>
          </div>`;}).join('')}

function renderConfig(){
  const el=document.getElementById('page-config');
  const td=S.totalD();const months=td>0?(S.config.emergencyFund/td).toFixed(1):'0';
  el.innerHTML=`
    <div class="card">
      <div class="section-title">👤 Perfil da Família</div>
      <div class="field"><label>Nome da Família</label><input id="cfgName" value="<LaTex>${U.esc(S.config.familyName)}"/></div>
      <div class="field"><label>Renda Mensal (R$</LaTex>)</label><input id="cfgIncome" type="number" value="<LaTex>${S.config.monthlyIncome}"/></div>
      <div class="field"><label>Reserva de Emergência (R$</LaTex>)</label><input id="cfgEmergency" type="number" value="<LaTex>${S.config.emergencyFund}"/></div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px">Sua reserva cobre $</LaTex>{months} meses. Meta: 6 meses = <LaTex>${U.fmt(td*6)}</div>
      <button class="btn btn-accent" id="cfgSaveBtn">Salvar Perfil</button>
    </div>
    <div class="card">
      <div class="section-title">🎯 Limites por Categoria</div>
      $</LaTex>{CATS.filter(c=>c.id!=='renda').map(c=>`
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:18px"><LaTex>${c.icon}</span>
          <span style="flex:1;font-size:13px">$</LaTex>{c.label}</span>
          <input type="number" min="0" class="lim-input" data-cat="<LaTex>${c.id}" value="$</LaTex>{S.catLim(c.id)}" style="width:100px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-size:13px;text-align:right"/>
        </div>`).join('')}
      <button class="btn btn-accent" id="limSaveBtn" style="margin-top:14px">Salvar Limites</button>
    </div>
    <div class="card">
      <div class="section-title">💾 Dados</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn btn-ghost" id="expCsvBtn2">⬇️ Exportar CSV</button>
        <label class="btn btn-ghost" style="text-align:center;cursor:pointer">📥 Importar Backup JSON<input type="file" accept=".json" id="importJsonInput" style="display:none"/></label>
        <button class="btn btn-danger" id="clearBtn">🗑️ Apagar Todos os Dados</button>
      </div>
    </div>`;

  document.getElementById('cfgSaveBtn')?.addEventListener('click',()=>{
    S.updConfig({familyName:document.getElementById('cfgName')?.value||'Minha Família',monthlyIncome:U.num(document.getElementById('cfgIncome')?.value),emergencyFund:U.num(document.getElementById('cfgEmergency')?.value)});
    updateHeader();toast('✅ Perfil salvo!');
  });
  document.getElementById('limSaveBtn')?.addEventListener('click',()=>{
    document.querySelectorAll('.lim-input').forEach(inp=>S.setCatLim(inp.dataset.cat,U.num(inp.value)));
    toast('✅ Limites salvos!');
  });
  document.getElementById('expCsvBtn2')?.addEventListener('click',exportCSV);
  document.getElementById('importJsonInput')?.addEventListener('change',e=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const d=JSON.parse(reader.result);
        if(!d.transactions)return toast('⚠️ Arquivo inválido');
        S.transactions=d.transactions||[];S.members=d.members||[];S.goals=d.goals||[];
        if(d.config)Object.assign(S.config,d.config);
        if(d.catLimits)S.catLimits=d.catLimits;
        S.save();updateHeader();toast('✅ Backup importado!');
      }catch{toast('⚠️ Erro ao ler o arquivo');}
      e.target.value='';
    };
    reader.readAsText(file);
  });

  document.getElementById('clearBtn')?.addEventListener('click',()=>{
    showConfirm('Todos os dados serão apagados permanentemente. O app voltará completamente vazio, sem dados de demonstração. Confirmar?',()=>{
      S.clearAll();
      updateHeader();
      goTo('dashboard');
      toast('✅ Dados apagados. App zerado.');
    });
  });
}

// ─── EXPORTS ─────────────────────────────────────────────────────────────────
function exportCSV(){
  const rows=['Data,Descrição,Valor,Tipo,Categoria,Membro'];
  S.transactions.forEach(t=>{const mem=S.members.find(m=>m.id===t.memberId);const c=U.cat(t.category);rows.push(`"<LaTex>${t.date}","$</LaTex>{t.description.replace(/"/g,'""')}",<LaTex>${t.type==='debit'?-t.amount:t.amount},"$</LaTex>{t.type==='debit'?'Despesa':'Receita'}","<LaTex>${c.label}","$</LaTex>{mem?.name||''}"`);});
  dl(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'}),`financas_<LaTex>${U.today()}.csv`);
  toast('✅ CSV exportado!');
}
function exportJSON(){
  dl(new Blob([JSON.stringify({transactions:S.transactions,members:S.members,goals:S.goals,config:S.config,catLimits:S.catLimits},null,2)],{type:'application/json'}),`financas_backup_$</LaTex>{U.today()}.json`);
  toast('✅ Backup exportado!');
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);}

// ─── QUICK ADD ───────────────────────────────────────────────────────────────
function initQuickAdd(){
  buildCatGrid('qCatGrid');
  document.querySelectorAll('[data-qtype]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('[data-qtype]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const cf=document.getElementById('qCatField');
      if(cf)cf.style.display=btn.dataset.qtype==='debit'?'flex':'none';
    });
  });
  document.getElementById('qSaveBtn')?.addEventListener('click',()=>{
    const desc=document.getElementById('qDesc')?.value.trim();
    const amount=U.num(document.getElementById('qAmount')?.value);
    const type=document.querySelector('[data-qtype].active')?.dataset.qtype||'debit';
    const cat=document.querySelector('#qCatGrid .cat-btn.selected')?.dataset.cat||'outros';
    if(!desc)return toast('⚠️ Preencha a descrição');
    if(amount<=0)return toast('⚠️ Digite um valor válido');
    S.addTx({date:U.today(),description:desc,amount,type,category:type==='credit'?'renda':cat,memberId:''});
    closeModal('modalQuick');
    document.getElementById('qDesc').value='';document.getElementById('qAmount').value='';
    document.querySelectorAll('[data-qtype]').forEach(b=>b.classList.remove('active'));
    document.querySelector('[data-qtype="debit"]')?.classList.add('active');
    document.querySelectorAll('#qCatGrid .cat-btn').forEach(b=>b.classList.remove('selected'));
    updateHeader();
    if(S.ui.page==='dashboard')renderDashboard();
    if(S.ui.page==='transactions')renderTransactions();
    toast('✅ Transação adicionada!');
  });
}

// ─── GLOBAL EVENT DELEGATION ──────────────────────────────────────────────────
document.addEventListener('click',e=>{
  if(e.target.closest('#menuBtn')){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarOverlay').classList.toggle('open');return;}
  if(e.target.id==='sidebarOverlay'){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open');return;}
  const si=e.target.closest('.sidebar-item[data-page]');
  if(si){goTo(si.dataset.page);document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('open');return;}
  const nb=e.target.closest('.nav-btn[data-nav]');
  if(nb){nb.dataset.nav==='add'?openModal('modalQuick'):goTo(nb.dataset.nav);return;}
  const mc=e.target.closest('[data-close]');
  if(mc){closeModal(mc.dataset.close);return;}
  if(e.target.classList.contains('modal-bg')&&e.target.id){closeModal(e.target.id);return;}
  const ti=e.target.closest('.tx-item[data-txid]');
  if(ti&&!e.target.closest('[data-chcat]')&&!e.target.closest('[data-deltx]')){const sid=ti.dataset.txid.replace(/[^a-zA-Z0-9_]/g,'_');document.getElementById('det_'+sid)?.classList.toggle('open');return;}
  const chcat=e.target.closest('[data-chcat]');
  if(chcat){const[txId,catId]=chcat.dataset.chcat.split('|');S.updTxCat(txId,catId);renderTransactions();toast('Categoria atualizada!');return;}
  const deltx=e.target.closest('[data-deltx]');
  if(deltx){const id=deltx.dataset.deltx;const t=S.transactions.find(x=>x.id===id);showConfirm(`Excluir "${t?.description||'transação'}"?`,()=>{S.delTx(id);renderTransactions();updateHeader();toast('🗑️ Excluída.');});return;}
  const fc=e.target.closest('[data-filter]');
  if(fc){S.ui.txFilter=fc.dataset.filter;S.ui.search='';renderTransactions();return;}
  const cg=e.target.closest('[data-contribute]');
  if(cg){_pendingGoalId=cg.dataset.contribute;const g=S.goals.find(x=>x.id===_pendingGoalId);if(g){document.getElementById('contribGoalName').textContent=`Meta: ${g.name}`;document.getElementById('contribAmount').value='';openModal('modalContribution');}return;}
  const dg=e.target.closest('[data-delgoal]');
  if(dg){const id=dg.dataset.delgoal;const g=S.goals.find(x=>x.id===id);showConfirm(`Excluir meta "<LaTex>${g?.name}"?`,()=>{S.delGoal(id);renderGoals();toast('🗑️ Meta excluída.');});return;}
  const dm=e.target.closest('[data-delmem]');
  if(dm){const id=dm.dataset.delmem;const m=S.members.find(x=>x.id===id);showConfirm(`Remover "$</LaTex>{m?.name}"?`,()=>{S.delMember(id);renderMembers();updateHeader();toast('🗑️ Membro removido.');});return;}
  if(e.target.id==='confirmYes'){if(_confirmCb){_confirmCb();_confirmCb=null;}closeModal('modalConfirm');return;}
});

// Modal saves
document.getElementById('goalSaveBtn')?.addEventListener('click',()=>{
  const name=document.getElementById('goalName')?.value.trim();const target=U.num(document.getElementById('goalTarget')?.value);const current=U.num(document.getElementById('goalCurrent')?.value);const deadline=document.getElementById('goalDeadline')?.value;
  if(!name)return toast('⚠️ Digite o nome da meta');if(target<=0)return toast('⚠️ Valor alvo inválido');
  S.addGoal({name,targetAmount:target,currentAmount:current,deadline});closeModal('modalGoal');
  ['goalName','goalTarget','goalCurrent','goalDeadline'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  if(S.ui.page==='budget')renderGoals();toast('✅ Meta criada!');
});
document.getElementById('memberSaveBtn')?.addEventListener('click',()=>{
  const name=document.getElementById('memberName')?.value.trim();const limit=U.num(document.getElementById('memberLimit')?.value);
  if(!name)return toast('⚠️ Digite o nome');if(!S.addMember({name,limit}))return toast('⚠️ Membro já existe');
  closeModal('modalMember');document.getElementById('memberName').value='';document.getElementById('memberLimit').value='';
  if(S.ui.page==='family')renderFamily();toast('✅ Membro adicionado!');
});
document.getElementById('contribSaveBtn')?.addEventListener('click',()=>{
  const amount=U.num(document.getElementById('contribAmount')?.value);
  if(amount<=0)return toast('⚠️ Valor inválido');
  if(_pendingGoalId){S.contributeGoal(_pendingGoalId,amount);closeModal('modalContribution');_pendingGoalId=null;if(S.ui.page==='budget')renderGoals();toast('✅ Aporte registrado!');}
});
document.getElementById('importConfirmBtn')?.addEventListener('click',()=>{
  if(!_pendingImport.length)return;
  _pendingImport.forEach(t=>S.addTx(t));_pendingImport=[];
  closeModal('modalImportPreview');updateHeader();
  if(S.ui.page==='transactions') renderTransactions();
  if(S.ui.page==='dashboard') renderDashboard();
  toast(`✅ Transações importadas com sucesso!`);
});

// ─── INIT ────────────────────────────────────────────────────────────────────
S.load();
initQuickAdd();
goTo('dashboard');
</script>
