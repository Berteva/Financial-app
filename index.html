<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<!--
  FIX 7 + 15: viewport sem maximum-scale para não bloquear acessibilidade,
  mas font-size:16px nos inputs previne o zoom automático do iOS Safari.
  viewport-fit=cover necessário para safe-area-inset funcionar.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="theme-color" content="#0a0c10"/>
<title>FinançaFamiliar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0c10;--surface:#111318;--surface2:#181b22;--border:#1e2130;
  --accent:#00e5a0;--accent-dim:rgba(0,229,160,0.12);--accent-soft:rgba(0,229,160,0.25);
  --danger:#ff4d6d;--danger-dim:rgba(255,77,109,0.12);
  --warning:#f5a623;--warning-dim:rgba(245,166,35,0.12);
  --purple:#a78bfa;--blue:#38bdf8;--orange:#fb923c;--green:#34d399;--yellow:#fbbf24;
  --text:#eef0f6;--text-muted:#6b7280;
  --radius:16px;--radius-sm:10px;--nav-h:68px;
}

/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

/*
FIX 7: Cascata de altura para cobrir todos os iOS:

- 100vh           → baseline universal (inclui barra Safari no iOS antigo)
- -webkit-fill-available → iOS 12-15: exclui barra do Safari corretamente
- 100dvh          → iOS 16+: dynamic viewport height (a solução definitiva)
  NÃO usar position:fixed no body — quebra scroll dentro de containers filhos.
  */
  html{
  height:100%;
  height:-webkit-fill-available;
  }
  body{
  min-height:100vh;
  min-height:-webkit-fill-available;
  min-height:100dvh;
  background:var(–bg);
  color:var(–text);
  font-family:‘DM Sans’,sans-serif;
  /* overscroll-behavior evita “rubber band” indesejado no iOS */
  overscroll-behavior:none;
  /* NÃO usar overflow:hidden aqui — quebra scroll em iOS */
  }
  #app{
  height:100vh;
  height:-webkit-fill-available;
  height:100dvh;
  display:flex;
  flex-direction:column;
  max-width:480px;
  margin:0 auto;
  background:var(–bg);
  /* overflow no container, não no body */
  overflow:hidden;
  }

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(–border);border-radius:4px;}

/* ── HEADER ── */
.header{
background:var(–surface);
border-bottom:1px solid var(–border);
padding:14px 20px;
/* FIX: safe-area para notch/Dynamic Island */
padding-top:calc(14px + env(safe-area-inset-top));
display:flex;justify-content:space-between;align-items:center;
flex-shrink:0;z-index:50;
}
.header-left{display:flex;align-items:center;gap:12px;}
.menu-btn{background:none;border:none;color:var(–text);font-size:22px;cursor:pointer;padding:6px 8px;border-radius:8px;line-height:1;
/* FIX 12: área de toque mínima 44pt Apple HIG */
min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
}
.header-logo{font-family:‘Syne’,sans-serif;font-size:18px;font-weight:800;color:var(–accent);}
.header-sub{font-size:10px;color:var(–text-muted);margin-top:2px;}
.header-balance{text-align:right;}
.header-balance-label{font-size:10px;color:var(–text-muted);text-transform:uppercase;letter-spacing:.05em;}
.header-balance-value{font-size:18px;font-weight:700;}

/* ── STORAGE WARNING BANNER (FIX 6) ── */
#storageWarning{
display:none;background:var(–warning-dim);
border-bottom:1px solid var(–warning);
padding:10px 16px;gap:10px;align-items:center;flex-shrink:0;z-index:49;
}
#storageWarning.show{display:flex;}

/* ── SIDEBAR ── */
.sidebar{
position:fixed;top:0;left:0;width:280px;height:100%;
background:var(–surface);border-right:1px solid var(–border);
z-index:1000;transform:translateX(-100%);
transition:transform .3s cubic-bezier(.4,0,.2,1);
display:flex;flex-direction:column;overflow-y:auto;
/* FIX 10: scroll bounce contido no sidebar */
overscroll-behavior:contain;
-webkit-overflow-scrolling:touch;
}
.sidebar.open{transform:translateX(0);}
/* FIX 5: sem backdrop-filter no overlay — causa lag grave em iPhones mais antigos */
.sidebar-overlay{
position:fixed;inset:0;
background:rgba(0,0,0,.6);
z-index:999;display:none;
}
.sidebar-overlay.open{display:block;}
.sidebar-header{padding:24px 20px;border-bottom:1px solid var(–border);background:var(–surface2);}
.sidebar-header h2{font-size:17px;color:var(–accent);font-family:‘Syne’,sans-serif;}
.sidebar-header p{font-size:11px;color:var(–text-muted);margin-top:4px;}
.sidebar-nav{flex:1;padding:12px 0;}
.sidebar-item{
display:flex;align-items:center;gap:14px;
padding:14px 20px;background:none;border:none;width:100%;
text-align:left;color:var(–text-muted);font-size:14px;
font-family:‘DM Sans’,sans-serif;cursor:pointer;
/* FIX 12: área de toque adequada */
min-height:48px;
}
.sidebar-item.active{color:var(–accent);background:var(–accent-dim);border-left:3px solid var(–accent);}
.sidebar-icon{font-size:20px;}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(–border);font-size:11px;color:var(–text-muted);text-align:center;}

/* ── CONTENT ── */
.content{
flex:1;overflow-y:auto;overflow-x:hidden;
-webkit-overflow-scrolling:touch;
/* FIX 10: scroll bounce contido na área de conteúdo */
overscroll-behavior-y:contain;
padding-bottom:calc(var(–nav-h) + env(safe-area-inset-bottom));
}
.page{display:none;padding:16px;flex-direction:column;gap:14px;}
.page.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.page.active{animation:fadeIn .22s ease;}

/* ── BOTTOM NAV ──
FIX 5: backdrop-filter removido da nav — substituído por fundo opaco sólido.
Em iPhones antigos blur causa drop de frames durante scroll.
*/
.bottom-nav{
position:fixed;bottom:0;left:50%;transform:translateX(-50%);
width:100%;max-width:480px;
background:#111318;  /* sólido — sem backdrop-filter */
border-top:1px solid var(–border);
display:flex;
padding-bottom:env(safe-area-inset-bottom);
z-index:100;height:var(–nav-h);
box-shadow:0 -2px 16px rgba(0,0,0,.7);
}
.nav-btn{
flex:1;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:3px;background:none;border:none;
color:var(–text-muted);font-size:10px;font-family:‘DM Sans’,sans-serif;
cursor:pointer;padding:6px 2px;position:relative;
/* FIX 12: área de toque mínima */
min-height:44px;
}
.nav-btn.active{color:var(–accent);}
.nav-icon{font-size:21px;line-height:1;}
.nav-btn::after{
content:’’;position:absolute;bottom:0;left:50%;transform:translateX(-50%);
width:0;height:2px;background:var(–accent);
border-radius:2px 2px 0 0;transition:width .2s;
}
.nav-btn.active::after{width:28px;}
.nav-btn.nav-add{color:var(–accent);font-weight:700;}
.nav-btn.nav-add .nav-icon{font-size:25px;}

/* ── CARDS ── */
.card{background:var(–surface);border:1px solid var(–border);border-radius:var(–radius);padding:18px 20px;}
.stat-card{background:var(–surface);border:1px solid var(–border);border-radius:var(–radius);padding:16px 18px;}
.stat-label{font-size:11px;color:var(–text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.stat-value{font-size:22px;font-weight:700;}
.section-title{font-size:11px;color:var(–text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ── PROGRESS ── */
.progress-wrap{height:6px;background:var(–border);border-radius:99px;overflow:hidden;}
.progress-bar{height:100%;border-radius:99px;transition:width .5s ease;}

/* ── TRANSACTIONS ── */
.tx-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(–border);cursor:pointer;}
.tx-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tx-info{flex:1;min-width:0;}
.tx-desc{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-meta{font-size:11px;color:var(–text-muted);margin-top:2px;}
.tx-amount{font-size:14px;font-weight:700;flex-shrink:0;}
.tx-detail{display:none;padding:10px 0 8px 52px;flex-wrap:wrap;gap:6px;}
.tx-detail.open{display:flex;animation:fadeIn .2s ease;}

/* ── CHIPS ── */
.cat-chip{
padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;
cursor:pointer;border:1px solid transparent;
/* FIX 12: área mínima */
min-height:32px;display:inline-flex;align-items:center;
}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
padding:6px 14px;border-radius:20px;border:1px solid var(–border);
background:none;color:var(–text-muted);font-size:12px;
font-family:‘DM Sans’,sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0;
min-height:36px;
}
.chip.active{background:var(–accent-dim);border-color:var(–accent);color:var(–accent);}

/* ── CAT GRID ── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cat-btn{
display:flex;flex-direction:column;align-items:center;gap:4px;
padding:10px 4px;border-radius:var(–radius-sm);border:1px solid var(–border);
background:none;cursor:pointer;
/* FIX 12: mínimo tátil */
min-height:60px;
}
.cat-btn .ci{font-size:18px;}
.cat-btn .cl{font-size:9px;color:var(–text-muted);text-align:center;line-height:1.2;}
.cat-btn.selected{border-color:currentColor;background:var(–accent-dim);}

/* ── SCORE ── */
.score-wrap{display:flex;align-items:center;gap:18px;}
.score-ring-container{position:relative;width:100px;height:100px;flex-shrink:0;}
.score-ring-container svg{transform:rotate(-90deg);}
.score-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-num{font-size:26px;font-weight:800;font-family:‘Syne’,sans-serif;}
.score-label{font-size:9px;color:var(–text-muted);text-transform:uppercase;letter-spacing:.05em;}

/* ── BUTTONS ──
FIX 12: todos os botões têm min-height 44px (Apple HIG)
*/
.btn{
padding:13px 20px;border-radius:var(–radius-sm);border:none;
font-size:14px;font-weight:700;font-family:‘DM Sans’,sans-serif;
cursor:pointer;width:100%;min-height:44px;
}
.btn-accent{background:var(–accent);color:#000;}
.btn-danger{background:var(–danger);color:#fff;}
.btn-ghost{background:var(–border);color:var(–text-muted);}
.btn:active{opacity:.82;}

/* ── FORMS ──
FIX 15: font-size:16px em inputs previne zoom automático no Safari iOS.
Nunca usar font-size < 16px em campos de input.
*/
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:11px;color:var(–text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.field input,.field select,.field textarea{
background:var(–surface);border:1px solid var(–border);
border-radius:var(–radius-sm);padding:12px 14px;
color:var(–text);
/* FIX 15: 16px evita zoom no iOS Safari */
font-size:16px;
font-family:‘DM Sans’,sans-serif;outline:none;width:100%;
min-height:44px;
/* FIX: remove estilo padrão iOS nos inputs */
-webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus{border-color:var(–accent);}
.field select option{background:var(–surface2);}
.toggle-row{display:flex;gap:8px;}
.toggle-btn{
flex:1;padding:11px;border-radius:var(–radius-sm);
border:1px solid var(–border);background:none;color:var(–text-muted);
font-size:14px;font-family:‘DM Sans’,sans-serif;cursor:pointer;font-weight:600;
min-height:44px;
}
.toggle-btn.active{background:var(–accent-dim);border-color:var(–accent);color:var(–accent);}
.toggle-btn.active-red.active{background:var(–danger-dim);border-color:var(–danger);color:var(–danger);}

/* FIX 15: search-bar também precisa de 16px */
.search-bar{
background:var(–surface);border:1px solid var(–border);
border-radius:var(–radius-sm);padding:12px 14px;
color:var(–text);font-size:16px;
font-family:‘DM Sans’,sans-serif;outline:none;width:100%;
min-height:44px;-webkit-appearance:none;
}
.search-bar:focus{border-color:var(–accent);}

/* ── UPLOAD ── */
.upload-area{border:2px dashed var(–border);border-radius:var(–radius);padding:28px 20px;text-align:center;cursor:pointer;}
.upload-area:active{border-color:var(–accent);}

/* ── MEMBER AVATAR ── */
.member-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;font-family:‘Syne’,sans-serif;flex-shrink:0;}

/* ── ALERTS ── */
.alert{border-radius:var(–radius-sm);padding:12px 14px;font-size:13px;margin-bottom:8px;line-height:1.5;}
.alert-success{background:var(–accent-dim);border:1px solid var(–accent);color:var(–accent);}
.alert-warning{background:var(–warning-dim);border:1px solid var(–warning);color:var(–warning);}
.alert-danger{background:var(–danger-dim);border:1px solid var(–danger);color:var(–danger);}

/* ── MODAL ──
FIX 9: duplo rAF para animação correta no Safari iOS
FIX 10: overscroll-behavior:contain previne scroll vazando
FIX 16: pb seguro para quando o teclado está aberto
*/
.modal-bg{
position:fixed;inset:0;
background:rgba(0,0,0,.75);
/* FIX 5: sem backdrop-filter — causa lag grave */
z-index:1100;display:none;
align-items:flex-end;justify-content:center;
}
.modal-bg.open{display:flex;}
.modal{
background:var(–surface2);border:1px solid var(–border);
border-radius:24px 24px 0 0;
padding:24px 20px;
padding-bottom:max(24px, env(safe-area-inset-bottom));
width:100%;max-width:480px;
/* FIX 8: max-height menor para dar espaço ao teclado */
max-height:80vh;
overflow-y:auto;
/* FIX 10: scroll do modal não vaza para o fundo */
overscroll-behavior:contain;
-webkit-overflow-scrolling:touch;
}
.modal.slide-up{animation:slideUp .28s cubic-bezier(.4,0,.2,1);}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-title{font-size:17px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{
background:var(–border);border:none;color:var(–text-muted);
width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;
display:flex;align-items:center;justify-content:center;
/* FIX 12: área mínima 44pt — padding compensa */
padding:4px;
}

/* ── TOAST ── */
#toast{
position:fixed;
bottom:calc(var(–nav-h) + 14px + env(safe-area-inset-bottom));
left:50%;transform:translateX(-50%);
background:var(–surface2);color:var(–text);
padding:11px 22px;border-radius:40px;
font-size:14px;font-weight:500;z-index:1300;
box-shadow:0 4px 20px rgba(0,0,0,.5);
border:1px solid var(–border);
white-space:nowrap;pointer-events:none;
opacity:0;transition:opacity .3s;
max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 20px;color:var(–text-muted);}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.4;}

/* ── SVG FIX 14 ──
CSS custom properties não funcionam em atributo fill do SVG no iOS 14-.
Usamos classes para definir a cor do círculo central do donut.
*/
.donut-hole{fill:#111318;}  /* igual a –surface, valor hardcoded para SVG */
</style>

</head>
<body>
<div id="app">

  <!-- HEADER -->

  <div class="header">
    <div class="header-left">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div>
        <div class="header-logo">FinançaFamiliar</div>
        <div class="header-sub" id="headerSub">Carregando…</div>
      </div>
    </div>
    <div class="header-balance">
      <div class="header-balance-label">Saldo</div>
      <div class="header-balance-value" id="headerBalance">R$ 0,00</div>
    </div>
  </div>

  <!-- FIX 6: Banner modo privado — aparece só se localStorage falhar -->

  <div id="storageWarning">
    <span style="font-size:20px;flex-shrink:0">⚠️</span>
    <div style="flex:1">
      <div style="font-size:12px;font-weight:700;color:var(--warning)">Modo privado detectado</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Dados não serão salvos ao fechar. Use o Safari normal para persistir dados.</div>
    </div>
    <button onclick="document.getElementById('storageWarning').classList.remove('show')"
      style="background:none;border:none;color:var(--text-muted);font-size:22px;cursor:pointer;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;">✕</button>
  </div>

  <!-- SIDEBAR -->

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2>📊 Menu</h2><p>FinançaFamiliar v6.0</p></div>
    <div class="sidebar-nav">
      <button class="sidebar-item" data-page="transactions"><span class="sidebar-icon">📋</span> Transações</button>
      <button class="sidebar-item" data-page="budget"><span class="sidebar-icon">🎯</span> Orçamento</button>
      <button class="sidebar-item" data-page="family"><span class="sidebar-icon">👨‍👩‍👧</span> Família</button>
      <button class="sidebar-item" data-page="tips"><span class="sidebar-icon">💡</span> Dicas</button>
      <button class="sidebar-item" data-page="import"><span class="sidebar-icon">📄</span> Importar / Adicionar</button>
      <button class="sidebar-item" data-page="config"><span class="sidebar-icon">⚙️</span> Configurações</button>
    </div>
    <div class="sidebar-footer">💰 Controle financeiro inteligente</div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- PAGES -->

  <div class="content">
    <div class="page active" id="page-dashboard"></div>
    <div class="page" id="page-transactions"></div>
    <div class="page" id="page-budget"></div>
    <div class="page" id="page-family"></div>
    <div class="page" id="page-tips"></div>
    <div class="page" id="page-import"></div>
    <div class="page" id="page-reports"></div>
    <div class="page" id="page-config"></div>
  </div>

  <!-- BOTTOM NAV -->

  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="dashboard"><span class="nav-icon">📊</span>Início</button>
    <button class="nav-btn nav-add" data-nav="add"><span class="nav-icon">➕</span>Lançar</button>
    <button class="nav-btn" data-nav="reports"><span class="nav-icon">📈</span>Dados</button>
  </nav>
</div><!-- /app -->

<!-- ══════════════ MODAIS ══════════════ -->

<!-- Lançamento Rápido -->

<div class="modal-bg" id="modalQuick">
  <div class="modal">
    <div class="modal-title">Lançamento Rápido <button class="modal-close" data-close="modalQuick">✕</button></div>
    <div class="field"><label>Descrição</label><input id="qDesc" placeholder="Ex: iFood, Uber…" autocomplete="off"/></div>
    <div class="field"><label>Valor (R$)</label><input id="qAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00"/></div>
    <div class="field"><label>Tipo</label>
      <div class="toggle-row">
        <button class="toggle-btn active-red active" data-qtype="debit">💸 Despesa</button>
        <button class="toggle-btn" data-qtype="credit">💰 Receita</button>
      </div>
    </div>
    <div class="field" id="qCatField"><label>Categoria</label><div class="cat-grid" id="qCatGrid"></div></div>
    <button class="btn btn-accent" id="qSaveBtn">Adicionar</button>
  </div>
</div>

<!-- Meta -->

<div class="modal-bg" id="modalGoal">
  <div class="modal">
    <div class="modal-title">Nova Meta <button class="modal-close" data-close="modalGoal">✕</button></div>
    <div class="field"><label>Nome</label><input id="goalName" placeholder="Ex: Viagem, Carro…"/></div>
    <div class="field"><label>Valor Alvo (R$)</label><input id="goalTarget" type="number" inputmode="decimal" min="0" placeholder="0,00"/></div>
    <div class="field"><label>Valor Inicial (R$)</label><input id="goalCurrent" type="number" inputmode="decimal" min="0" placeholder="0,00"/></div>
    <!-- FIX 2: input[type=month] não suportado no Safari. Substituído por dois selects. -->
    <div class="field">
      <label>Prazo (Mês / Ano)</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <select id="goalMonth">
          <option value="">Mês</option>
          <option value="01">Janeiro</option><option value="02">Fevereiro</option>
          <option value="03">Março</option><option value="04">Abril</option>
          <option value="05">Maio</option><option value="06">Junho</option>
          <option value="07">Julho</option><option value="08">Agosto</option>
          <option value="09">Setembro</option><option value="10">Outubro</option>
          <option value="11">Novembro</option><option value="12">Dezembro</option>
        </select>
        <select id="goalYear">
          <option value="">Ano</option>
          <option>2025</option><option>2026</option><option>2027</option>

// FIX 18: creditLine verifica palavras específicas de crédito bancário,

function isCreditLine(line){
  const l=line.toLowerCase();
  return /\bsalario\b|\bsalário\b/.test(l)

}

const CHATGPT_PROMPT=`Você é um assistente de finanças pessoais. Vou te enviar o texto ou imagem de um extrato bancário brasileiro.

Extraia TODAS as transações e retorne APENAS um CSV com este formato, sem texto antes ou depois:

AAAA-MM-DD,Descrição,123.45,debito

Regras:

// ══════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════
const U={
  fmt(v){return'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});},
  fmtShort(v){return v>=1000?'R$ '+(v/1000).toFixed(1).replace('.',',')+' k':this.fmt(v);},
  fmtDate(d){if(!d)return'';const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}`:'';},
  today(){return new Date().toISOString().split('T')[0];},
  uid(p='id'){return`${p}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;},
  pct(v,t){return t>0?Math.min(100,Math.round(v/t*100)):0;},
  barColor(p){return p>=100?'var(--danger)':p>=75?'var(--warning)':'var(--accent)';},
  num(v){const n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?0:Math.max(0,n);},
  esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');},
  cat(id){return CATS.find(c=>c.id===id)||CATS[CATS.length-1];},
  // FIX 17: autoCat preserva acentos — usa normalize para comparação mas mantém descrição original
  autoCat(desc){
    const d=desc.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    for(const[cat,kws]of Object.entries(KW)){
      if(kws.some(k=>d.includes(k.normalize('NFD').replace(/[\u0300-\u036f]/g,''))))return cat;
    }
    return'outros';
  },
};

  debits(){return this.transactions.filter(t=>t.type==='debit');},

  totalD(){return this.debits().reduce((s,t)=>s+t.amount,0);},
  totalC(){return this.credits().reduce((s,t)=>s+t.amount,0);},
  balance(){return this.totalC()-this.totalD();},
  catTotal(id){return this.debits().filter(t=>t.category===id).reduce((s,t)=>s+t.amount,0);},
  catLim(id){return this.catLimits[id]??CATS.find(c=>c.id===id)?.lim??0;},
  memSpend(mid){return this.debits().filter(t=>t.memberId===mid).reduce((s,t)=>s+t.amount,0);},
  memColor(i){return MEMBER_COLORS[i%MEMBER_COLORS.length];},

  addTx(tx){this.transactions.unshift({...tx,id:U.uid('tx')});this.save();},
  updTxCat(id,cat){const t=this.transactions.find(t=>t.id===id);if(t){t.category=cat;this.save();}},
  delTx(id){this.transactions=this.transactions.filter(t=>t.id!==id);this.save();},
  addMember(m){if(this.members.some(x=>x.name.toLowerCase()===m.name.toLowerCase()))return false;this.members.push({...m,id:U.uid('mem')});this.save();return true;},
  delMember(id){this.members=this.members.filter(m=>m.id!==id);this.transactions.forEach(t=>{if(t.memberId===id)t.memberId='';});this.save();},
  addGoal(g){this.goals.push({...g,id:U.uid('goal'),currentAmount:g.currentAmount||0});this.save();},
  contributeGoal(id,amt){const g=this.goals.find(g=>g.id===id);if(g){g.currentAmount=Math.min(g.targetAmount,g.currentAmount+amt);this.save();}},
  delGoal(id){this.goals=this.goals.filter(g=>g.id!==id);this.save();},
  updConfig(cfg){Object.assign(this.config,cfg);this.save();},
  setCatLim(id,v){this.catLimits[id]=v;this.save();},

  // FIX 6: detecta falha de localStorage e avisa o usuário
  _storageWarned:false,
  save(){
    try{
      localStorage.setItem('ff_v6',JSON.stringify({
        transactions:this.transactions,members:this.members,goals:this.goals,
        config:this.config,catLimits:this.catLimits,ui:{txFilter:this.ui.txFilter},
      }));
    }catch(e){
      if(!this._storageWarned){
        this._storageWarned=true;
        setTimeout(()=>document.getElementById('storageWarning')?.classList.add('show'),400);
      }
    }
  },

  load(){
    try{

      if(raw){

        this.transactions=p.transactions||[];
        this.members=p.members||[];

  clearAll(){
    this.transactions=[];this.members=[];this.goals=[];
    this.config={familyName:'Minha Família',monthlyIncome:0,emergencyFund:0};
    this.catLimits={};CATS.forEach(c=>{this.catLimits[c.id]=c.lim;});
    this.ui={page:'dashboard',txFilter:'all',search:''};
    try{localStorage.removeItem('ff_v6');}catch(e){}
    this.save();
  },
};

// SCORE
// ══════════════════════════════════════════════════════
function calcScore(){
  let score=0;const details=[];
  const income=S.config.monthlyIncome||S.totalC()||1;
  const bal=S.balance();const td=S.totalD();
  const savings=Math.max(0,bal);const reserve=S.config.emergencyFund||0;
  bal>=0?(score+=30,details.push('✅ Saldo positivo (+30)')):details.push('❌ Saldo negativo (0)');
  savings>=income*.1?(score+=20,details.push('✅ Poupança ≥ 10% (+20)')):details.push('⚠️ Poupança abaixo de 10% (0)');
  const over=CATS.filter(c=>c.id!=='renda'&&S.catTotal(c.id)>S.catLim(c.id)&&S.catLim(c.id)>0);
  over.length===0?(score+=20,details.push('✅ Sem categorias estouradas (+20)')):details.push(`❌ ${over.length} categoria(s) estourada(s) (0)`);
  reserve>=td*3?(score+=15,details.push('✅ Reserva de emergência OK (+15)')):details.push('⚠️ Reserva insuficiente (0)');
  const food=S.catTotal('alimentacao');
  td>0&&food<=td*.3?(score+=15,details.push('✅ Alimentação ≤ 30% (+15)')):details.push('⚠️ Alimentação > 30% dos gastos (0)');
  const color=score>=71?'var(--accent)':score>=41?'var(--warning)':'var(--danger)';
  const msg=score>=71?'Excelente! 🎉':score>=41?'Bom, pode melhorar ⚠️':'Atenção Necessária 🚨';
  return{value:score,color,msg,details};
}

// ══════════════════════════════════════════════════════
// CSV PARSER
// ══════════════════════════════════════════════════════
function parseCSV(text){
  const txs=[];
  const lines=text.trim().split('\n');
  let start=0;
  if(lines[0]&&/data|date|descri|valor|amount/i.test(lines[0]))start=1;
  for(let i=start;i<lines.length;i++){
    const line=lines[i].trim();if(!line)continue;
    const sep=line.includes(';')?';':',';
    const parts=line.split(sep).map(p=>p.replace(/^["']|["']$/g,'').trim());
    if(parts.length<4)continue;
    const[dateRaw,desc,valRaw,tipoRaw]=parts;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dateRaw))continue;
    const amount=parseFloat(valRaw.replace(',','.'));
    if(isNaN(amount)||amount<=0)continue;
    const isCredit=/cred/i.test(tipoRaw);
    const descClean=desc.slice(0,60)||'Transação importada';
    txs.push({id:U.uid('csv'),date:dateRaw,description:descClean,amount:Math.abs(amount),type:isCredit?'credit':'debit',category:isCredit?'renda':U.autoCat(descClean),memberId:''});
  }
  return txs;
}

          <div style="font-size:12px;color:var(--text-muted);line-height:1.7">${sc.details.slice(0,3).join('<br>')}</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-bottom:14px">Distribuição de Gastos</div>
      <div style="display:flex;align-items:center;gap:16px">
        <svg id="donutSvg" width="110" height="110" viewBox="0 0 110 110" style="flex-shrink:0"></svg>
        <div id="donutLegend" style="flex:1;display:flex;flex-direction:column;gap:6px"></div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">🔥 Maiores Gastos</div>
      ${top.length===0
        ?'<div class="empty-text" style="color:var(--text-muted);font-size:13px">Sem despesas registradas</div>'
        :top.map(t=>{const c=U.cat(t.category);return`
          <div class="tx-item" style="cursor:default">
            <div class="tx-icon" style="background:${c.color}22">${c.icon}</div>
            <div class="tx-info"><div class="tx-desc">${U.esc(t.description)}</div><div class="tx-meta">${c.label} · ${U.fmtDate(t.date)}</div></div>
            <div class="tx-amount" style="color:var(--danger)">${U.fmt(t.amount)}</div>
          </div>`;}).join('')}
    </div>`;

  // FIX 14: donut usa classe CSS .donut-hole em vez de fill="var(--surface)"
  // pois CSS custom properties não funcionam em atributos SVG no Safari iOS 14-
  const svg=document.getElementById('donutSvg');
  const leg=document.getElementById('donutLegend');
  if(!svg||!leg)return;
  if(td===0){
    svg.innerHTML=`<circle cx="55" cy="55" r="42" fill="none" stroke="#1e2130" stroke-width="18"/>`;
    leg.innerHTML='<span style="font-size:12px;color:var(--text-muted)">Sem despesas</span>';
    return;
  }
  const cx=55,cy=55,r=42;let ang=-Math.PI/2,paths='';
  catsWV.forEach(c=>{
    const sweep=2*Math.PI*(S.catTotal(c.id)/td);
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
    const x2=cx+r*Math.cos(ang+sweep),y2=cy+r*Math.sin(ang+sweep);
    // FIX 14: fill com valor hexadecimal hardcoded, não var(--surface)
    paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r},0,${sweep>Math.PI?1:0},1,${x2},${y2}Z" fill="${c.color}" opacity=".9"/>`;
    ang+=sweep;
  });
  // FIX 14: círculo central usa fill="#111318" (valor de --surface) em vez de var()
  svg.innerHTML=`${paths}<circle cx="${cx}" cy="${cy}" r="28" fill="#111318"/>`;
  leg.innerHTML=catsWV.slice(0,5).map(c=>`
    <div style="display:flex;align-items:center;gap:8px;font-size:12px">
      <div style="width:8px;height:8px;border-radius:2px;background:${c.color};flex-shrink:0"></div>
      <span style="color:var(--text-muted);flex:1">${c.icon} ${c.label}</span>
      <span style="font-weight:700;color:${c.color}">${U.fmtShort(S.catTotal(c.id))}</span>
    </div>`).join('');
}

function getFilteredTxs(){
  const filter=S.ui.txFilter;const search=S.ui.search;
  let txs=[...S.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(filter==='credit')txs=txs.filter(t=>t.type==='credit');
  else if(filter==='debit')txs=txs.filter(t=>t.type==='debit');
  else if(filter!=='all')txs=txs.filter(t=>t.category===filter);
  if(search)txs=txs.filter(t=>t.description.toLowerCase().includes(search.toLowerCase()));
  return txs;
}

function exportCSV(){

// FIX 4: Cascata de métodos de download compatível com iOS PWA
async function dlText(content,mimeType,filename,successMsg){
const blob=new Blob([content],{type:mimeType+’;charset=utf-8;’});
// Nível 1: Web Share com arquivo (iOS 15+)
if(navigator.canShare&&navigator.share){
try{
const file=new File([blob],filename,{type:mimeType});
if(navigator.canShare({files:[file]})){
await navigator.share({files:[file],title:filename});
toast(successMsg);return;
}
}catch(err){if(err.name===‘AbortError’)return;}
}
// Nível 2: Web Share com texto (iOS 14, apenas CSV)
if(navigator.share&&mimeType===‘text/csv’){
try{await navigator.share({title:filename,text:content});toast(successMsg);return;}
catch(err){if(err.name===‘AbortError’)return;}
}
// Nível 3: link de download (desktop / Android / fallback)
const url=URL.createObjectURL(blob);
const a=document.createElement(‘a’);a.href=url;a.download=filename;a.target=’_blank’;
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(()=>URL.revokeObjectURL(url),5000);
toast(successMsg+’ — toque e segure o arquivo para salvar no iOS’);
}

closeModal(‘modalImportPreview’);updateHeader();
if(S.ui.page===‘transactions’)renderTransactions();
if(S.ui.page===‘dashboard’)renderDashboard();
toast(‘✅ Transações importadas!’);
});

// ══════════════════════════════════════════════════════

S.load();
initQuickAdd();
goTo(‘dashboard’);
</script>
