<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0c10">
<title>FinancaFamiliar</title>
<style>
:root{--bg:#0a0c10;--sur:#111318;--sur2:#181b22;--bor:#1e2130;--acc:#00e5a0;--adim:rgba(0,229,160,0.12);--dan:#ff4d6d;--ddim:rgba(255,77,109,0.12);--war:#f5a623;--wdim:rgba(245,166,35,0.12);--pur:#a78bfa;--blu:#38bdf8;--ora:#fb923c;--gre:#34d399;--yel:#fbbf24;--txt:#eef0f6;--mut:#6b7280;--rad:16px;--rsm:10px;--nav:68px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#0a0c10;color:#eef0f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
#app{height:100vh;height:-webkit-fill-available;height:100dvh;max-width:480px;margin:0 auto;background:#0a0c10;display:flex;flex-direction:column;overflow:hidden;}
.hdr{background:#111318;border-bottom:1px solid #1e2130;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.hdr-l{display:flex;align-items:center;gap:12px;}
.mbtn{background:none;border:none;color:#eef0f6;font-size:22px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.logo{font-size:18px;font-weight:800;color:#00e5a0;}
.sub{font-size:10px;color:#6b7280;margin-top:2px;}
.bal{text-align:right;}
.bal-l{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;}
.bal-v{font-size:18px;font-weight:700;}
#sw{display:none;background:rgba(245,166,35,0.12);border-bottom:1px solid #f5a623;padding:10px 16px;gap:10px;align-items:center;flex-shrink:0;}
#sw.on{display:flex;}
.sid{position:fixed;top:0;left:0;width:280px;height:100%;background:#111318;border-right:1px solid #1e2130;z-index:1000;transform:translateX(-100%);transition:transform .28s ease;display:flex;flex-direction:column;overflow-y:auto;}
.sid.on{transform:translateX(0);}
.sov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:none;}
.sov.on{display:block;}
.sh{padding:24px 20px;border-bottom:1px solid #1e2130;background:#181b22;}
.sh h2{font-size:17px;color:#00e5a0;font-weight:700;}
.sh p{font-size:11px;color:#6b7280;margin-top:4px;}
.snav{flex:1;padding:12px 0;}
.si{display:flex;align-items:center;gap:14px;padding:14px 20px;background:none;border:none;width:100%;text-align:left;color:#6b7280;font-size:14px;cursor:pointer;min-height:48px;}
.si.on{color:#00e5a0;background:rgba(0,229,160,0.12);border-left:3px solid #00e5a0;}
.sft{padding:16px 20px;border-top:1px solid #1e2130;font-size:11px;color:#6b7280;text-align:center;}
.con{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));}
.pg{display:none;padding:16px;flex-direction:column;gap:14px;}
.pg.on{display:flex;}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#111318;border-top:1px solid #1e2130;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:100;height:var(--nav);box-shadow:0 -2px 12px rgba(0,0,0,.6);}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:#6b7280;font-size:10px;cursor:pointer;min-height:44px;position:relative;}
.nb.on{color:#00e5a0;}
.ni{font-size:21px;line-height:1;}
.nb::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:#00e5a0;border-radius:2px 2px 0 0;transition:width .2s;}
.nb.on::after{width:28px;}
.nb.add{color:#00e5a0;font-weight:700;}
.nb.add .ni{font-size:25px;}
.card{background:#111318;border:1px solid #1e2130;border-radius:16px;padding:18px 20px;}
.sc{background:#111318;border:1px solid #1e2130;border-radius:16px;padding:16px 18px;}
.sl{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.sv{font-size:22px;font-weight:700;}
.ttl{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:12px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pw{height:6px;background:#1e2130;border-radius:99px;overflow:hidden;}
.pb{height:100%;border-radius:99px;transition:width .5s;}
.ti{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1e2130;cursor:pointer;}
.tic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tii{flex:1;min-width:0;}
.tid{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tim{font-size:11px;color:#6b7280;margin-top:2px;}
.tia{font-size:14px;font-weight:700;flex-shrink:0;}
.tdt{display:none;padding:10px 0 8px 52px;flex-wrap:wrap;gap:6px;}
.tdt.on{display:flex;}
.cch{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent;min-height:32px;display:inline-flex;align-items:center;}
.chs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.chs::-webkit-scrollbar{display:none;}
.ch{padding:6px 14px;border-radius:20px;border:1px solid #1e2130;background:none;color:#6b7280;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;min-height:36px;}
.ch.on{background:rgba(0,229,160,0.12);border-color:#00e5a0;color:#00e5a0;}
.cgr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;border:1px solid #1e2130;background:none;cursor:pointer;min-height:60px;}
.cb .ci{font-size:18px;}
.cb .cl{font-size:9px;color:#6b7280;text-align:center;line-height:1.2;}
.cb.on{border-color:currentColor;background:rgba(0,229,160,0.12);}
.sr{position:relative;width:100px;height:100px;flex-shrink:0;}
.sr svg{transform:rotate(-90deg);}
.sc2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.sn{font-size:26px;font-weight:800;}
.sk{font-size:9px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;}
.sw2{display:flex;align-items:center;gap:18px;}
.btn{padding:13px 20px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;width:100%;min-height:44px;}
.ba{background:#00e5a0;color:#000;}
.bd{background:#ff4d6d;color:#fff;}
.bg{background:#1e2130;color:#6b7280;}
.btn:active{opacity:.82;}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.fld label{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.fld input,.fld select,.fld textarea{background:#111318;border:1px solid #1e2130;border-radius:10px;padding:12px 14px;color:#eef0f6;font-size:16px;outline:none;width:100%;min-height:44px;-webkit-appearance:none;appearance:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#00e5a0;}
.fld select option{background:#181b22;}
.tr{display:flex;gap:8px;}
.tb{flex:1;padding:11px;border-radius:10px;border:1px solid #1e2130;background:none;color:#6b7280;font-size:14px;cursor:pointer;font-weight:600;min-height:44px;}
.tb.on{background:rgba(0,229,160,0.12);border-color:#00e5a0;color:#00e5a0;}
.tb.red.on{background:rgba(255,77,109,0.12);border-color:#ff4d6d;color:#ff4d6d;}
.sbr{background:#111318;border:1px solid #1e2130;border-radius:10px;padding:12px 14px;color:#eef0f6;font-size:16px;outline:none;width:100%;min-height:44px;-webkit-appearance:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.sbr:focus{border-color:#00e5a0;}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1100;display:none;align-items:flex-end;justify-content:center;}
.mbg.on{display:flex;}
.mod{background:#181b22;border:1px solid #1e2130;border-radius:24px 24px 0 0;padding:24px 20px;padding-bottom:max(24px,env(safe-area-inset-bottom,0px));width:100%;max-width:480px;max-height:80vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .28s ease;}
.mbg.on .mod{transform:translateY(0);}
.mt{font-size:17px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.mc{background:#1e2130;border:none;color:#6b7280;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}
#toast{position:fixed;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#181b22;color:#eef0f6;padding:11px 22px;border-radius:40px;font-size:14px;font-weight:500;z-index:1300;box-shadow:0 4px 20px rgba(0,0,0,.5);border:1px solid #1e2130;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s;max-width:88vw;overflow:hidden;text-overflow:ellipsis;}
.emp{text-align:center;padding:40px 20px;color:#6b7280;}
.alert{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:8px;line-height:1.5;}
.as{background:rgba(0,229,160,0.12);border:1px solid #00e5a0;color:#00e5a0;}
.aw{background:rgba(245,166,35,0.12);border:1px solid #f5a623;color:#f5a623;}
.ae{background:rgba(255,77,109,0.12);border:1px solid #ff4d6d;color:#ff4d6d;}
.mav{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;}
</style>
</head>
<body>
<div id="app">

<div class="hdr">
  <div class="hdr-l">
    <button class="mbtn" id="mbtn">&#9776;</button>
    <div>
      <div class="logo">FinancaFamiliar</div>
      <div class="sub" id="hsub">Carregando...</div>
    </div>
  </div>
  <div class="bal">
    <div class="bal-l">Saldo</div>
    <div class="bal-v" id="hbal">R$ 0,00</div>
  </div>
</div>

<div id="sw">
  <span style="font-size:20px;flex-shrink:0">!</span>
  <div style="flex:1;font-size:12px;color:#f5a623;font-weight:600;">Modo privado: dados nao serao salvos ao fechar.</div>
  <button onclick="this.parentElement.classList.remove('on')" style="background:none;border:none;color:#6b7280;font-size:20px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;">&#215;</button>
</div>

<div class="sid" id="sid">
  <div class="sh"><h2>Menu</h2><p>FinancaFamiliar v9</p></div>
  <div class="snav">
    <button class="si" data-p="transactions">&#128203; Transacoes</button>
    <button class="si" data-p="budget">&#127919; Orcamento</button>
    <button class="si" data-p="family">&#128106; Familia</button>
    <button class="si" data-p="tips">&#128161; Dicas</button>
    <button class="si" data-p="import">&#128196; Importar CSV</button>
    <button class="si" data-p="config">&#9881; Config</button>
  </div>
  <div class="sft">Controle financeiro familiar</div>
</div>
<div class="sov" id="sov"></div>

<div class="con">
  <div class="pg on" id="p-dashboard"></div>
  <div class="pg" id="p-transactions"></div>
  <div class="pg" id="p-budget"></div>
  <div class="pg" id="p-family"></div>
  <div class="pg" id="p-tips"></div>
  <div class="pg" id="p-import"></div>
  <div class="pg" id="p-reports"></div>
  <div class="pg" id="p-config"></div>
</div>

<nav class="bnav">
  <button class="nb on" data-n="dashboard"><span class="ni">&#128202;</span>Inicio</button>
  <button class="nb add" data-n="add"><span class="ni">&#43;</span>Lancar</button>
  <button class="nb" data-n="reports"><span class="ni">&#128200;</span>Dados</button>
</nav>

</div><!-- /app -->

<!-- MODALS -->

<div class="mbg" id="mq">
  <div class="mod">
    <div class="mt">Lancamento Rapido <button class="mc" data-cl="mq">&#215;</button></div>
    <div class="fld"><label>Descricao</label><input id="qd" placeholder="Ex: Mercado, Uber..." autocomplete="off"></div>
    <div class="fld"><label>Valor R$</label><input id="qv" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00"></div>
    <div class="fld"><label>Tipo</label>
      <div class="tr">
        <button class="tb red on" data-qt="debit">Despesa</button>
        <button class="tb" data-qt="credit">Receita</button>
      </div>
    </div>
    <div class="fld" id="qcf"><label>Categoria</label><div class="cgr" id="qcg"></div></div>
    <button class="btn ba" id="qsv">Adicionar</button>
  </div>
</div>

<div class="mbg" id="mgm">
  <div class="mod">
    <div class="mt">Nova Meta <button class="mc" data-cl="mgm">&#215;</button></div>
    <div class="fld"><label>Nome</label><input id="gn" placeholder="Ex: Viagem, Carro..."></div>
    <div class="fld"><label>Valor Alvo R$</label><input id="gt" type="number" inputmode="decimal" min="0" placeholder="0,00"></div>
    <div class="fld"><label>Valor Inicial R$</label><input id="gc" type="number" inputmode="decimal" min="0" placeholder="0,00"></div>
    <div class="fld"><label>Prazo</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <select id="gmo"><option value="">Mes</option><option value="01">Jan</option><option value="02">Fev</option><option value="03">Mar</option><option value="04">Abr</option><option value="05">Mai</option><option value="06">Jun</option><option value="07">Jul</option><option value="08">Ago</option><option value="09">Set</option><option value="10">Out</option><option value="11">Nov</option><option value="12">Dez</option></select>
        <select id="gyr"><option value="">Ano</option><option>2025</option><option>2026</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option></select>
      </div>
    </div>
    <button class="btn ba" id="gsv">Criar Meta</button>
  </div>
</div>

<div class="mbg" id="mmb">
  <div class="mod">
    <div class="mt">Novo Membro <button class="mc" data-cl="mmb">&#215;</button></div>
    <div class="fld"><label>Nome</label><input id="mn" placeholder="Ex: Maria, Joao..."></div>
    <div class="fld"><label>Limite Mensal R$</label><input id="ml" type="number" inputmode="decimal" min="0" placeholder="0,00"></div>
    <button class="btn ba" id="msv">Adicionar</button>
  </div>
</div>

<div class="mbg" id="mct">
  <div class="mod">
    <div class="mt">Aporte em Meta <button class="mc" data-cl="mct">&#215;</button></div>
    <div id="ctn" style="font-size:14px;color:#6b7280;margin-bottom:16px;"></div>
    <div class="fld"><label>Valor R$</label><input id="ctv" type="number" inputmode="decimal" min="0" placeholder="0,00"></div>
    <button class="btn ba" id="ctsv">Confirmar</button>
  </div>
</div>

<div class="mbg" id="mpv">
  <div class="mod">
    <div class="mt">Revisar Importacao <button class="mc" data-cl="mpv">&#215;</button></div>
    <div id="pvl"></div>
    <button class="btn ba" id="pvcf" style="margin-top:10px;">Confirmar Importacao</button>
    <button class="btn bg" data-cl="mpv" style="margin-top:8px;">Cancelar</button>
  </div>
</div>

<div class="mbg" id="mcf">
  <div class="mod">
    <div class="mt">Confirmar <button class="mc" data-cl="mcf">&#215;</button></div>
    <div id="cfm" style="font-size:14px;color:#6b7280;line-height:1.6;margin-bottom:20px;"></div>
    <button class="btn bd" id="cfy">Confirmar</button>
    <button class="btn bg" data-cl="mcf" style="margin-top:10px;">Cancelar</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ============================================================
// SCRIPT AT BOTTOM OF BODY - DOM IS READY, NO WRAPPER NEEDED
// All code is plain ES5 for maximum iOS compatibility
// No external dependencies, no template literals, no arrow functions
// ============================================================

var CATS = [
  {id:'alimentacao', lbl:'Alimentacao', ico:'meal',  color:'#fb923c', lim:1500},
  {id:'transporte',  lbl:'Transporte',  ico:'car',   color:'#38bdf8', lim:600},
  {id:'moradia',     lbl:'Moradia',     ico:'house',  color:'#a78bfa', lim:2000},
  {id:'saude',       lbl:'Saude',       ico:'pill',  color:'#f472b6', lim:400},
  {id:'educacao',    lbl:'Educacao',    ico:'book',  color:'#34d399', lim:800},
  {id:'lazer',       lbl:'Lazer',       ico:'film',  color:'#fbbf24', lim:500},
  {id:'assinaturas', lbl:'Assinaturas', ico:'phone', color:'#60a5fa', lim:300},
  {id:'renda',       lbl:'Renda',       ico:'bag',   color:'#00e5a0', lim:0},
  {id:'outros',      lbl:'Outros',      ico:'box',   color:'#9ca3af', lim:400},
];

// Emoji as HTML entities to avoid encoding issues
var EMOJI = {
  meal:'\uD83C\uDF7D\uFE0F', car:'\uD83D\uDE97', house:'\uD83C\uDFE0',
  pill:'\uD83D\uDC8A', book:'\uD83D\uDCDA', film:'\uD83C\uDFAC',
  phone:'\uD83D\uDCF1', bag:'\uD83D\uDCBC', box:'\uD83D\uDCE6'
};

var MCOLORS = ['#00e5a0','#a78bfa','#38bdf8','#fb923c','#f472b6','#fbbf24','#34d399','#60a5fa'];

var KW = {
  alimentacao: 'ifood rappi mcdonalds burger pizza restaurante padaria supermercado mercado carrefour atacadao lanchonete sushi delivery hortifrutti'.split(' '),
  transporte:  'uber 99taxi cabify gasolina etanol shell posto estacionamento pedagio onibus metro passagem'.split(' '),
  moradia:     'aluguel condominio iptu eletricidade saneamento internet vivo claro tim'.split(' '),
  saude:       'farmacia drogasil drogaraia ultrafarma medico consulta hospital laboratorio unimed'.split(' '),
  educacao:    'escola faculdade cursinho curso livro alura udemy coursera'.split(' '),
  lazer:       'cinema netflix disney hbo deezer steam playstation xbox teatro ingresso airbnb booking'.split(' '),
  assinaturas: 'spotify amazon prime apple google one icloud dropbox adobe canva chatgpt'.split(' '),
  renda:       'salario recebido pix recebido ted recebido transferencia recebida deposito identificado credito em conta'.split(' '),
};

var DEMO = [
  {id:'d1', date:'2025-04-03', desc:'iFood Jantar Familia',  amt:87.50,   type:'debit',  cat:'alimentacao', mid:''},
  {id:'d2', date:'2025-04-02', desc:'Uber Trabalho',          amt:32.90,   type:'debit',  cat:'transporte',  mid:''},
  {id:'d3', date:'2025-04-01', desc:'Netflix',                amt:55.90,   type:'debit',  cat:'lazer',       mid:''},
  {id:'d4', date:'2025-04-01', desc:'Supermercado Extra',     amt:423.60,  type:'debit',  cat:'alimentacao', mid:''},
  {id:'d5', date:'2025-04-01', desc:'Condominio Abril',       amt:850.00,  type:'debit',  cat:'moradia',     mid:''},
  {id:'d6', date:'2025-03-31', desc:'Drogasil Remedios',      amt:118.40,  type:'debit',  cat:'saude',       mid:''},
  {id:'d7', date:'2025-03-30', desc:'Posto Shell Gasolina',   amt:210.00,  type:'debit',  cat:'transporte',  mid:''},
  {id:'d8', date:'2025-03-28', desc:'Spotify Family',         amt:26.90,   type:'debit',  cat:'assinaturas', mid:''},
  {id:'d9', date:'2025-03-27', desc:'Salario Marco',          amt:8500.00, type:'credit', cat:'renda',       mid:''},
  {id:'d10',date:'2025-03-25', desc:'Conta de Luz',           amt:187.30,  type:'debit',  cat:'moradia',     mid:''},
];

// ---- UTILS ----
function gid(id) { return document.getElementById(id); }

function fmt(v) {
  return 'R$ ' + Math.abs(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function fmtS(v) {
  if (v >= 1000) return 'R$ ' + (v/1000).toFixed(1).replace('.', ',') + 'k';
  return fmt(v);
}

function fmtD(d) {
  if (!d) return '';
  var p = d.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] : d;
}

function today() { return new Date().toISOString().split('T')[0]; }

function uid(p) { return (p||'x') + '_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5); }

function pct(v, t) {
  if (t <= 0) return 0;
  var r = Math.round(v / t * 100);
  return r > 100 ? 100 : r;
}

function barColor(p) {
  return p >= 100 ? '#ff4d6d' : p >= 75 ? '#f5a623' : '#00e5a0';
}

function num(v) {
  var n = parseFloat(String(v || '0').replace(',', '.'));
  return isNaN(n) || n < 0 ? 0 : n;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getcat(id) {
  for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i];
  return CATS[CATS.length - 1];
}

function ico(cat) {
  return EMOJI[cat.ico] || '?';
}

function autoCat(desc) {
  var d = desc.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  var ids = Object.keys(KW);
  for (var i = 0; i < ids.length; i++) {
    var kws = KW[ids[i]];
    for (var j = 0; j < kws.length; j++) {
      if (d.indexOf(kws[j]) > -1) return ids[i];
    }
  }
  return 'outros';
}

// ---- STATE ----
var D = {
  txs: [],
  mems: [],
  goals: [],
  cfg: {name: 'Minha Familia', income: 8500, reserve: 0},
  lims: {},
  page: 'dashboard',
  flt: 'all',
  srch: '',
  _warned: false,
};

function totD() {
  var s = 0;
  for (var i = 0; i < D.txs.length; i++) if (D.txs[i].type === 'debit') s += D.txs[i].amt;
  return s;
}

function totC() {
  var s = 0;
  for (var i = 0; i < D.txs.length; i++) if (D.txs[i].type === 'credit') s += D.txs[i].amt;
  return s;
}

function bal() { return totC() - totD(); }

function catTot(id) {
  var s = 0;
  for (var i = 0; i < D.txs.length; i++) if (D.txs[i].type === 'debit' && D.txs[i].cat === id) s += D.txs[i].amt;
  return s;
}

function catLim(id) {
  if (D.lims[id] !== undefined) return D.lims[id];
  return getcat(id).lim || 0;
}

function memSpend(mid) {
  var s = 0;
  for (var i = 0; i < D.txs.length; i++) if (D.txs[i].type === 'debit' && D.txs[i].mid === mid) s += D.txs[i].amt;
  return s;
}

function save() {
  try {
    localStorage.setItem('ff9', JSON.stringify({
      txs: D.txs, mems: D.mems, goals: D.goals,
      cfg: D.cfg, lims: D.lims, flt: D.flt
    }));
  } catch(e) {
    if (!D._warned) {
      D._warned = true;
      setTimeout(function() { var el = gid('sw'); if (el) el.classList.add('on'); }, 500);
    }
  }
}

function load() {
  try {
    var raw = localStorage.getItem('ff9');
    if (raw) {
      var p = JSON.parse(raw);
      D.txs = p.txs || [];
      D.mems = p.mems || [];
      D.goals = p.goals || [];
      if (p.cfg) {
        D.cfg.name = p.cfg.name || D.cfg.name;
        D.cfg.income = p.cfg.income || D.cfg.income;
        D.cfg.reserve = p.cfg.reserve || 0;
      }
      D.lims = p.lims || {};
      if (p.flt) D.flt = p.flt;
      return;
    }
  } catch(e) {}
  D.txs = [];
  for (var i = 0; i < DEMO.length; i++) D.txs.push({id:DEMO[i].id,date:DEMO[i].date,desc:DEMO[i].desc,amt:DEMO[i].amt,type:DEMO[i].type,cat:DEMO[i].cat,mid:DEMO[i].mid});
  for (var i = 0; i < CATS.length; i++) D.lims[CATS[i].id] = CATS[i].lim;
}

// ---- SCORE ----
function score() {
  var s = 0, det = [];
  var inc = D.cfg.income || totC() || 1;
  var b = bal(), td = totD(), sav = b > 0 ? b : 0, res = D.cfg.reserve || 0;
  if (b >= 0) { s += 30; det.push('Saldo positivo (+30)'); } else det.push('Saldo negativo (0)');
  if (sav >= inc * 0.1) { s += 20; det.push('Poupanca >= 10% (+20)'); } else det.push('Poupanca abaixo de 10% (0)');
  var ov = 0;
  for (var i = 0; i < CATS.length; i++) {
    if (CATS[i].id !== 'renda' && catTot(CATS[i].id) > catLim(CATS[i].id) && catLim(CATS[i].id) > 0) ov++;
  }
  if (ov === 0) { s += 20; det.push('Sem categorias estouradas (+20)'); } else det.push(ov + ' cat. estourada(s) (0)');
  if (res >= td * 3) { s += 15; det.push('Reserva de emergencia OK (+15)'); } else det.push('Reserva insuficiente (0)');
  var food = catTot('alimentacao');
  if (td > 0 && food <= td * 0.3) { s += 15; det.push('Alimentacao <= 30% (+15)'); } else det.push('Alimentacao > 30% (0)');
  var col = s >= 71 ? '#00e5a0' : s >= 41 ? '#f5a623' : '#ff4d6d';
  var msg = s >= 71 ? 'Excelente!' : s >= 41 ? 'Bom, pode melhorar' : 'Atencao necessaria';
  return {v: s, col: col, msg: msg, det: det};
}

// ---- NAVIGATION ----
function goTo(page) {
  D.page = page;
  var pgs = document.querySelectorAll('.pg');
  for (var i = 0; i < pgs.length; i++) pgs[i].classList.remove('on');
  var el = gid('p-' + page);
  if (el) el.classList.add('on');
  var nbs = document.querySelectorAll('.nb[data-n]');
  for (var i = 0; i < nbs.length; i++) nbs[i].classList.toggle('on', nbs[i].dataset.n === page);
  var sis = document.querySelectorAll('.si[data-p]');
  for (var i = 0; i < sis.length; i++) sis[i].classList.toggle('on', sis[i].dataset.p === page);
  render(page);
  updHdr();
}

function render(page) {
  if (page === 'dashboard')    rDash();
  else if (page === 'transactions') rTxs();
  else if (page === 'budget')  rBudget();
  else if (page === 'family')  rFamily();
  else if (page === 'tips')    rTips();

  else if (page === 'reports') rReports();
  else if (page === 'config')  rConfig();
}

      '<div class="sc"><div class="sl">Despesas</div><div class="sv" style="color:#ff4d6d">' + fmt(td) + '</div></div>' +
    '</div>' +

      '<div class="sw2">' +
        '<div class="sr">' +
          '<svg width="100" height="100" viewBox="0 0 100 100">' +
            '<circle cx="50" cy="50" r="42" fill="none" stroke="#1e2130" stroke-width="10"/>' +
            '<circle cx="50" cy="50" r="42" fill="none" stroke="' + sc.col + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="' + offs + '"/>' +
          '</svg>' +
          '<div class="sc2"><div class="sn" style="color:' + sc.col + '">' + sc.v + '</div><div class="sk">Score</div></div>' +
        '</div>' +
        '<div style="flex:1">' +
          '<div style="font-size:14px;font-weight:700;margin-bottom:6px;color:' + sc.col + '">' + sc.msg + '</div>' +
          '<div style="font-size:12px;color:#6b7280;line-height:1.7">' + sc.det.slice(0, 3).join('<br>') + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="ttl" style="margin-bottom:14px;">Distribuicao de Gastos</div>' +
      '<div style="display:flex;align-items:center;gap:16px;">' +
        '<svg id="dsv" width="110" height="110" viewBox="0 0 110 110" style="flex-shrink:0;"></svg>' +
        '<div id="dlg" style="flex:1;display:flex;flex-direction:column;gap:6px;"></div>' +

// ---- TRANSACTIONS ----
function filtered() {
  var f = D.flt, q = D.srch;
  var arr = D.txs.slice().sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
  if (f === 'credit') arr = arr.filter(function(t) { return t.type === 'credit'; });
  else if (f === 'debit') arr = arr.filter(function(t) { return t.type === 'debit'; });
  else if (f !== 'all') arr = arr.filter(function(t) { return t.cat === f; });
  if (q) arr = arr.filter(function(t) { return t.desc.toLowerCase().indexOf(q.toLowerCase()) > -1; });
  return arr;
}

function refreshList(arr) {
  var le = gid('txl'), se = gid('txs');
  if (!le) return;
  var td2 = 0, tc2 = 0;
  for (var i = 0; i < arr.length; i++) {
    if (arr[i].type === 'debit') td2 += arr[i].amt;
    else tc2 += arr[i].amt;
  }
  if (se) se.innerHTML = arr.length + ' - <span style="color:#ff4d6d">-' + fmt(td2) + '</span> - <span style="color:#00e5a0">+' + fmt(tc2) + '</span>';
  if (!arr.length) { le.innerHTML = '<div class="emp">Nenhuma transacao</div>'; return; }
  var h = '';
  for (var i = 0; i < arr.length; i++) {
    var t = arr[i], c = getcat(t.cat);

    var sid = t.id.replace(/[^a-zA-Z0-9_]/g, '_');

function parseCSV(text) {
  var txs = [], lines = text.trim().split('\n'), start = 0;
  if (lines[0] && /data|date|descri|valor|amount/i.test(lines[0])) start = 1;
  for (var i = start; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var sep = line.indexOf(';') > -1 ? ';' : ',';
    var parts = line.split(sep);
    for (var j = 0; j < parts.length; j++) parts[j] = parts[j].replace(/^["']|["']$/g,'').trim();
    if (parts.length < 4) continue;
    var dateRaw = parts[0], desc = parts[1], valRaw = parts[2], tipo = parts[3];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateRaw)) continue;
    var amount = parseFloat(valRaw.replace(',', '.'));
    if (isNaN(amount) || amount <= 0) continue;
    var isC = /cred/i.test(tipo);
    var d = desc.slice(0, 60) || 'Transacao';
    txs.push({id:uid('csv'), date:dateRaw, desc:d, amt:Math.abs(amount), type:isC?'credit':'debit', cat:isC?'renda':autoCat(d), mid:''});
  }
  return txs;
}

}
dlText(rows.join(’\n’), ‘text/csv’, ‘financas_’ + today() + ‘.csv’, ‘CSV exportado!’);
}

function exportJSON() {
dlText(JSON.stringify({txs:D.txs,mems:D.mems,goals:D.goals,cfg:D.cfg,lims:D.lims},null,2), ‘application/json’, ‘financas_backup_’ + today() + ‘.json’, ‘Backup exportado!’);
}

function dlText(content, mimeType, filename, msg) {
var blob = new Blob([content], {type: mimeType + ‘;charset=utf-8;’});
// iOS 15+: Web Share API with file
if (navigator.canShare && navigator.share) {
try {
var file = new File([blob], filename, {type: mimeType});
if (navigator.canShare({files: [file]})) {
navigator.share({files:[file], title:filename})
.then(function() { toast(msg); })
.catch(function(e) { if (e.name !== ‘AbortError’) dlFallback(blob, filename, msg); });
return;
}
} catch(e) {}
}
// iOS 14: share as text (CSV only)
if (navigator.share && mimeType === ‘text/csv’) {
navigator.share({title:filename, text:content})
.then(function() { toast(msg); })
.catch(function() { dlFallback(blob, filename, msg); });
return;
}
dlFallback(blob, filename, msg);
}

function dlFallback(blob, filename, msg) {
var url = URL.createObjectURL(blob);
var a = document.createElement(‘a’);
a.href = url; a.download = filename; a.target = ‘_blank’;
document.body.appendChild(a); a.click(); document.body.removeChild(a);
setTimeout(function() { URL.revokeObjectURL(url); }, 5000);
toast(msg);
}

// –– QUICK ADD ––
buildCatGrid(‘qcg’);

var qTypeBtns = document.querySelectorAll(’[data-qt]’);
for (var _i = 0; _i < qTypeBtns.length; _i++) {
(function(btn) {

if (qd2) qd2.value = ‘’; if (qv2) qv2.value = ‘’;

updHdr();
if (D.page === ‘dashboard’) rDash();
if (D.page === ‘transactions’) refreshList(filtered());
toast(‘Transacao adicionada!’);
});

// –– MODAL SAVES ––
var gsv2 = gid(‘gsv’);
if (gsv2) gsv2.addEventListener(‘click’, function() {
var gn2 = gid(‘gn’), gt2 = gid(‘gt’), gc2 = gid(‘gc’), gmo2 = gid(‘gmo’), gyr2 = gid(‘gyr’);

var cur = num(gc2 ? gc2.value : ‘0’);

save();
closeM(‘mgm’);
if (gn2) gn2.value=’’; if (gt2) gt2.value=’’; if (gc2) gc2.value=’’;

toast(‘Meta criada!’);

var msv2 = gid(‘msv’);
if (msv2) msv2.addEventListener(‘click’, function() {
var mn2 = gid(‘mn’), ml2 = gid(‘ml’);
var name = mn2 ? mn2.value.trim() : ‘’;
var lim = num(ml2 ? ml2.value : ‘0’);

closeM(‘mmb’);

var ctsv2 = gid(‘ctsv’);

if (_goalId) {

// –– GLOBAL CLICKS ––
document.addEventListener(‘click’, function(e) {
// Menu button
if (e.target.id === ‘mbtn’ || e.target.closest(’#mbtn’)) {
gid(‘sid’).classList.toggle(‘on’);
gid(‘sov’).classList.toggle(‘on’);
return;
}
// Sidebar overlay
if (e.target.id === ‘sov’) {
gid(‘sid’).classList.remove(‘on’);
gid(‘sov’).classList.remove(‘on’);
return;
}
// Sidebar items
var si = e.target.closest(’.si[data-p]’);
if (si) {
goTo(si.dataset.p);
gid(‘sid’).classList.remove(‘on’);
gid(‘sov’).classList.remove(‘on’);
return;
}
// Bottom nav
var nb = e.target.closest(’.nb[data-n]’);
if (nb) {
if (nb.dataset.n === ‘add’) openM(‘mq’);
else goTo(nb.dataset.n);
return;
}
// Close modals
var cl2 = e.target.closest(’[data-cl]’);
if (cl2) { closeM(cl2.dataset.cl); return; }
if (e.target.classList.contains(‘mbg’) && e.target.id) { closeM(e.target.id); return; }
// Expand transaction
var ti = e.target.closest(’.ti[data-tid]’);
if (ti && !e.target.closest(’[data-cc]’) && !e.target.closest(’[data-dx]’)) {
var sid = ti.dataset.tid.replace(/[^a-zA-Z0-9_]/g,’*’);
var det = gid(’d*’ + sid);
if (det) det.classList.toggle(‘on’);
return;
}
// Change category
var cc = e.target.closest(’[data-cc]’);
if (cc) {
var parts = cc.dataset.cc.split(’|’);
for (var i = 0; i < D.txs.length; i++) { if (D.txs[i].id === parts[0]) { D.txs[i].cat = parts[1]; break; } }
save();
if (gid(‘txl’)) refreshList(filtered());
toast(‘Categoria atualizada!’);
return;
}
// Delete transaction
var dx = e.target.closest(’[data-dx]’);
if (dx) {
var tid = dx.dataset.dx;
var found = null;
for (var i = 0; i < D.txs.length; i++) if (D.txs[i].id === tid) { found = D.txs[i]; break; }
confirm2(‘Excluir “’ + (found ? found.desc : ‘transacao’) + ‘”?’, function() {
D.txs = D.txs.filter(function(t) { return t.id !== tid; });
save();
if (gid(‘txl’)) refreshList(filtered());
updHdr(); toast(‘Excluida.’);
});
return;
}
// Filter chips
var fc = e.target.closest(’[data-f]’);
if (fc) {
D.flt = fc.dataset.f; D.srch = ‘’;
var sx = gid(‘txq’); if (sx) sx.value = ‘’;
var all = document.querySelectorAll(’[data-f]’);
for (var i = 0; i < all.length; i++) all[i].classList.toggle(‘on’, all[i].dataset.f === D.flt);
refreshList(filtered());
return;
}
// Goal contribute
var cg = e.target.closest(’[data-cg]’);
if (cg) {
_goalId = cg.dataset.cg;
for (var i = 0; i < D.goals.length; i++) {
if (D.goals[i].id === _goalId) {
var ctn2 = gid(‘ctn’); if (ctn2) ctn2.textContent = ‘Meta: ’ + D.goals[i].name;
var ctv2b = gid(‘ctv’); if (ctv2b) ctv2b.value = ‘’;
break;
}
}
openM(‘mct’);
return;
}
// Goal delete
var dg = e.target.closest(’[data-dg]’);
if (dg) {
var gid2 = dg.dataset.dg;
var gobj = null;
for (var i = 0; i < D.goals.length; i++) if (D.goals[i].id === gid2) { gobj = D.goals[i]; break; }
confirm2(‘Excluir meta “’ + (gobj ? gobj.name : ‘’) + ‘”?’, function() {
D.goals = D.goals.filter(function(g) { return g.id !== gid2; });
save(); rBudget(); toast(‘Meta excluida.’);
});
return;
}
// Member delete
var dm = e.target.closest(’[data-dm]’);
if (dm) {
var mid2 = dm.dataset.dm;
var mobj = null;
for (var i = 0; i < D.mems.length; i++) if (D.mems[i].id === mid2) { mobj = D.mems[i]; break; }
confirm2(‘Remover “’ + (mobj ? mobj.name : ‘’) + ‘”?’, function() {
D.mems = D.mems.filter(function(m) { return m.id !== mid2; });
for (var i = 0; i < D.txs.length; i++) if (D.txs[i].mid === mid2) D.txs[i].mid = ‘’;
save(); rFamily(); updHdr(); toast(‘Membro removido.’);
});
return;
}
});

goTo(‘dashboard’);
