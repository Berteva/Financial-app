<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0c10"/>
<title>FinançaFamiliar - Controle Financeiro Inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
/* ============================================
   RESET & VARIÁVEIS
   ============================================ */
:root {
  --bg: #0a0c10;
  --surface: #111318;
  --surface2: #181b22;
  --border: #1e2130;
  --accent: #00e5a0;
  --accent-dim: rgba(0, 229, 160, 0.12);
  --accent-soft: rgba(0, 229, 160, 0.25);
  --danger: #ff4d6d;
  --danger-dim: rgba(255, 77, 109, 0.12);
  --warning: #f5a623;
  --warning-dim: rgba(245, 166, 35, 0.12);
  --purple: #a78bfa;
  --blue: #38bdf8;
  --orange: #fb923c;
  --pink: #f472b6;
  --green: #34d399;
  --yellow: #fbbf24;
  --text: #eef0f6;
  --text-muted: #6b7280;
  --radius: 16px;
  --radius-sm: 10px;
  --nav-h: 68px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
}

#app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  background: var(--bg);
}

/* ============================================
   SCROLLBAR
   ============================================ */
::-webkit-scrollbar {
  width: 4px;
}

::-webkit-scrollbar-track {
  background: var(--border);
}

::-webkit-scrollbar-thumb {
  background: var(--accent);
  border-radius: 4px;
}

/* ============================================
   HEADER COM MENU HAMBÚRGUER
   ============================================ */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  padding-top: calc(14px + env(safe-area-inset-top));
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  z-index: 50;
  backdrop-filter: blur(10px);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.menu-btn {
  background: none;
  border: none;
  color: var(--text);
  font-size: 24px;
  cursor: pointer;
  padding: 8px;
  border-radius: 8px;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.menu-btn:active {
  background: var(--surface2);
  transform: scale(0.95);
}

.header-logo {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.5px;
}

.header-sub {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
}

.header-balance {
  text-align: right;
}

.header-balance-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.header-balance-value {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.5px;
  transition: var(--transition);
}

/* ============================================
   MENU LATERAL (HAMBÚRGUER)
   ============================================ */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 280px;
  height: 100%;
  background: var(--surface);
  border-right: 1px solid var(--border);
  z-index: 1000;
  transform: translateX(-100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.sidebar.open {
  transform: translateX(0);
}

.sidebar-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(4px);
  z-index: 999;
  display: none;
}

.sidebar-overlay.open {
  display: block;
}

.sidebar-header {
  padding: 24px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}

.sidebar-header h2 {
  font-size: 18px;
  color: var(--accent);
  font-family: 'Syne', sans-serif;
}

.sidebar-header p {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.sidebar-nav {
  flex: 1;
  padding: 16px 0;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 20px;
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  color: var(--text-muted);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: var(--transition);
}

.sidebar-item:active {
  background: var(--surface2);
}

.sidebar-item.active {
  color: var(--accent);
  background: var(--accent-dim);
  border-left: 3px solid var(--accent);
}

.sidebar-icon {
  font-size: 20px;
}

.sidebar-footer {
  padding: 20px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
}

/* ============================================
   CONTENT
   ============================================ */
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
}

.page {
  display: none;
  padding: 16px;
  flex-direction: column;
  gap: 16px;
  animation: fadeIn 0.3s ease;
}

.page.active {
  display: flex;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ============================================
   NAVEGAÇÃO INFERIOR (APENAS 3 BOTÕES)
   ============================================ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(17, 19, 24, 0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 100;
  height: var(--nav-h);
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.5);
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 11px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  padding: 8px 2px;
  transition: var(--transition);
  position: relative;
}

.nav-btn.active {
  color: var(--accent);
}

.nav-icon {
  font-size: 22px;
  line-height: 1;
  transition: transform 0.2s ease;
}

.nav-btn:active .nav-icon {
  transform: scale(0.95);
}

.nav-btn::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 2px;
  background: var(--accent);
  border-radius: 2px 2px 0 0;
  transition: width 0.2s ease;
}

.nav-btn.active::after {
  width: 28px;
}

.nav-btn.nav-add {
  color: var(--accent);
  font-weight: 700;
}

.nav-btn.nav-add .nav-icon {
  font-size: 26px;
}

/* ============================================
   COMPONENTES
   ============================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  transition: var(--transition);
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  transition: var(--transition);
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.progress-wrap {
  height: 6px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  border-radius: 99px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.section-title {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 12px;
  font-weight: 600;
}

/* Transações */
.tx-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: var(--transition);
}

.tx-item:active {
  background: var(--surface2);
  margin: 0 -8px;
  padding: 12px 8px;
  border-radius: var(--radius-sm);
}

.tx-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.tx-info {
  flex: 1;
  min-width: 0;
}

.tx-desc {
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
}

.tx-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.tx-amount {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
  flex-shrink: 0;
}

.tx-detail {
  display: none;
  padding: 12px 0 8px 52px;
  flex-wrap: wrap;
  gap: 8px;
}

.tx-detail.open {
  display: flex;
  animation: slideDown 0.2s ease;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Categorias */
.cat-chip {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: var(--transition);
}

.cat-chip:active {
  transform: scale(0.95);
}

/* Score */
.score-wrap {
  display: flex;
  align-items: center;
  gap: 20px;
}

.score-ring-container {
  position: relative;
  width: 100px;
  height: 100px;
  flex-shrink: 0;
}

.score-ring-container svg {
  transform: rotate(-90deg);
}

.score-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.score-num {
  font-size: 26px;
  font-weight: 800;
  font-family: 'Syne', sans-serif;
}

.score-label {
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Grids */
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.cat-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 4px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: none;
  cursor: pointer;
  transition: var(--transition);
}

.cat-btn.selected {
  border-color: currentColor;
  background: var(--accent-dim);
  transform: scale(1.02);
}

/* Botões */
.btn {
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 14px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: var(--transition);
  width: 100%;
}

.btn-accent {
  background: var(--accent);
  color: #000;
}

.btn-danger {
  background: var(--danger);
  color: #fff;
}

.btn-ghost {
  background: var(--border);
  color: var(--text-muted);
}

.btn:active {
  transform: scale(0.98);
}

/* Formulários */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.field label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

.field input,
.field select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  color: var(--text);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  width: 100%;
  transition: var(--transition);
}

.field input:focus,
.field select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-dim);
}

.toggle-row {
  display: flex;
  gap: 8px;
}

.toggle-btn {
  flex: 1;
  padding: 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: none;
  color: var(--text-muted);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  font-weight: 600;
  transition: var(--transition);
}

.toggle-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

.toggle-btn.active-red {
  background: var(--danger-dim);
  border-color: var(--danger);
  color: var(--danger);
}

/* Modal */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(8px);
  z-index: 1100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-bg.open {
  display: flex;
  animation: fadeIn 0.2s ease;
}

.modal {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 24px 24px 0 0;
  padding: 24px 20px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from {
    transform: translateY(100%);
  }
  to {
    transform: translateY(0);
  }
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-close {
  background: var(--border);
  border: none;
  color: var(--text-muted);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.modal-close:active {
  background: var(--danger);
  color: white;
}

/* Upload area */
.upload-area {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
}

.upload-area:active {
  border-color: var(--accent);
  background: var(--accent-dim);
}

/* Chips */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.chips::-webkit-scrollbar {
  display: none;
}

.chip {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-muted);
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  white-space: nowrap;
  transition: var(--transition);
  flex-shrink: 0;
}

.chip.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

/* Search */
.search-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  color: var(--text);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  width: 100%;
}

.search-bar:focus {
  border-color: var(--accent);
}

/* Toast */
#toast {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface2);
  color: var(--text);
  padding: 12px 24px;
  border-radius: 40px;
  font-size: 14px;
  font-weight: 500;
  z-index: 1200;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  border: 1px solid var(--accent);
  backdrop-filter: blur(10px);
  white-space: nowrap;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

/* Empty State */
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-muted);
}

.empty-icon {
  font-size: 64px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-text {
  font-size: 14px;
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================
// CONSTANTES
// ============================================
const CATEGORIES = [
  { id: 'alimentacao', label: 'Alimentação', icon: '🍽️', color: '#fb923c', defaultLimit: 1500 },
  { id: 'transporte', label: 'Transporte', icon: '🚗', color: '#38bdf8', defaultLimit: 600 },
  { id: 'moradia', label: 'Moradia', icon: '🏠', color: '#a78bfa', defaultLimit: 2000 },
  { id: 'saude', label: 'Saúde', icon: '💊', color: '#f472b6', defaultLimit: 400 },
  { id: 'educacao', label: 'Educação', icon: '📚', color: '#34d399', defaultLimit: 800 },
  { id: 'lazer', label: 'Lazer', icon: '🎬', color: '#fbbf24', defaultLimit: 500 },
  { id: 'assinaturas', label: 'Assinaturas', icon: '📱', color: '#60a5fa', defaultLimit: 300 },
  { id: 'renda', label: 'Renda', icon: '💼', color: '#00e5a0', defaultLimit: 0 },
  { id: 'outros', label: 'Outros', icon: '📦', color: '#9ca3af', defaultLimit: 400 }
];

const KEYWORDS = {
  alimentacao: ['ifood', 'rappi', 'mcdonalds', 'burger', 'pizza', 'restaurante', 'padaria', 'supermercado', 'mercado', 'carrefour', 'extra'],
  transporte: ['uber', '99taxi', 'combustivel', 'gasolina', 'posto', 'estacionamento', 'onibus', 'metro', 'taxi'],
  moradia: ['aluguel', 'condominio', 'iptu', 'energia', 'agua', 'gas', 'internet', 'vivo', 'claro', 'tim'],
  saude: ['farmacia', 'drogasil', 'medico', 'consulta', 'hospital', 'exame', 'plano de saude'],
  educacao: ['escola', 'faculdade', 'cursinho', 'curso', 'livro', 'material', 'alura', 'udemy'],
  lazer: ['cinema', 'netflix', 'spotify', 'amazon', 'disney', 'hbo', 'steam', 'viagem', 'hotel'],
  assinaturas: ['netflix', 'spotify', 'amazon', 'disney', 'hbo', 'apple', 'google', 'dropbox'],
  renda: ['salario', 'salário', 'pagamento', 'deposito', 'pix', 'transferencia']
};

const DEMO_TRANSACTIONS = [
  { id: 'd1', date: '2025-04-03', description: 'iFood - Jantar Família', amount: 87.50, type: 'debit', category: 'alimentacao', memberId: '' },
  { id: 'd2', date: '2025-04-02', description: 'Uber - Trabalho', amount: 32.90, type: 'debit', category: 'transporte', memberId: '' },
  { id: 'd3', date: '2025-04-01', description: 'Netflix', amount: 55.90, type: 'debit', category: 'assinaturas', memberId: '' },
  { id: 'd4', date: '2025-04-01', description: 'Supermercado Extra', amount: 423.60, type: 'debit', category: 'alimentacao', memberId: '' },
  { id: 'd5', date: '2025-04-01', description: 'Condomínio Abril', amount: 850.00, type: 'debit', category: 'moradia', memberId: '' },
  { id: 'd6', date: '2025-03-31', description: 'Drogasil - Remédios', amount: 118.40, type: 'debit', category: 'saude', memberId: '' },
  { id: 'd7', date: '2025-03-30', description: 'Posto Shell - Gasolina', amount: 210.00, type: 'debit', category: 'transporte', memberId: '' },
  { id: 'd8', date: '2025-03-27', description: 'Salário Março', amount: 8500.00, type: 'credit', category: 'renda', memberId: '' }
];

// ============================================
// UTILITÁRIOS
// ============================================
const Utils = {
  formatCurrency(value) {
    return 'R$ ' + Math.abs(value).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },
  
  formatShortCurrency(value) {
    if (value >= 1000) return 'R$ ' + (value / 1000).toFixed(1).replace('.', ',') + 'k';
    return this.formatCurrency(value);
  },
  
  formatDate(dateStr) {
    if (!dateStr) return '';
    const [year, month, day] = dateStr.split('-');
    return `${day}/${month}`;
  },
  
  getTodayISO() {
    return new Date().toISOString().split('T')[0];
  },
  
  generateId(prefix = 'id') {
    return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
  },
  
  calculatePercentage(value, total) {
    return total > 0 ? Math.min(100, Math.round((value / total) * 100)) : 0;
  },
  
  getProgressColor(percentage) {
    if (percentage >= 100) return 'var(--danger)';
    if (percentage >= 75) return 'var(--warning)';
    return 'var(--accent)';
  },
  
  autoCategorize(description) {
    const desc = description.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    for (const [category, keywords] of Object.entries(KEYWORDS)) {
      if (keywords.some(keyword => desc.includes(keyword))) return category;
    }
    return 'outros';
  },
  
  debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }
};

let AppState = {
  transactions: [],
  members: [],
  goals: [],
  config: { familyName: 'Minha Família', monthlyIncome: 8500, emergencyFund: 0 },
  categoryLimits: {},
  ui: { currentPage: 'dashboard', transactionFilter: 'all', sidebarOpen: false }
};

// ============================================
// PERSISTÊNCIA
// ============================================
function saveState() {
  try {
    localStorage.setItem('financa_familiar_v3', JSON.stringify({
      transactions: AppState.transactions,
      members: AppState.members,
      goals: AppState.goals,
      config: AppState.config,
      categoryLimits: AppState.categoryLimits
    }));
  } catch(e) { console.warn('Save failed:', e); }
}

function loadState() {
  try {
    const saved = localStorage.getItem('financa_familiar_v3');
    if (saved) {
      const parsed = JSON.parse(saved);
      AppState.transactions = parsed.transactions || [];
      AppState.members = parsed.members || [];
      AppState.goals = parsed.goals || [];
      AppState.config = { ...AppState.config, ...parsed.config };
      AppState.categoryLimits = parsed.categoryLimits || {};
      return;
    }
  } catch(e) { console.warn('Load failed:', e); }
  
  // Initialize with demo data
  AppState.transactions = [...DEMO_TRANSACTIONS];
  AppState.categoryLimits = {};
  CATEGORIES.forEach(cat => {
    AppState.categoryLimits[cat.id] = cat.defaultLimit;
  });
}

// ============================================
// MUTAÇÕES DO ESTADO
// ============================================
function addTransaction(transaction) {
  AppState.transactions.unshift({ ...transaction, id: Utils.generateId('tx') });
  saveState();
  renderCurrentPage();
  showToast('✅ Transação adicionada!');
}

function updateTransactionCategory(transactionId, newCategory) {
  const index = AppState.transactions.findIndex(t => t.id === transactionId);
  if (index !== -1) {
    AppState.transactions[index].category = newCategory;
    saveState();
    renderCurrentPage();
    showToast('Categoria atualizada!');
  }
}

function deleteTransaction(transactionId) {
  AppState.transactions = AppState.transactions.filter(t => t.id !== transactionId);
  saveState();
  renderCurrentPage();
  showToast('🗑️ Transação excluída!');
}

function addMember(member) {
  AppState.members.push({ ...member, id: Utils.generateId('mem') });
  saveState();
  renderCurrentPage();
  showToast('✅ Membro adicionado!');
}

function deleteMember(memberId) {
  AppState.members = AppState.members.filter(m => m.id !== memberId);
  AppState.transactions.forEach(t => {
    if (t.memberId === memberId) t.memberId = '';
  });
  saveState();
  renderCurrentPage();
  showToast('Membro removido!');
}

function addGoal(goal) {
  AppState.goals.push({ ...goal, id: Utils.generateId('goal'), currentAmount: goal.currentAmount || 0 });

  renderCurrentPage();
  showToast('✅ Meta criada!');
}

function addGoalContribution(goalId, amount) {
  const goal = AppState.goals.find(g => g.id === goalId);
  if (goal) {
    goal.currentAmount = Math.min(goal.targetAmount, goal.currentAmount + amount);
    saveState();
    renderCurrentPage();
    showToast('✅ Aporte registrado!');

function deleteGoal(goalId) {

  renderCurrentPage();

function updateCategoryLimit(categoryId, limit) {

function setCurrentPage(page) {

// ============================================
// COMPUTED PROPERTIES
// ============================================
function getTotalCredit() {
  return AppState.transactions.filter(t => t.type === 'credit').reduce((sum, t) => sum + t.amount, 0);
}

function getTotalDebit() {
  return AppState.transactions.filter(t => t.type === 'debit').reduce((sum, t) => sum + t.amount, 0);
}

function getBalance() {
  return getTotalCredit() - getTotalDebit();
}

function getCategoryTotal(categoryId) {
  return AppState.transactions
    .filter(t => t.type === 'debit' && t.category === categoryId)
    .reduce((sum, t) => sum + t.amount, 0);
}

function getCategoryLimit(categoryId) {
  return AppState.categoryLimits[categoryId] || CATEGORIES.find(c => c.id === categoryId)?.defaultLimit || 0;
}

function getMemberSpending(memberId) {
  return AppState.transactions
    .filter(t => t.type === 'debit' && t.memberId === memberId)
    .reduce((sum, t) => sum + t.amount, 0);
}

function calculateScore() {
  let score = 0;
  const details = [];
  const monthlyIncome = AppState.config.monthlyIncome || getTotalCredit() || 1;
  const balance = getBalance();
  const totalDebit = getTotalDebit();
  const savings = balance > 0 ? balance : 0;
  const emergencyFund = AppState.config.emergencyFund || 0;
  
  if (balance >= 0) {
    score += 30;
    details.push('✅ Saldo positivo');
  } else {
    details.push('❌ Saldo negativo');
  }
  
  if (savings >= monthlyIncome * 0.1) {
    score += 20;
    details.push('✅ Poupança ≥ 10% da renda');
  } else {
    details.push('⚠️ Poupança abaixo de 10%');
  }
  
  const exceededCategories = CATEGORIES.filter(cat => {
    const spent = getCategoryTotal(cat.id);
    const limit = getCategoryLimit(cat.id);
    return limit > 0 && spent > limit;
  });
  
  if (exceededCategories.length === 0) {
    score += 20;
    details.push('✅ Limites respeitados');
  } else {
    details.push(`❌ ${exceededCategories.length} categoria(s) estourada(s)`);
  }
  
  const monthlyExpenses = totalDebit;
  if (emergencyFund >= monthlyExpenses * 3) {
    score += 15;
    details.push('✅ Reserva de emergência adequada');
  } else {
    details.push('⚠️ Reserva de emergência insuficiente');
  }
  
  const foodExpense = getCategoryTotal('alimentacao');
  if (totalDebit > 0 && foodExpense <= totalDebit * 0.3) {
    score += 15;
    details.push('✅ Alimentação ≤ 30% dos gastos');
  } else {
    details.push('⚠️ Alimentação > 30% dos gastos');
  }
  
  let message = 'Em Desenvolvimento';
  let color = 'var(--warning)';
  if (score >= 71) {
    message = 'Excelente! 🎉';
    color = 'var(--accent)';
  } else if (score >= 41) {
    message = 'Bom, mas pode melhorar';
    color = 'var(--warning)';
  } else {
    message = 'Atenção Necessária 🚨';
    color = 'var(--danger)';
  }
  
  return { value: score, message, details, color };
}

function renderCurrentPage() {
  const pageId = AppState.ui.currentPage;

  if (!pageContainer) return;
  
  // Update active states
  document.querySelectorAll('.sidebar-item').forEach(item => {
    const itemPage = item.dataset.page;
    if (itemPage === pageId) item.classList.add('active');
    else item.classList.remove('active');
  });
  
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const navPage = btn.dataset.nav;
    if (navPage === pageId) btn.classList.add('active');
    else btn.classList.remove('active');
  });
  
  // Render specific page
  const renderers = {
    dashboard: renderDashboard,
    transactions: renderTransactions,
    budget: renderBudget,
    family: renderFamily,
    tips: renderTips,
    reports: renderReports,
    config: renderConfig
  };
  
  if (renderers[pageId]) {
    renderers[pageId](pageContainer);
  }
  
  updateHeader();
}

function generateTips() {
  const tips = [];
  const balance = getBalance();
  const totalDebit = getTotalDebit();
  
  if (balance < 0) {
    tips.push({
      icon: '🚨',
      color: 'var(--danger)',
      title: 'Gastos maiores que receitas!',
      text: `Você está ${Utils.formatCurrency(Math.abs(balance))} negativo. Revise seus gastos urgentemente.`
    });
  }
  
  const foodExpense = getCategoryTotal('alimentacao');
  if (foodExpense > 1500) {
    tips.push({
      icon: '🍽️',
      color: 'var(--orange)',
      title: 'Alimentação acima do ideal',
      text: `Gastou ${Utils.formatCurrency(foodExpense)} em alimentação. Cozinhar em casa pode economizar até R$300/mês.`
    });
  }
  
  const subscriptions = getCategoryTotal('assinaturas');
  if (subscriptions > 200) {
    tips.push({
      icon: '📱',
      color: 'var(--blue)',
      title: 'Revise suas assinaturas',
      text: `${Utils.formatCurrency(subscriptions)} em serviços mensais. Cancele os que não usa.`
    });
  }
  
  const emergencyFund = AppState.config.emergencyFund || 0;
  const monthsCovered = totalDebit > 0 ? (emergencyFund / totalDebit).toFixed(1) : 0;
  tips.push({
    icon: '🛡️',
    color: 'var(--green)',
    title: `Reserva de Emergência: ${monthsCovered} meses`,
    text: `Meta: 6 meses de despesas (${Utils.formatCurrency(totalDebit * 6)}). Sua reserva atual: ${Utils.formatCurrency(emergencyFund)}.`
  });
  
  return tips;
}

function openSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (sidebar) sidebar.classList.add('open');
  if (overlay) overlay.classList.add('open');
  AppState.ui.sidebarOpen = true;
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if (sidebar) sidebar.classList.remove('open');
  if (overlay) overlay.classList.remove('open');
  AppState.ui.sidebarOpen = false;
}

function toggleSidebar() {
  if (AppState.ui.sidebarOpen) {
    closeSidebar();
  } else {
    openSidebar();
  }
}

// ============================================
// MODAL FUNCTIONS
// ============================================
let pendingGoalId = null;

function openModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.classList.add('open');
    modal.style.display = 'flex';
  }
}

function closeModal(modalId) {
  const modal = document.getElementById(modalId);
  if (modal) {
    modal.classList.remove('open');
    modal.style.display = 'none';
  }
}

function showConfirm(message, onConfirm) {
  const confirmMsg = document.getElementById('confirmMessage');
  if (confirmMsg) confirmMsg.textContent = message;
  
  const modal = document.getElementById('modalConfirm');
  if (modal) {
    modal.dataset.onConfirm = onConfirm;
    openModal('modalConfirm');
  }
}

function showToast(message) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.style.opacity = '1';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => {
    toast.style.opacity = '0';
  }, 3000);
}

// ============================================
// EXPORT FUNCTIONS
// ============================================
function exportCSV() {
  const rows = ['Data,Descrição,Valor,Tipo,Categoria,Membro'];
  AppState.transactions.forEach(tx => {
    const member = AppState.members.find(m => m.id === tx.memberId);
    rows.push(`${tx.date},"${tx.description}",${tx.type === 'debit' ? -tx.amount : tx.amount},${tx.type === 'debit' ? 'Despesa' : 'Receita'},${CATEGORIES.find(c => c.id === tx.category)?.label || tx.category},${member?.name || ''}`);
  });
  const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `financas_${Utils.getTodayISO()}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('✅ CSV exportado!');
}

function exportJSON() {
  const data = {
    transactions: AppState.transactions,
    members: AppState.members,
    goals: AppState.goals,
    config: AppState.config,
    categoryLimits: AppState.categoryLimits
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `financas_backup_${Utils.getTodayISO()}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('✅ Backup exportado!');
}

// ============================================
// EVENT DELEGATION
// ============================================
function setupEventDelegation() {
  document.addEventListener('click', (e) => {
    // Menu button
    if (e.target.closest('#menuBtn')) {
      toggleSidebar();
      return;
    }
    
    // Sidebar overlay
    if (e.target.closest('#sidebarOverlay')) {
      closeSidebar();
      return;
    }
    
    // Sidebar navigation
    const sidebarItem = e.target.closest('.sidebar-item');
    if (sidebarItem && sidebarItem.dataset.page) {
      setCurrentPage(sidebarItem.dataset.page);
      return;
    }
    
    // Bottom navigation
    const navBtn = e.target.closest('.nav-btn');
    if (navBtn && navBtn.dataset.nav) {
      if (navBtn.dataset.nav === 'add') {
        openModal('modalQuick');
      } else {
        setCurrentPage(navBtn.dataset.nav);
      }
      return;
    }
    
    // Modal close
    if (e.target.closest('[data-modal-close]')) {
      const btn = e.target.closest('[data-modal-close]');
      closeModal(btn.dataset.modalClose);
      return;
    }
    
    // Modal background close
    const modalBg = e.target.closest('.modal-bg');
    if (modalBg && modalBg.classList.contains('open')) {
      closeModal(modalBg.id);
      return;
    }
    
    // Transaction detail toggle
    const txItem = e.target.closest('.tx-item');
    if (txItem && !e.target.closest('.cat-chip')) {
      const detail = document.getElementById(`detail-${txItem.dataset.transactionId}`);
      if (detail) detail.classList.toggle('open');
      return;
    }
    
    // Filter transactions
    const filterBtn = e.target.closest('[data-filter]');
    if (filterBtn) {
      currentTransactionFilter = filterBtn.dataset.filter;
      renderTransactions(document.getElementById('page-transactions'));
      return;
    }
    
    // Change category
    const changeCat = e.target.closest('[data-change-cat]');
    if (changeCat) {
      const [txId, catId] = changeCat.dataset.changeCat.split('|');
      updateTransactionCategory(txId, catId);
      return;
    }
    
    // Delete transaction
    const deleteTx = e.target.closest('[data-delete-tx]');
    if (deleteTx) {
      const txId = deleteTx.dataset.deleteTx;
      showConfirm('Deseja excluir esta transação?', () => deleteTransaction(txId));
      return;
    }
    
    // Quick add
    if (e.target.closest('[data-action="quick-add"]')) {
      const desc = document.getElementById('quickDesc')?.value.trim();
      const amount = parseFloat(document.getElementById('quickAmount')?.value);
      const type = document.querySelector('[data-quick-type].active')?.dataset.quickType || 'debit';
      const category = document.querySelector('[data-quick-cat].selected')?.dataset.quickCat || 'outros';
      
      if (!desc || !amount || amount <= 0) {
        showToast('⚠️ Preencha descrição e valor válido');
        return;
      }
      
      addTransaction({
        date: Utils.getTodayISO(),
        description: desc,
        amount: amount,
        type: type,
        category: type === 'credit' ? 'renda' : category,
        memberId: ''
      });
      
      closeModal('modalQuick');
      document.getElementById('quickDesc').value = '';
      document.getElementById('quickAmount').value = '';
      return;
    }
    
    // Open goal modal
    if (e.target.closest('[data-action="open-goal-modal"]')) {
      openModal('modalGoal');
      return;
    }
    
    // Add goal
    if (e.target.closest('[data-action="add-goal"]')) {
      const name = document.getElementById('goalName')?.value.trim();
      const target = parseFloat(document.getElementById('goalTarget')?.value);
      const current = parseFloat(document.getElementById('goalCurrent')?.value) || 0;
      const deadline = document.getElementById('goalDeadline')?.value;
      
      if (!name || !target || target <= 0) {
        showToast('⚠️ Preencha nome e valor alvo');
        return;
      }
      
      addGoal({ name, targetAmount: target, currentAmount: current, deadline });
      closeModal('modalGoal');
      document.getElementById('goalName').value = '';
      document.getElementById('goalTarget').value = '';
      document.getElementById('goalCurrent').value = '';
      document.getElementById('goalDeadline').value = '';
      return;
    }
    
    // Contribute to goal
    const contributeBtn = e.target.closest('[data-contribute-goal]');
    if (contributeBtn) {
      pendingGoalId = contributeBtn.dataset.contributeGoal;
      const goal = AppState.goals.find(g => g.id === pendingGoalId);
      if (goal) {
        document.getElementById('contributionGoalName').textContent = `Meta: ${goal.name}`;
        document.getElementById('contributionAmount').value = '';
        openModal('modalContribution');
      }
      return;
    }
    
    // Add contribution
    if (e.target.closest('[data-action="add-contribution"]')) {
      const amount = parseFloat(document.getElementById('contributionAmount')?.value);
      if (!amount || amount <= 0) {
        showToast('⚠️ Digite um valor válido');
        return;
      }
      if (pendingGoalId) {
        addGoalContribution(pendingGoalId, amount);
        closeModal('modalContribution');
        pendingGoalId = null;
      }
      return;
    }
    
    // Delete goal
    const deleteGoalBtn = e.target.closest('[data-delete-goal]');
    if (deleteGoalBtn) {
      const goalId = deleteGoalBtn.dataset.deleteGoal;
      showConfirm('Deseja excluir esta meta?', () => deleteGoal(goalId));
      return;
    }
    
    // Open member modal
    if (e.target.closest('[data-action="open-member-modal"]')) {
      openModal('modalMember');
      return;
    }
    
    // Add member
    if (e.target.closest('[data-action="add-member"]')) {
      const name = document.getElementById('memberName')?.value.trim();
      const limit = parseFloat(document.getElementById('memberLimit')?.value) || 0;
      
      if (!name) {
        showToast('⚠️ Digite o nome do membro');
        return;
      }
      
      addMember({ name, limit });
      closeModal('modalMember');
      document.getElementById('memberName').value = '';
      document.getElementById('memberLimit').value = '';
      return;
    }
    
    // Delete member
    const deleteMemberBtn = e.target.closest('[data-delete-member]');
    if (deleteMemberBtn) {
      const memberId = deleteMemberBtn.dataset.deleteMember;
      showConfirm('Remover este membro? As transações vinculadas ficarão sem vínculo.', () => deleteMember(memberId));
      return;
    }
    
    // Export CSV
    if (e.target.closest('[data-action="export-csv"]')) {
      exportCSV();
      return;
    }
    
    // Export JSON
    if (e.target.closest('[data-action="export-json"]')) {
      exportJSON();
      return;
    }
    
    // Clear data
    if (e.target.closest('[data-action="clear-data"]')) {
      showConfirm('Todos os dados serão apagados permanentemente!', () => {
        clearAllData();
        showToast('Dados reiniciados!');
      });
      return;
    }
    
    // Confirm action
    if (e.target.closest('[data-action="confirm-yes"]')) {
      const modal = document.getElementById('modalConfirm');
      const onConfirm = modal?.dataset.onConfirm;
      if (onConfirm && typeof window[onConfirm] === 'function') {
        window[onConfirm]();
      } else if (onConfirm) {
        eval(onConfirm);
      }
      closeModal('modalConfirm');
      delete modal?.dataset.onConfirm;
      return;
    }
    
    // Update category limit
    const limitInput = e.target.closest('.limit-input');
    if (limitInput) {
      const category = limitInput.dataset.category;
      const limit = parseFloat(limitInput.value) || 0;
      updateCategoryLimit(category, limit);
      showToast('Limite atualizado!');
      return;
    }
    
    // Config save
    const configInputs = ['configName', 'configIncome', 'configEmergency'];
    if (configInputs.some(id => e.target.id === id)) {
      updateConfig({
        familyName: document.getElementById('configName')?.value || '',
        monthlyIncome: parseFloat(document.getElementById('configIncome')?.value) || 0,
        emergencyFund: parseFloat(document.getElementById('configEmergency')?.value) || 0
      });
      return;
    }
  });
  
  // Type toggles delegation
  document.addEventListener('click', (e) => {
    // Quick type toggle
    const quickType = e.target.closest('[data-quick-type]');
    if (quickType) {
      document.querySelectorAll('[data-quick-type]').forEach(btn => btn.classList.remove('active'));
      quickType.classList.add('active');
      const isDebit = quickType.dataset.quickType === 'debit';
      const catGrid = document.getElementById('quickCatGrid');
      if (catGrid) {
        catGrid.style.opacity = isDebit ? '1' : '0.5';
        if (!isDebit) {
          document.querySelectorAll('[data-quick-cat]').forEach(btn => btn.classList.remove('selected'));
        }
      }
      return;
    }
    
    // Quick category select
    const quickCat = e.target.closest('[data-quick-cat]');
    if (quickCat) {
      document.querySelectorAll('[data-quick-cat]').forEach(btn => btn.classList.remove('selected'));
      quickCat.classList.add('selected');
      return;
    }
  });
}

        <button class="sidebar-item" data-page="tips">

        <button class="sidebar-item" data-page="reports">

        <button class="sidebar-item" data-page="config">

      <div class="page" id="page-budget"></div>
      <div class="page" id="page-family"></div>
      <div class="page" id="page-tips"></div>
      <div class="page" id="page-reports"></div>
      <div class="page" id="page-config"></div>
    </div>
    
    <!-- Bottom Navigation (apenas 3 botões) -->
    <nav class="bottom-nav">
      <button class="nav-btn" data-nav="dashboard">
        <span class="nav-icon">📊</span>
        <span>Início</span>
      </button>
      <button class="nav-btn nav-add" data-nav="add">
        <span class="nav-icon">➕</span>
        <span>Lançar</span>
      </button>
      <button class="nav-btn" data-nav="reports">
        <span class="nav-icon">📈</span>
        <span>Dados</span>
      </button>
    </nav>
    
    <!-- Modals -->
    <div class="modal-bg" id="modalQuick">
      <div class="modal">
        <div class="modal-title">Lançamento Rápido <button class="modal-close" data-modal-close="modalQuick">✕</button></div>
        <div class="field"><label>Descrição</label><input id="quickDesc" placeholder="Ex: iFood, Uber..." /></div>
        <div class="field"><label>Valor (R$)</label><input id="quickAmount" type="number" step="0.01" placeholder="0,00" /></div>
        <div class="field"><label>Tipo</label><div class="toggle-row" id="quickTypeToggle"></div></div>
        <div class="field"><label>Categoria</label><div class="cat-grid" id="quickCatGrid"></div></div>
        <button class="btn btn-accent" data-action="quick-add">Adicionar</button>
      </div>
    </div>
    
    <div class="modal-bg" id="modalGoal">
      <div class="modal">
        <div class="modal-title">Nova Meta <button class="modal-close" data-modal-close="modalGoal">✕</button></div>
        <div class="field"><label>Nome da Meta</label><input id="goalName" placeholder="Ex: Viagem, Carro novo..." /></div>
        <div class="field"><label>Valor Alvo (R$)</label><input id="goalTarget" type="number" placeholder="0,00" /></div>
        <div class="field"><label>Valor Inicial (R$)</label><input id="goalCurrent" type="number" placeholder="0,00" /></div>
        <div class="field"><label>Prazo</label><input id="goalDeadline" type="month" /></div>
        <button class="btn btn-accent" data-action="add-goal">Criar Meta</button>

    </div>
    
    <div class="modal-bg" id="modalMember">

        <div class="modal-title">Novo Membro <button class="modal-close" data-modal-close="modalMember">✕</button></div>
        <div class="field"><label>Nome</label><input id="memberName" placeholder="Ex: Maria, João..." /></div>
        <div class="field"><label>Limite Mensal (R$)</label><input id="memberLimit" type="number" placeholder="0,00" /></div>
        <button class="btn btn-accent" data-action="add-member">Adicionar Membro</button>
      </div>
    </div>
    
    <div class="modal-bg" id="modalContribution">
      <div class="modal">
        <div class="modal-title">Registrar Aporte <button class="modal-close" data-modal-close="modalContribution">✕</button></div>
        <div id="contributionGoalName" style="font-size:14px;color:var(--text-muted);margin-bottom:16px;"></div>
        <div class="field"><label>Valor do Aporte (R$)</label><input id="contributionAmount" type="number" placeholder="0,00" /></div>
        <button class="btn btn-accent" data-action="add-contribution">Confirmar Aporte</button>
      </div>
    </div>
    
    <div class="modal-bg" id="modalConfirm">
      <div class="modal">
        <div class="modal-title">⚠️ Confirmar <button class="modal-close" data-modal-close="modalConfirm">✕</button></div>
        <div id="confirmMessage" style="font-size:14px;color:var(--text-muted);margin-bottom:20px;"></div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button class="btn btn-danger" data-action="confirm-yes">Confirmar</button>
          <button class="btn btn-ghost" data-modal-close="modalConfirm">Cancelar</button>
        </div>
      </div>
    </div>
  `;
  
  // Setup quick add UI
  const quickTypeDiv = document.getElementById('quickTypeToggle');
  if (quickTypeDiv) {
    quickTypeDiv.innerHTML = `
      <button class="toggle-btn active-red active" data-quick-type="debit">💸 Despesa</button>
      <button class="toggle-btn" data-quick-type="credit">💰 Receita</button>
    `;
  }
  
  const quickCatGrid = document.getElementById('quickCatGrid');
  if (quickCatGrid) {
    quickCatGrid.innerHTML = CATEGORIES.filter(c => c.id !== 'renda').map(cat => `
      <button class="cat-btn" data-quick-cat="${cat.id}" style="color:${cat.color}">
        <span class="ci">${cat.icon}</span>
        <span class="cl">${cat.label}</span>
      </button>
    `).join('');
  }
}

// ============================================

loadState();
renderApp();
setupEventDelegation();
renderCurrentPage();
</script>
