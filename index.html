<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="theme-color" content="#0a0c10"/>
<title>FinançaFamiliar</title>
<!--
  PWA FIX: Google Fonts bloqueiam o carregamento quando o PWA está offline.
  Fontes embutidas como base64 / system-font stack como fallback imediato.
  Carregamos Google Fonts de forma NÃO-BLOQUEANTE com preconnect + print media trick.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"
  media="print" onload="this.media='all'"/>
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap"/>
</noscript>
<style>
/* ── VARIABLES ─────────────────────────────────────── */
:root{
  --bg:#0a0c10;--surface:#111318;--surface2:#181b22;--border:#1e2130;
  --accent:#00e5a0;--accent-dim:rgba(0,229,160,0.12);
  --danger:#ff4d6d;--danger-dim:rgba(255,77,109,0.12);
  --warning:#f5a623;--warning-dim:rgba(245,166,35,0.12);
  --purple:#a78bfa;--blue:#38bdf8;--orange:#fb923c;--green:#34d399;--yellow:#fbbf24;
  --text:#eef0f6;--text-muted:#6b7280;
  --radius:16px;--radius-sm:10px;--nav-h:68px;
  /* Fallback fonts — app funciona sem Google Fonts */
  --font-body:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-display:'Syne','DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
}

/* ── RESET ─────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

/*
PWA HEIGHT FIX:

- NÃO usar -webkit-fill-available no html — em iOS PWA standalone isso colapsa
  o viewport para 0 em alguns modelos (iPhone SE 2, XR, 11).
- Usar apenas no #app onde o efeito é controlado e seguro.
- html/body ficam com height:100% simples — confiável em todos os iOS.
  */
  html,body{
  height:100%;
  background:var(–bg);
  color:var(–text);
  font-family:var(–font-body);
  /* overscroll-behavior contém o bounce indesejado */
  overscroll-behavior:none;
  /* SEM overflow:hidden no body — quebra scroll em containers filhos no iOS */
  }

/*
#app usa a cascata de altura mais segura:
100vh → -webkit-fill-available → 100dvh
Aplicado no elemento app (não no body) para evitar o colapso.
*/
#app{
height:100vh;
height:-webkit-fill-available;
height:100dvh;
max-width:480px;
margin:0 auto;
background:var(–bg);
display:flex;
flex-direction:column;
overflow:hidden;
position:relative;
}

/* ── SCROLLBAR ─────────────────────────────────────── */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(–border);border-radius:4px;}

/* ── HEADER ────────────────────────────────────────── */
.header{
background:var(–surface);
border-bottom:1px solid var(–border);
padding:14px 20px;
padding-top:calc(14px + env(safe-area-inset-top,0px));
display:flex;justify-content:space-between;align-items:center;
flex-shrink:0;z-index:50;
}
.header-left{display:flex;align-items:center;gap:12px;}
.menu-btn{
background:none;border:none;color:var(–text);
font-size:22px;cursor:pointer;
min-width:44px;min-height:44px;
display:flex;align-items:center;justify-content:center;
border-radius:8px;
}
.header-logo{font-family:var(–font-display);font-size:18px;font-weight:800;color:var(–accent);}
.header-sub{font-size:10px;color:var(–text-muted);margin-top:2px;}
.header-balance{text-align:right;}
.header-balance-label{font-size:10px;color:var(–text-muted);text-transform:uppercase;letter-spacing:.05em;}
.header-balance-value{font-size:18px;font-weight:700;}

/* ── STORAGE WARNING ───────────────────────────────── */
#storageWarning{
display:none;
background:var(–warning-dim);
border-bottom:1px solid var(–warning);
padding:10px 16px;
gap:10px;align-items:center;flex-shrink:0;
}
#storageWarning.show{display:flex;}

/* ── SIDEBAR ───────────────────────────────────────── */
.sidebar{
position:fixed;top:0;left:0;width:280px;height:100%;
background:var(–surface);border-right:1px solid var(–border);
z-index:1000;
transform:translateX(-100%);
transition:transform .28s cubic-bezier(.4,0,.2,1);
display:flex;flex-direction:column;
overflow-y:auto;overscroll-behavior:contain;
-webkit-overflow-scrolling:touch;
}
.sidebar.open{transform:translateX(0);}
.sidebar-overlay{
position:fixed;inset:0;
background:rgba(0,0,0,.55);
z-index:999;display:none;
}
.sidebar-overlay.open{display:block;}
.sidebar-header{padding:24px 20px;border-bottom:1px solid var(–border);background:var(–surface2);}
.sidebar-header h2{font-size:17px;color:var(–accent);font-family:var(–font-display);}
.sidebar-header p{font-size:11px;color:var(–text-muted);margin-top:4px;}
.sidebar-nav{flex:1;padding:12px 0;}
.sidebar-item{
display:flex;align-items:center;gap:14px;
padding:14px 20px;background:none;border:none;width:100%;
text-align:left;color:var(–text-muted);
font-size:14px;font-family:var(–font-body);cursor:pointer;
min-height:48px;
}
.sidebar-item.active{color:var(–accent);background:var(–accent-dim);border-left:3px solid var(–accent);}
.sidebar-icon{font-size:20px;}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(–border);font-size:11px;color:var(–text-muted);text-align:center;}

/* ── CONTENT ───────────────────────────────────────── */
.content{
flex:1;
overflow-y:auto;overflow-x:hidden;
-webkit-overflow-scrolling:touch;
overscroll-behavior-y:contain;
padding-bottom:calc(var(–nav-h) + env(safe-area-inset-bottom,0px));
}
.page{display:none;padding:16px;flex-direction:column;gap:14px;}
.page.active{display:flex;animation:pgIn .22s ease;}
@keyframes pgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ── BOTTOM NAV ────────────────────────────────────── */
/* Sem backdrop-filter — causa lag em iPhones antigos */
.bottom-nav{
position:fixed;bottom:0;left:50%;transform:translateX(-50%);
width:100%;max-width:480px;
background:#111318;
border-top:1px solid var(–border);
display:flex;
padding-bottom:env(safe-area-inset-bottom,0px);
z-index:100;height:var(–nav-h);
box-shadow:0 -2px 12px rgba(0,0,0,.6);
}
.nav-btn{
flex:1;display:flex;flex-direction:column;
align-items:center;justify-content:center;
gap:3px;background:none;border:none;
color:var(–text-muted);font-size:10px;
font-family:var(–font-body);cursor:pointer;
min-height:44px;position:relative;
}
.nav-btn.active{color:var(–accent);}
.nav-icon{font-size:21px;line-height:1;}
.nav-btn::after{
content:’’;position:absolute;bottom:0;left:50%;
transform:translateX(-50%);
width:0;height:2px;background:var(–accent);
border-radius:2px 2px 0 0;transition:width .2s;
}
.nav-btn.active::after{width:28px;}
.nav-btn.nav-add{color:var(–accent);font-weight:700;}
.nav-btn.nav-add .nav-icon{font-size:25px;}

/* ── CARDS ─────────────────────────────────────────── */
.card{background:var(–surface);border:1px solid var(–border);border-radius:var(–radius);padding:18px 20px;}
.stat-card{background:var(–surface);border:1px solid var(–border);border-radius:var(–radius);padding:16px 18px;}
.stat-label{font-size:11px;color:var(–text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.stat-value{font-size:22px;font-weight:700;}
.section-title{font-size:11px;color:var(–text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ── PROGRESS ──────────────────────────────────────── */
.progress-wrap{height:6px;background:var(–border);border-radius:99px;overflow:hidden;}
.progress-bar{height:100%;border-radius:99px;transition:width .5s ease;}

/* ── TRANSACTIONS ──────────────────────────────────── */
.tx-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(–border);cursor:pointer;}
.tx-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tx-info{flex:1;min-width:0;}
.tx-desc{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-meta{font-size:11px;color:var(–text-muted);margin-top:2px;}
.tx-amount{font-size:14px;font-weight:700;flex-shrink:0;}
.tx-detail{display:none;padding:10px 0 8px 52px;flex-wrap:wrap;gap:6px;}
.tx-detail.open{display:flex;}

/* ── CHIPS ─────────────────────────────────────────── */
.cat-chip{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent;min-height:32px;display:inline-flex;align-items:center;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(–border);background:none;color:var(–text-muted);font-size:12px;font-family:var(–font-body);cursor:pointer;white-space:nowrap;flex-shrink:0;min-height:36px;}
.chip.active{background:var(–accent-dim);border-color:var(–accent);color:var(–accent);}

/* ── CAT GRID ──────────────────────────────────────── */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:var(–radius-sm);border:1px solid var(–border);background:none;cursor:pointer;min-height:60px;}
.cat-btn .ci{font-size:18px;}
.cat-btn .cl{font-size:9px;color:var(–text-muted);text-align:center;line-height:1.2;}
.cat-btn.selected{border-color:currentColor;background:var(–accent-dim);}

/* ── SCORE RING ────────────────────────────────────── */
.score-wrap{display:flex;align-items:center;gap:18px;}
.score-ring{position:relative;width:100px;height:100px;flex-shrink:0;}
.score-ring svg{transform:rotate(-90deg);}
.score-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-num{font-size:26px;font-weight:800;font-family:var(–font-display);}
.score-lbl{font-size:9px;color:var(–text-muted);text-transform:uppercase;letter-spacing:.05em;}

/* ── BUTTONS ───────────────────────────────────────── */
.btn{padding:13px 20px;border-radius:var(–radius-sm);border:none;font-size:14px;font-weight:700;font-family:var(–font-body);cursor:pointer;width:100%;min-height:44px;}
.btn-accent{background:var(–accent);color:#000;}
.btn-danger{background:var(–danger);color:#fff;}
.btn-ghost{background:var(–border);color:var(–text-muted);}
.btn:active{opacity:.82;}

/* ── FORMS ─────────────────────────────────────────── */
/* font-size:16px em TODOS os inputs — previne zoom automático no iOS Safari */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:11px;color:var(–text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.field input,.field select,.field textarea{
background:var(–surface);border:1px solid var(–border);
border-radius:var(–radius-sm);padding:12px 14px;
color:var(–text);font-size:16px;
font-family:var(–font-body);outline:none;width:100%;
min-height:44px;-webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(–accent);}
.field select option{background:var(–surface2);}
.toggle-row{display:flex;gap:8px;}
.toggle-btn{flex:1;padding:11px;border-radius:var(–radius-sm);border:1px solid var(–border);background:none;color:var(–text-muted);font-size:14px;font-family:var(–font-body);cursor:pointer;font-weight:600;min-height:44px;}
.toggle-btn.active{background:var(–accent-dim);border-color:var(–accent);color:var(–accent);}
.toggle-btn.active-red.active{background:var(–danger-dim);border-color:var(–danger);color:var(–danger);}
.search-bar{background:var(–surface);border:1px solid var(–border);border-radius:var(–radius-sm);padding:12px 14px;color:var(–text);font-size:16px;font-family:var(–font-body);outline:none;width:100%;min-height:44px;-webkit-appearance:none;}
.search-bar:focus{border-color:var(–accent);}

/* ── UPLOAD ────────────────────────────────────────── */
.upload-area{border:2px dashed var(–border);border-radius:var(–radius);padding:28px 20px;text-align:center;cursor:pointer;}
.upload-area:active{border-color:var(–accent);}

/* ── MEMBER AVATAR ─────────────────────────────────── */
.member-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;font-family:var(–font-display);flex-shrink:0;}

/* ── ALERTS ────────────────────────────────────────── */
.alert{border-radius:var(–radius-sm);padding:12px 14px;font-size:13px;margin-bottom:8px;line-height:1.5;}
.alert-success{background:var(–accent-dim);border:1px solid var(–accent);color:var(–accent);}
.alert-warning{background:var(–warning-dim);border:1px solid var(–warning);color:var(–warning);}
.alert-danger{background:var(–danger-dim);border:1px solid var(–danger);color:var(–danger);}

/* ── MODAL ─────────────────────────────────────────── */
/* Sem backdrop-filter — causa lag */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1100;display:none;align-items:flex-end;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{
background:var(–surface2);border:1px solid var(–border);
border-radius:24px 24px 0 0;
padding:24px 20px;
padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
width:100%;max-width:480px;
max-height:80vh;
overflow-y:auto;overscroll-behavior:contain;
-webkit-overflow-scrolling:touch;
transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.modal-bg.open .modal{transform:translateY(0);}
.modal-title{font-size:17px;font-weight:700;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.modal-close{background:var(–border);border:none;color:var(–text-muted);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}

/* ── TOAST ─────────────────────────────────────────── */
#toast{
position:fixed;
bottom:calc(var(–nav-h) + 14px + env(safe-area-inset-bottom,0px));
left:50%;transform:translateX(-50%);
background:var(–surface2);color:var(–text);
padding:11px 22px;border-radius:40px;font-size:14px;font-weight:500;
z-index:1300;box-shadow:0 4px 20px rgba(0,0,0,.5);border:1px solid var(–border);
white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s;
max-width:88vw;overflow:hidden;text-overflow:ellipsis;
}

/* ── EMPTY ─────────────────────────────────────────── */
.empty{text-align:center;padding:40px 20px;color:var(–text-muted);}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.4;}
</style>

</head>
<body>
<div id="app">

  <div class="header">
    <div class="header-left">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div>
        <div class="header-logo">FinançaFamiliar</div>
        <div class="header-sub" id="headerSub">Carregando…</div>
      </div>
    </div>
    <div class="header-balance">
      <div class="header-balance-label">Saldo</div>
      <div class="header-balance-value" id="headerBalance">R$ 0,00</div>
    </div>
  </div>

  <div id="storageWarning">
    <span style="font-size:20px;flex-shrink:0">⚠️</span>
    <div style="flex:1">
      <div style="font-size:12px;font-weight:700;color:var(--warning)">Modo privado detectado</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Dados não serão salvos. Use o Safari normal.</div>
    </div>
    <button onclick="this.parentElement.classList.remove('show')"
      style="background:none;border:none;color:var(--text-muted);font-size:22px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;">✕</button>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2>📊 Menu</h2><p>FinançaFamiliar v7</p></div>
    <div class="sidebar-nav">
      <button class="sidebar-item" data-page="transactions"><span class="sidebar-icon">📋</span> Transações</button>
      <button class="sidebar-item" data-page="budget"><span class="sidebar-icon">🎯</span> Orçamento</button>
      <button class="sidebar-item" data-page="family"><span class="sidebar-icon">👨‍👩‍👧</span> Família</button>
      <button class="sidebar-item" data-page="tips"><span class="sidebar-icon">💡</span> Dicas</button>
      <button class="sidebar-item" data-page="import"><span class="sidebar-icon">📄</span> Importar</button>
      <button class="sidebar-item" data-page="config"><span class="sidebar-icon">⚙️</span> Config</button>
    </div>
    <div class="sidebar-footer">💰 FinançaFamiliar v7</div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="content">
    <div class="page active" id="page-dashboard"></div>
    <div class="page" id="page-transactions"></div>
    <div class="page" id="page-budget"></div>
    <div class="page" id="page-family"></div>
    <div class="page" id="page-tips"></div>
    <div class="page" id="page-import"></div>
    <div class="page" id="page-reports"></div>
    <div class="page" id="page-config"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="dashboard"><span class="nav-icon">📊</span>Início</button>
    <button class="nav-btn nav-add" data-nav="add"><span class="nav-icon">➕</span>Lançar</button>
    <button class="nav-btn" data-nav="reports"><span class="nav-icon">📈</span>Dados</button>
  </nav>
</div>

<!-- MODALS -->

<div class="modal-bg" id="modalQuick">
  <div class="modal">
    <div class="modal-title">Lançar <button class="modal-close" data-close="modalQuick">✕</button></div>
    <div class="field"><label>Descrição</label><input id="qDesc" placeholder="Ex: iFood, Uber…" autocomplete="off"/></div>
    <div class="field"><label>Valor (R$)</label><input id="qAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00"/></div>
    <div class="field"><label>Tipo</label>
      <div class="toggle-row">
        <button class="toggle-btn active-red active" data-qtype="debit">💸 Despesa</button>
        <button class="toggle-btn" data-qtype="credit">💰 Receita</button>
      </div>
    </div>
    <div class="field" id="qCatField"><label>Categoria</label><div class="cat-grid" id="qCatGrid"></div></div>
    <button class="btn btn-accent" id="qSaveBtn">Adicionar</button>
  </div>
</div>

<div class="modal-bg" id="modalGoal">
  <div class="modal">
    <div class="modal-title">Nova Meta <button class="modal-close" data-close="modalGoal">✕</button></div>
    <div class="field"><label>Nome</label><input id="goalName" placeholder="Ex: Viagem, Carro…"/></div>
    <div class="field"><label>Valor Alvo (R$)</label><input id="goalTarget" type="number" inputmode="decimal" min="0" placeholder="0,00"/></div>
    <div class="field"><label>Valor Inicial (R$)</label><input id="goalCurrent" type="number" inputmode="decimal" min="0" placeholder="0,00"/></div>
    <div class="field">
      <label>Prazo</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <select id="goalMonth"><option value="">Mês</option><option value="01">Jan</option><option value="02">Fev</option><option value="03">Mar</option><option value="04">Abr</option><option value="05">Mai</option><option value="06">Jun</option><option value="07">Jul</option><option value="08">Ago</option><option value="09">Set</option><option value="10">Out</option><option value="11">Nov</option><option value="12">Dez</option></select>
        <select id="goalYear"><option value="">Ano</option><option>2025</option><option>2026</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option></select>
      </div>
    </div>
    <button class="btn btn-accent" id="goalSaveBtn">Criar Meta</button>
  </div>
</div>

<div class="modal-bg" id="modalMember">
  <div class="modal">
    <div class="modal-title">Novo Membro <button class="modal-close" data-close="modalMember">✕</button></div>
    <div class="field"><label>Nome</label><input id="memberName" placeholder="Ex: Maria, João…"/></div>
    <div class="field"><label>Limite Mensal (R$)</label><input id="memberLimit" type="number" inputmode="decimal" min="0" placeholder="0,00"/></div>
    <button class="btn btn-accent" id="memberSaveBtn">Adicionar</button>
  </div>
</div>

<div class="modal-bg" id="modalContrib">
  <div class="modal">
    <div class="modal-title">Registrar Aporte <button class="modal-close" data-close="modalContrib">✕</button></div>
    <div id="contribGoalName" style="font-size:14px;color:var(--text-muted);margin-bottom:16px;"></div>
    <div class="field"><label>Valor (R$)</label><input id="contribAmount" type="number" inputmode="decimal" min="0" placeholder="0,00"/></div>
    <button class="btn btn-accent" id="contribSaveBtn">Confirmar</button>
  </div>
</div>

<div class="modal-bg" id="modalPreview">
  <div class="modal">
    <div class="modal-title">Revisar Importação <button class="modal-close" data-close="modalPreview">✕</button></div>
    <div id="previewList"></div>
    <button class="btn btn-accent" id="previewConfirmBtn" style="margin-top:10px">✅ Confirmar</button>

function calcScore(){
  var score=0,details=[];
  var income=S.config.monthlyIncome||S.totC()||1;
  var bal=S.bal(),td=S.totD(),savings=Math.max(0,bal),reserve=S.config.emergencyFund||0;
  if(bal>=0){score+=30;details.push('✅ Saldo positivo (+30)');}else details.push('❌ Saldo negativo (0)');
  if(savings>=income*.1){score+=20;details.push('✅ Poupança ≥ 10% (+20)');}else details.push('⚠️ Poupança abaixo de 10% (0)');
  var over=CATS.filter(function(c){return c.id!=='renda'&&S.catTot(c.id)>S.catLim(c.id)&&S.catLim(c.id)>0;});
  if(over.length===0){score+=20;details.push('✅ Sem categorias estouradas (+20)');}else details.push('❌ '+over.length+' categoria(s) estourada(s) (0)');
  if(reserve>=td*3){score+=15;details.push('✅ Reserva de emergência OK (+15)');}else details.push('⚠️ Reserva insuficiente (0)');
  var food=S.catTot('alimentacao');
  if(td>0&&food<=td*.3){score+=15;details.push('✅ Alimentação ≤ 30% (+15)');}else details.push('⚠️ Alimentação > 30% (0)');
  var color=score>=71?'var(--accent)':score>=41?'var(--warning)':'var(--danger)';
  var msg=score>=71?'Excelente! 🎉':score>=41?'Bom, pode melhorar ⚠️':'Atenção Necessária 🚨';
  return{value:score,color:color,msg:msg,details:details};
}

/* ════════════════════════════════════════════
   CSV PARSER
════════════════════════════════════════════ */
function parseCSV(text){
  var txs=[],lines=text.trim().split('\n'),start=0;
  if(lines[0]&&/data|date|descri|valor|amount/i.test(lines[0]))start=1;
  for(var i=start;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    var sep=line.indexOf(';')>-1?';':',';
    var parts=line.split(sep).map(function(p){return p.replace(/^["']|["']$/g,'').trim();});
    if(parts.length<4)continue;
    var dateRaw=parts[0],desc=parts[1],valRaw=parts[2],tipoRaw=parts[3];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dateRaw))continue;
    var amount=parseFloat(valRaw.replace(',','.'));
    if(isNaN(amount)||amount<=0)continue;
    var isCredit=/cred/i.test(tipoRaw);
    var descClean=desc.slice(0,60)||'Transação importada';
    txs.push({id:U.uid('csv'),date:dateRaw,description:descClean,amount:Math.abs(amount),type:isCredit?'credit':'debit',category:isCredit?'renda':U.autoCat(descClean),memberId:''});
  }
  return txs;
}

function getFiltered(){
  var f=S.ui.txFilter,q=S.ui.search;
  var txs=S.transactions.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  if(f==='credit')txs=txs.filter(function(t){return t.type==='credit';});
  else if(f==='debit')txs=txs.filter(function(t){return t.type==='debit';});
  else if(f!=='all')txs=txs.filter(function(t){return t.category===f;});
  if(q)txs=txs.filter(function(t){return t.description.toLowerCase().indexOf(q.toLowerCase())>-1;});
  return txs;
}

/* ════════════════════════════════════════════
EXPORTS — FIX 4: Web Share API para iOS PWA
════════════════════════════════════════════ */
function exportCSV(){
var rows=[’\uFEFFData,Descrição,Valor,Tipo,Categoria,Membro’];
S.transactions.forEach(function(t){var mem=S.members.filter(function(m){return m.id===t.memberId;})[0];var c=U.cat(t.category);rows.push(’”’+t.date+’”,”’+t.description.replace(/”/g,’””’)+’”,’+(t.type===‘debit’?-t.amount:t.amount)+’,”’+(t.type===‘debit’?‘Despesa’:‘Receita’)+’”,”’+c.label+’”,”’+(mem?mem.name:’’)+’”’);});
dlText(rows.join(’\n’),‘text/csv’,‘financas_’+U.today()+’.csv’,‘✅ CSV exportado!’);
}
function exportJSON(){
dlText(JSON.stringify({transactions:S.transactions,members:S.members,goals:S.goals,config:S.config,catLimits:S.catLimits},null,2),‘application/json’,‘financas_backup_’+U.today()+’.json’,‘✅ Backup exportado!’);
}
function dlText(content,mimeType,filename,msg){
var blob=new Blob([content],{type:mimeType+’;charset=utf-8;’});
// iOS 15+: Web Share com arquivo
if(navigator.canShare&&navigator.share){
try{
var file=new File([blob],filename,{type:mimeType});
if(navigator.canShare({files:[file]})){
navigator.share({files:[file],title:filename}).then(function(){toast(msg);}).catch(function(e){if(e.name!==‘AbortError’)fallback();});
return;
}
}catch(e){}
}
// iOS 14: share como texto (apenas CSV)
if(navigator.share&&mimeType===‘text/csv’){
navigator.share({title:filename,text:content}).then(function(){toast(msg);}).catch(function(){fallback();});
return;
}
fallback();
function fallback(){
var url=URL.createObjectURL(blob);
var a=document.createElement(‘a’);a.href=url;a.download=filename;a.target=’_blank’;
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(url);},5000);
toast(msg);
}
}
