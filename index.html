<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="theme-color" content="#0a0c10"/>
<title>Financa Familiar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" media="print" onload="this.media='all'"/>
<style>
:root {
  --bg: #0a0c10;
  --surface: #111318;
  --surface2: #181b22;
  --border: #1e2130;
  --accent: #00e5a0;
  --accent-dim: rgba(0,229,160,0.12);
  --danger: #ff4d6d;
  --danger-dim: rgba(255,77,109,0.12);
  --warning: #f5a623;
  --warning-dim: rgba(245,166,35,0.12);
  --purple: #a78bfa;
  --blue: #38bdf8;
  --orange: #fb923c;
  --green: #34d399;
  --yellow: #fbbf24;
  --text: #eef0f6;
  --text-muted: #6b7280;
  --radius: 16px;
  --radius-sm: 10px;
  --nav-h: 68px;
}

- {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  }

html, body {
height: 100%;
background: var(–bg);
color: var(–text);
font-family: ‘DM Sans’, -apple-system, BlinkMacSystemFont, sans-serif;
overscroll-behavior: none;
}

#app {
height: 100vh;
height: -webkit-fill-available;
height: 100dvh;
max-width: 480px;
margin: 0 auto;
background: var(–bg);
display: flex;
flex-direction: column;
overflow: hidden;
position: relative;
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: var(–border); border-radius: 4px; }

.header {
background: var(–surface);
border-bottom: 1px solid var(–border);
padding: 14px 20px;
padding-top: calc(14px + env(safe-area-inset-top, 0px));
display: flex;
justify-content: space-between;
align-items: center;
flex-shrink: 0;
z-index: 50;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.menu-btn {
background: none; border: none; color: var(–text);
font-size: 22px; cursor: pointer;
min-width: 44px; min-height: 44px;
display: flex; align-items: center; justify-content: center;
border-radius: 8px;
}
.header-logo {
font-family: ‘Syne’, -apple-system, BlinkMacSystemFont, sans-serif;
font-size: 18px; font-weight: 800; color: var(–accent);
}
.header-sub { font-size: 10px; color: var(–text-muted); margin-top: 2px; }
.header-balance { text-align: right; }
.header-balance-label { font-size: 10px; color: var(–text-muted); text-transform: uppercase; letter-spacing: .05em; }
.header-balance-value { font-size: 18px; font-weight: 700; }

#storageWarning {
display: none;
background: var(–warning-dim);
border-bottom: 1px solid var(–warning);
padding: 10px 16px;
gap: 10px; align-items: center; flex-shrink: 0;
}
#storageWarning.show { display: flex; }

.sidebar {
position: fixed; top: 0; left: 0; width: 280px; height: 100%;
background: var(–surface); border-right: 1px solid var(–border);
z-index: 1000;
transform: translateX(-100%);
transition: transform .28s ease;
display: flex; flex-direction: column;
overflow-y: auto; overscroll-behavior: contain;
-webkit-overflow-scrolling: touch;
}
.sidebar.open { transform: translateX(0); }
.sidebar-overlay {
position: fixed; inset: 0;
background: rgba(0,0,0,.55);
z-index: 999; display: none;
}
.sidebar-overlay.open { display: block; }
.sidebar-header { padding: 24px 20px; border-bottom: 1px solid var(–border); background: var(–surface2); }
.sidebar-header h2 { font-size: 17px; color: var(–accent); font-family: ‘Syne’, sans-serif; }
.sidebar-header p { font-size: 11px; color: var(–text-muted); margin-top: 4px; }
.sidebar-nav { flex: 1; padding: 12px 0; }
.sidebar-item {
display: flex; align-items: center; gap: 14px;
padding: 14px 20px; background: none; border: none; width: 100%;
text-align: left; color: var(–text-muted);
font-size: 14px; font-family: ‘DM Sans’, sans-serif; cursor: pointer;
min-height: 48px;
}
.sidebar-item.active { color: var(–accent); background: var(–accent-dim); border-left: 3px solid var(–accent); }
.sidebar-icon { font-size: 20px; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid var(–border); font-size: 11px; color: var(–text-muted); text-align: center; }

.content {
flex: 1;
overflow-y: auto; overflow-x: hidden;
-webkit-overflow-scrolling: touch;
overscroll-behavior-y: contain;
padding-bottom: calc(var(–nav-h) + env(safe-area-inset-bottom, 0px));
}
.page { display: none; padding: 16px; flex-direction: column; gap: 14px; }
.page.active { display: flex; }

.bottom-nav {
position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
width: 100%; max-width: 480px;
background: #111318;
border-top: 1px solid var(–border);
display: flex;
padding-bottom: env(safe-area-inset-bottom, 0px);
z-index: 100; height: var(–nav-h);
box-shadow: 0 -2px 12px rgba(0,0,0,.6);
}
.nav-btn {
flex: 1; display: flex; flex-direction: column;
align-items: center; justify-content: center;
gap: 3px; background: none; border: none;
color: var(–text-muted); font-size: 10px;
font-family: ‘DM Sans’, sans-serif; cursor: pointer;
min-height: 44px; position: relative;
}
.nav-btn.active { color: var(–accent); }
.nav-icon { font-size: 21px; line-height: 1; }
.nav-btn::after {
content: ‘’; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
width: 0; height: 2px; background: var(–accent);
border-radius: 2px 2px 0 0; transition: width .2s;
}
.nav-btn.active::after { width: 28px; }
.nav-btn.nav-add { color: var(–accent); font-weight: 700; }
.nav-btn.nav-add .nav-icon { font-size: 25px; }

.card { background: var(–surface); border: 1px solid var(–border); border-radius: var(–radius); padding: 18px 20px; }
.stat-card { background: var(–surface); border: 1px solid var(–border); border-radius: var(–radius); padding: 16px 18px; }
.stat-label { font-size: 11px; color: var(–text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
.stat-value { font-size: 22px; font-weight: 700; }
.section-title { font-size: 11px; color: var(–text-muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.progress-wrap { height: 6px; background: var(–border); border-radius: 99px; overflow: hidden; }
.progress-bar { height: 100%; border-radius: 99px; transition: width .5s ease; }

.tx-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(–border); cursor: pointer; }
.tx-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.tx-info { flex: 1; min-width: 0; }
.tx-desc { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-meta { font-size: 11px; color: var(–text-muted); margin-top: 2px; }
.tx-amount { font-size: 14px; font-weight: 700; flex-shrink: 0; }
.tx-detail { display: none; padding: 10px 0 8px 52px; flex-wrap: wrap; gap: 6px; }
.tx-detail.open { display: flex; }

.cat-chip { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid transparent; min-height: 32px; display: inline-flex; align-items: center; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(–border); background: none; color: var(–text-muted); font-size: 12px; font-family: ‘DM Sans’, sans-serif; cursor: pointer; white-space: nowrap; flex-shrink: 0; min-height: 36px; }
.chip.active { background: var(–accent-dim); border-color: var(–accent); color: var(–accent); }

.cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cat-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: var(–radius-sm); border: 1px solid var(–border); background: none; cursor: pointer; min-height: 60px; }
.cat-btn .ci { font-size: 18px; }
.cat-btn .cl { font-size: 9px; color: var(–text-muted); text-align: center; line-height: 1.2; }
.cat-btn.selected { border-color: currentColor; background: var(–accent-dim); }

.score-ring { position: relative; width: 100px; height: 100px; flex-shrink: 0; }
.score-ring svg { transform: rotate(-90deg); }
.score-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.score-num { font-size: 26px; font-weight: 800; font-family: ‘Syne’, sans-serif; }
.score-lbl { font-size: 9px; color: var(–text-muted); text-transform: uppercase; letter-spacing: .05em; }
.score-wrap { display: flex; align-items: center; gap: 18px; }

.btn { padding: 13px 20px; border-radius: var(–radius-sm); border: none; font-size: 14px; font-weight: 700; font-family: ‘DM Sans’, sans-serif; cursor: pointer; width: 100%; min-height: 44px; }
.btn-accent { background: var(–accent); color: #000; }
.btn-danger { background: var(–danger); color: #fff; }
.btn-ghost { background: var(–border); color: var(–text-muted); }
.btn:active { opacity: .82; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 11px; color: var(–text-muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.field input, .field select, .field textarea {
background: var(–surface); border: 1px solid var(–border);
border-radius: var(–radius-sm); padding: 12px 14px;
color: var(–text); font-size: 16px;
font-family: ‘DM Sans’, sans-serif; outline: none; width: 100%;
min-height: 44px; -webkit-appearance: none; appearance: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(–accent); }
.field select option { background: var(–surface2); }
.toggle-row { display: flex; gap: 8px; }
.toggle-btn { flex: 1; padding: 11px; border-radius: var(–radius-sm); border: 1px solid var(–border); background: none; color: var(–text-muted); font-size: 14px; font-family: ‘DM Sans’, sans-serif; cursor: pointer; font-weight: 600; min-height: 44px; }
.toggle-btn.active { background: var(–accent-dim); border-color: var(–accent); color: var(–accent); }
.toggle-btn.active-red.active { background: var(–danger-dim); border-color: var(–danger); color: var(–danger); }
.search-bar { background: var(–surface); border: 1px solid var(–border); border-radius: var(–radius-sm); padding: 12px 14px; color: var(–text); font-size: 16px; font-family: ‘DM Sans’, sans-serif; outline: none; width: 100%; min-height: 44px; -webkit-appearance: none; }
.search-bar:focus { border-color: var(–accent); }

.upload-area { border: 2px dashed var(–border); border-radius: var(–radius); padding: 28px 20px; text-align: center; cursor: pointer; }
.upload-area:active { border-color: var(–accent); }

.member-avatar { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; font-family: ‘Syne’, sans-serif; flex-shrink: 0; }

.alert { border-radius: var(–radius-sm); padding: 12px 14px; font-size: 13px; margin-bottom: 8px; line-height: 1.5; }
.alert-success { background: var(–accent-dim); border: 1px solid var(–accent); color: var(–accent); }
.alert-warning { background: var(–warning-dim); border: 1px solid var(–warning); color: var(–warning); }
.alert-danger { background: var(–danger-dim); border: 1px solid var(–danger); color: var(–danger); }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 1100; display: none; align-items: flex-end; justify-content: center; }
.modal-bg.open { display: flex; }
.modal {
background: var(–surface2); border: 1px solid var(–border);
border-radius: 24px 24px 0 0;
padding: 24px 20px;
padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
width: 100%; max-width: 480px;
max-height: 80vh;
overflow-y: auto; overscroll-behavior: contain;
-webkit-overflow-scrolling: touch;
transform: translateY(100%);
transition: transform .28s ease;
}
.modal-bg.open .modal { transform: translateY(0); }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.modal-close { background: var(–border); border: none; color: var(–text-muted); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }

#toast {
position: fixed;
bottom: calc(var(–nav-h) + 14px + env(safe-area-inset-bottom, 0px));
left: 50%; transform: translateX(-50%);
background: var(–surface2); color: var(–text);
padding: 11px 22px; border-radius: 40px;
font-size: 14px; font-weight: 500; z-index: 1300;
box-shadow: 0 4px 20px rgba(0,0,0,.5); border: 1px solid var(–border);
white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .3s;
max-width: 88vw; overflow: hidden; text-overflow: ellipsis;
}

.empty { text-align: center; padding: 40px 20px; color: var(–text-muted); }
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .4; }
</style>

</head>
<body>
<div id="app">

  <div class="header">
    <div class="header-left">
      <button class="menu-btn" id="menuBtn">&#9776;</button>
      <div>
        <div class="header-logo">Financa Familiar</div>
        <div class="header-sub" id="headerSub">Carregando...</div>
      </div>
    </div>
    <div class="header-balance">
      <div class="header-balance-label">Saldo</div>
      <div class="header-balance-value" id="headerBalance">R$ 0,00</div>
    </div>
  </div>

  <div id="storageWarning">
    <span style="font-size:20px;flex-shrink:0">&#9888;</span>
    <div style="flex:1">
      <div style="font-size:12px;font-weight:700;color:var(--warning)">Modo privado detectado</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px">Dados nao serao salvos. Use o Safari normal.</div>
    </div>
    <button onclick="this.parentElement.classList.remove('show')"
      style="background:none;border:none;color:var(--text-muted);font-size:22px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;">&#x2715;</button>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2>Menu</h2><p>Financa Familiar v8</p></div>
    <div class="sidebar-nav">
      <button class="sidebar-item" data-page="transactions"><span class="sidebar-icon">&#128203;</span> Transacoes</button>
      <button class="sidebar-item" data-page="budget"><span class="sidebar-icon">&#127919;</span> Orcamento</button>
      <button class="sidebar-item" data-page="family"><span class="sidebar-icon">&#128106;</span> Familia</button>
      <button class="sidebar-item" data-page="tips"><span class="sidebar-icon">&#128161;</span> Dicas</button>
      <button class="sidebar-item" data-page="import"><span class="sidebar-icon">&#128196;</span> Importar</button>
      <button class="sidebar-item" data-page="config"><span class="sidebar-icon">&#9881;</span> Config</button>
    </div>
    <div class="sidebar-footer">Controle financeiro inteligente</div>
  </div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="content">
    <div class="page active" id="page-dashboard"></div>
    <div class="page" id="page-transactions"></div>
    <div class="page" id="page-budget"></div>
    <div class="page" id="page-family"></div>
    <div class="page" id="page-tips"></div>
    <div class="page" id="page-import"></div>
    <div class="page" id="page-reports"></div>
    <div class="page" id="page-config"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="dashboard"><span class="nav-icon">&#128202;</span>Inicio</button>
    <button class="nav-btn nav-add" data-nav="add"><span class="nav-icon">&#10133;</span>Lancar</button>
    <button class="nav-btn" data-nav="reports"><span class="nav-icon">&#128200;</span>Dados</button>
  </nav>
</div>

<div class="modal-bg" id="modalQuick">
  <div class="modal">
    <div class="modal-title">Lancamento Rapido <button class="modal-close" data-close="modalQuick">&#x2715;</button></div>
    <div class="field"><label>Descricao</label><input id="qDesc" placeholder="Ex: iFood, Uber..." autocomplete="off"/></div>
    <div class="field"><label>Valor (R$)</label><input id="qAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00"/></div>
    <div class="field"><label>Tipo</label>
      <div class="toggle-row">
        <button class="toggle-btn active-red active" data-qtype="debit">Despesa</button>
        <button class="toggle-btn" data-qtype="credit">Receita</button>
      </div>
    </div>
    <div class="field" id="qCatField"><label>Categoria</label><div class="cat-grid" id="qCatGrid"></div></div>
    <button class="btn btn-accent" id="qSaveBtn">Adicionar</button>
  </div>
</div>

<div class="modal-bg" id="modalGoal">
  <div class="modal">
    <div class="modal-title">Nova Meta <button class="modal-close" data-close="modalGoal">&#x2715;</button></div>
    <div class="field"><label>Nome</label><input id="goalName" placeholder="Ex: Viagem, Carro..."/></div>
    <div class="field"><label>Valor Alvo (R$)</label><input id="goalTarget" type="number" inputmode="decimal" min="0" placeholder="0,00"/></div>
    <div class="field"><label>Valor Inicial (R$)</label><input id="goalCurrent" type="number" inputmode="decimal" min="0" placeholder="0,00"/></div>
    <div class="field">
      <label>Prazo</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <select id="goalMonth"><option value="">Mes</option><option value="01">Jan</option><option value="02">Fev</option><option value="03">Mar</option><option value="04">Abr</option><option value="05">Mai</option><option value="06">Jun</option><option value="07">Jul</option><option value="08">Ago</option><option value="09">Set</option><option value="10">Out</option><option value="11">Nov</option><option value="12">Dez</option></select>
        <select id="goalYear"><option value="">Ano</option><option>2025</option><option>2026</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option></select>
      </div>
    </div>
    <button class="btn btn-accent" id="goalSaveBtn">Criar Meta</button>
  </div>
</div>

<div class="modal-bg" id="modalMember">
  <div class="modal">
    <div class="modal-title">Novo Membro <button class="modal-close" data-close="modalMember">&#x2715;</button></div>
    <div class="field"><label>Nome</label><input id="memberName" placeholder="Ex: Maria, Joao..."/></div>
    <div class="field"><label>Limite Mensal (R$)</label><input id="memberLimit" type="number" inputmode="decimal" min="0" placeholder="0,00"/></div>
    <button class="btn btn-accent" id="memberSaveBtn">Adicionar</button>
  </div>
</div>

<div class="modal-bg" id="modalContrib">
  <div class="modal">
    <div class="modal-title">Registrar Aporte <button class="modal-close" data-close="modalContrib">&#x2715;</button></div>
    <div id="contribGoalName" style="font-size:14px;color:var(--text-muted);margin-bottom:16px;"></div>
    <div class="field"><label>Valor (R$)</label><input id="contribAmount" type="number" inputmode="decimal" min="0" placeholder="0,00"/></div>
    <button class="btn btn-accent" id="contribSaveBtn">Confirmar</button>
  </div>
</div>

<div class="modal-bg" id="modalPreview">
  <div class="modal">
    <div class="modal-title">Revisar Importacao <button class="modal-close" data-close="modalPreview">&#x2715;</button></div>
    <div id="previewList"></div>
    <button class="btn btn-accent" id="previewConfirmBtn" style="margin-top:10px">Confirmar Importacao</button>
    <button class="btn btn-ghost" data-close="modalPreview" style="margin-top:8px">Cancelar</button>
  </div>
</div>

<div class="modal-bg" id="modalConfirm">
  <div class="modal">
    <div class="modal-title">Confirmar <button class="modal-close" data-close="modalConfirm">&#x2715;</button></div>
    <div id="confirmMsg" style="font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:20px;"></div>
    <button class="btn btn-danger" id="confirmYes">Confirmar</button>
    <button class="btn btn-ghost" data-close="modalConfirm" style="margin-top:10px">Cancelar</button>
  </div>
</div>

<div id="toast"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {

var CATS = [
  {id:'alimentacao', label:'Alimentacao', icon:'🍽️', color:'#fb923c', lim:1500},
  {id:'transporte',  label:'Transporte',  icon:'🚗',  color:'#38bdf8', lim:600},
  {id:'moradia',     label:'Moradia',     icon:'🏠',  color:'#a78bfa', lim:2000},
  {id:'saude',       label:'Saude',       icon:'💊',  color:'#f472b6', lim:400},
  {id:'educacao',    label:'Educacao',    icon:'📚',  color:'#34d399', lim:800},
  {id:'lazer',       label:'Lazer',       icon:'🎬',  color:'#fbbf24', lim:500},
  {id:'assinaturas', label:'Assinaturas', icon:'📱',  color:'#60a5fa', lim:300},
  {id:'renda',       label:'Renda',       icon:'💼',  color:'#00e5a0', lim:0},
  {id:'outros',      label:'Outros',      icon:'📦',  color:'#9ca3af', lim:400},
];

var MCOLORS = ['#00e5a0','#a78bfa','#38bdf8','#fb923c','#f472b6','#fbbf24','#34d399','#60a5fa'];

var KW = {
  alimentacao: ['ifood','rappi','mcdonalds','burger','pizza','restaurante','padaria','supermercado','mercado','carrefour','atacadao','lanchonete','sushi','delivery','hortifrutti'],

var U = {
  fmt: function(v) {
    return 'R$ ' + Math.abs(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  },
  fmtS: function(v) {
    return v >= 1000 ? 'R$ ' + (v/1000).toFixed(1).replace('.', ',') + ' k' : this.fmt(v);
  },
  fmtD: function(d) {
    if (!d) return '';
    var p = d.split('-');
    return p.length === 3 ? p[2] + '/' + p[1] : '';
  },
  today: function() { return new Date().toISOString().split('T')[0]; },
  uid: function(p) { return (p||'id') + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); },
  pct: function(v, t) { return t > 0 ? Math.min(100, Math.round(v/t*100)) : 0; },
  bc: function(p) { return p >= 100 ? 'var(--danger)' : p >= 75 ? 'var(--warning)' : 'var(--accent)'; },
  num: function(v) {
    var n = parseFloat(String(v||'').replace(',', '.'));
    return isNaN(n) ? 0 : Math.max(0, n);
  },
  esc: function(s) {
    return String(s||'')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  },
  cat: function(id) {
    for (var i = 0; i < CATS.length; i++) { if (CATS[i].id === id) return CATS[i]; }
    return CATS[CATS.length-1];
  },
  autoCat: function(desc) {
    var d = desc.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    var ids = Object.keys(KW);
    for (var i = 0; i < ids.length; i++) {
      var kws = KW[ids[i]];
      for (var j = 0; j < kws.length; j++) {
        if (d.indexOf(kws[j].normalize('NFD').replace(/[\u0300-\u036f]/g, '')) > -1) return ids[i];
      }
    }
    return 'outros';
  },
  el: function(id) { return document.getElementById(id); },
};

// --- SCORE ---
function calcScore() {
  var score = 0, details = [];
  var income = S.config.monthlyIncome || S.totC() || 1;
  var bal = S.bal(), td = S.totD(), savings = Math.max(0, bal), reserve = S.config.emergencyFund || 0;
  if (bal >= 0) { score += 30; details.push('Saldo positivo (+30)'); } else details.push('Saldo negativo (0)');
  if (savings >= income*.1) { score += 20; details.push('Poupanca >= 10% (+20)'); } else details.push('Poupanca abaixo de 10% (0)');
  var over = 0;
  for (var i = 0; i < CATS.length; i++) {
    if (CATS[i].id !== 'renda' && S.catTot(CATS[i].id) > S.catLim(CATS[i].id) && S.catLim(CATS[i].id) > 0) over++;
  }
  if (over === 0) { score += 20; details.push('Sem categorias estouradas (+20)'); } else details.push(over + ' categoria(s) estourada(s) (0)');
  if (reserve >= td*3) { score += 15; details.push('Reserva de emergencia OK (+15)'); } else details.push('Reserva insuficiente (0)');
  var food = S.catTot('alimentacao');
  if (td > 0 && food <= td*.3) { score += 15; details.push('Alimentacao <= 30% (+15)'); } else details.push('Alimentacao > 30% (0)');
  var color = score >= 71 ? 'var(--accent)' : score >= 41 ? 'var(--warning)' : 'var(--danger)';
  var msg = score >= 71 ? 'Excelente!' : score >= 41 ? 'Bom, pode melhorar' : 'Atencao Necessaria';
  return {value: score, color: color, msg: msg, details: details};
}

// --- CSV PARSER ---
function parseCSV(text) {
  var txs = [], lines = text.trim().split('\n'), start = 0;
  if (lines[0] && /data|date|descri|valor|amount/i.test(lines[0])) start = 1;
  for (var i = start; i < lines.length; i++) {
    var line = lines[i].trim(); if (!line) continue;
    var sep = line.indexOf(';') > -1 ? ';' : ',';
    var parts = line.split(sep).map(function(p) { return p.replace(/^["']|["']$/g, '').trim(); });
    if (parts.length < 4) continue;
    var dateRaw = parts[0], desc = parts[1], valRaw = parts[2], tipoRaw = parts[3];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateRaw)) continue;
    var amount = parseFloat(valRaw.replace(',', '.'));
    if (isNaN(amount) || amount <= 0) continue;
    var isCredit = /cred/i.test(tipoRaw);
    var descClean = desc.slice(0, 60) || 'Transacao importada';
    txs.push({id: U.uid('csv'), date: dateRaw, description: descClean, amount: Math.abs(amount), type: isCredit ? 'credit' : 'debit', category: isCredit ? 'renda' : U.autoCat(descClean), memberId: ''});
  }
  return txs;
}

    leg.innerHTML = '<span style="font-size:12px;color:var(--text-muted)">Sem despesas</span>';
    return;
  }
  var cx=55, cy=55, r=42, ang=-Math.PI/2, paths='';
  for (var i = 0; i < cwv.length; i++) {
    var sweep = 2*Math.PI*(S.catTot(cwv[i].id)/td);
    var x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang);
    var x2=cx+r*Math.cos(ang+sweep), y2=cy+r*Math.sin(ang+sweep);
    paths += '<path d="M' + cx + ',' + cy + ' L' + x1 + ',' + y1 + ' A' + r + ',' + r + ',0,' + (sweep>Math.PI?1:0) + ',1,' + x2 + ',' + y2 + 'Z" fill="' + cwv[i].color + '" opacity=".9"/>';
    ang += sweep;
  }
  svg.innerHTML = paths + '<circle cx="' + cx + '" cy="' + cy + '" r="28" fill="#111318"/>';
  var legHtml = '';
  for (var i = 0; i < Math.min(cwv.length, 5); i++) {
    legHtml += '<div style="display:flex;align-items:center;gap:8px;font-size:12px"><div style="width:8px;height:8px;border-radius:2px;background:' + cwv[i].color + ';flex-shrink:0"></div><span style="color:var(--text-muted);flex:1">' + cwv[i].icon + ' ' + cwv[i].label + '</span><span style="font-weight:700;color:' + cwv[i].color + '">' + U.fmtS(S.catTot(cwv[i].id)) + '</span></div>';
  }
  leg.innerHTML = legHtml;
}

// --- TRANSACTIONS ---
function getFiltered() {
  var f = S.ui.txFilter, q = S.ui.search;
  var txs = S.transactions.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  if (f === 'credit') txs = txs.filter(function(t){return t.type==='credit';});
  else if (f === 'debit') txs = txs.filter(function(t){return t.type==='debit';});
  else if (f !== 'all') txs = txs.filter(function(t){return t.category===f;});
  if (q) txs = txs.filter(function(t){return t.description.toLowerCase().indexOf(q.toLowerCase())>-1;});
  return txs;
}

function refreshList(txs) {
  var listEl = U.el('txList'), sumEl = U.el('txSummary');

‘<div class="card"><div class="section-title">Resumo do Periodo</div><div style="display:flex;justify-content:space-around;padding:16px 0"><div style="text-align:center"><div style="font-size:26px;font-weight:700;color:var(--accent)">’ + U.fmt(tc) + ‘</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">Receitas</div></div><div style="width:1px;background:var(--border)"></div><div style="text-align:center"><div style="font-size:26px;font-weight:700;color:var(--danger)">’ + U.fmt(td) + ‘</div><div style="font-size:11px;color:var(--text-muted);margin-top:4px">Despesas</div></div></div></div>’ +
‘<div class="card"><div class="section-title">Por Categoria</div>’ + (cats.length?catsHtml:’<div class="empty"><div>Sem despesas</div></div>’) + ‘</div>’ +

if (ej) ej.addEventListener(‘click’, exportJSON);

// — CONFIG —
function rConfig() {
var el = U.el(‘page-config’); if (!el) return;
var td = S.totD(), months = td > 0 ? (S.config.emergencyFund/td).toFixed(1) : ‘0’;
var limHtml = ‘’;
for (var i = 0; i < CATS.length; i++) {
if (CATS[i].id === ‘renda’) continue;
limHtml += ‘<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:18px">’ + CATS[i].icon + ‘</span><span style="flex:1;font-size:13px">’ + CATS[i].label + ‘</span><input type="number" inputmode="decimal" min="0" class="limInput" data-cat="' + CATS[i].id + '" value="' + S.catLim(CATS[i].id) + '" style="width:100px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:15px;text-align:right;-webkit-appearance:none;"/></div>’;
}
el.innerHTML =
‘<div class="card"><div class="section-title">Perfil da Familia</div>’ +
‘<div class="field"><label>Nome da Familia</label><input id="cfgName" value="' + U.esc(S.config.familyName) + '"/></div>’ +
‘<div class="field"><label>Renda Mensal (R$)</label><input id="cfgIncome" type="number" inputmode="decimal" value="' + S.config.monthlyIncome + '"/></div>’ +
‘<div class="field"><label>Reserva de Emergencia (R$)</label><input id="cfgEmerg" type="number" inputmode="decimal" value="' + S.config.emergencyFund + '"/></div>’ +
’<div style="font-size:12px;color:var(--text-muted);margin-bottom:14px">Reserva cobre ’ + months + ’ meses. Meta: 6 meses = ’ + U.fmt(td*6) + ‘</div>’ +
‘<button class="btn btn-accent" id="cfgSave">Salvar Perfil</button>’ +
‘</div>’ +
‘<div class="card"><div class="section-title">Limites por Categoria</div>’ + limHtml +
‘<button class="btn btn-accent" id="limSave" style="margin-top:14px">Salvar Limites</button>’ +
‘</div>’ +
‘<div class="card"><div class="section-title">Dados</div><div style="display:flex;flex-direction:column;gap:10px">’ +
‘<button class="btn btn-ghost" id="expCsv2">Exportar CSV</button>’ +
‘<label class="btn btn-ghost" style="display:flex;align-items:center;justify-content:center;cursor:pointer;">Importar Backup JSON<input type="file" accept=".json" id="impJson" style="display:none"/></label>’ +
‘<button class="btn btn-danger" id="clearBtn">Apagar Todos os Dados</button>’ +
‘</div></div>’;

var cs = U.el(‘cfgSave’);
if (cs) cs.addEventListener(‘click’, function() {
S.updCfg({familyName:(U.el(‘cfgName’)||{value:’’}).value||‘Minha Familia’, monthlyIncome:U.num((U.el(‘cfgIncome’)||{value:’’}).value), emergencyFund:U.num((U.el(‘cfgEmerg’)||{value:’’}).value)});
updateHeader(); rConfig(); toast(‘Perfil salvo!’);
});
var ls = U.el(‘limSave’);
if (ls) ls.addEventListener(‘click’, function() {
var inputs = el.querySelectorAll(’.limInput’);
for (var i=0;i<inputs.length;i++) S.setCatLim(inputs[i].dataset.cat, U.num(inputs[i].value));
toast(‘Limites salvos!’);
});
var ec2 = U.el(‘expCsv2’); if (ec2) ec2.addEventListener(‘click’, exportCSV);
var ij = U.el(‘impJson’);
if (ij) ij.addEventListener(‘change’, function(e) {
var file = e.target.files && e.target.files[0]; if (!file) return;
var r = new FileReader();
r.onload = function() {
try {
var d = JSON.parse(r.result);
if (!d.transactions) { toast(‘Arquivo invalido’); return; }
S.transactions = d.transactions || []; S.members = d.members || []; S.goals = d.goals || [];
if (d.config) { var k=Object.keys(d.config); for(var i=0;i<k.length;i++) S.config[k[i]]=d.config[k[i]]; }
if (d.catLimits) S.catLimits = d.catLimits;
S.save(); updateHeader(); rConfig(); toast(‘Backup importado!’);
} catch(ex) { toast(‘Erro ao ler o arquivo’); }
e.target.value = ‘’;
};
r.readAsText(file);
});
var cb = U.el(‘clearBtn’);
if (cb) cb.addEventListener(‘click’, function() {
showConfirm(‘Todos os dados serao apagados permanentemente. Confirmar?’, function() {
S.clearAll(); updateHeader(); goTo(‘dashboard’); toast(‘Dados apagados.’);
});
});
}

// — EXPORTS —
function exportCSV() {
var rows = [’\uFEFFData,Descricao,Valor,Tipo,Categoria,Membro’];
for (var i = 0; i < S.transactions.length; i++) {
var t = S.transactions[i];
var mem = null; for (var j=0;j<S.members.length;j++){if(S.members[j].id===t.memberId){mem=S.members[j];break;}}
var c = U.cat(t.category);
rows.push(’”’+t.date+’”,”’+t.description.replace(/”/g,’””’)+’”,’+(t.type===‘debit’?-t.amount:t.amount)+’,”’+(t.type===‘debit’?‘Despesa’:‘Receita’)+’”,”’+c.label+’”,”’+(mem?mem.name:’’)+’”’);
}
dlText(rows.join(’\n’), ‘text/csv’, ‘financas_’ + U.today() + ‘.csv’, ‘CSV exportado!’);
}
function exportJSON() {
dlText(JSON.stringify({transactions:S.transactions,members:S.members,goals:S.goals,config:S.config,catLimits:S.catLimits},null,2), ‘application/json’, ‘financas_backup_’ + U.today() + ‘.json’, ‘Backup exportado!’);
}
function dlText(content, mimeType, filename, msg) {
var blob = new Blob([content], {type: mimeType+’;charset=utf-8;’});
if (navigator.canShare && navigator.share) {
try {
var file = new File([blob], filename, {type: mimeType});
if (navigator.canShare({files:[file]})) {
navigator.share({files:[file],title:filename}).then(function(){toast(msg);}).catch(function(e){if(e.name!==‘AbortError’)fb();});
return;
}
} catch(e) {}
}
if (navigator.share && mimeType === ‘text/csv’) {
navigator.share({title:filename,text:content}).then(function(){toast(msg);}).catch(function(){fb();});
return;
}
fb();
function fb() {
var url = URL.createObjectURL(blob);
var a = document.createElement(‘a’); a.href = url; a.download = filename; a.target = ‘_blank’;
document.body.appendChild(a); a.click(); document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(url);}, 5000);
toast(msg);
}
}

// — QUICK ADD —
function initQuickAdd() {
buildCatGrid(‘qCatGrid’);
var typeBtns = document.querySelectorAll(’[data-qtype]’);
for (var i = 0; i < typeBtns.length; i++) {
typeBtns[i].addEventListener(‘click’, (function(btn) {
return function() {
var all = document.querySelectorAll(’[data-qtype]’);
for (var j=0;j<all.length;j++) all[j].classList.remove(‘active’);
btn.classList.add(‘active’);
var cf = U.el(‘qCatField’);
if (cf) cf.style.display = btn.dataset.qtype === ‘debit’ ? ‘flex’ : ‘none’;
};
})(typeBtns[i]));
}
var qs = U.el(‘qSaveBtn’);
if (qs) qs.addEventListener(‘click’, function() {
var desc = (U.el(‘qDesc’)||{value:’’}).value.trim();
var amount = U.num((U.el(‘qAmount’)||{value:’’}).value);
var activeType = document.querySelector(’[data-qtype].active’);
var type = activeType ? activeType.dataset.qtype : ‘debit’;

var cat = selCat ? selCat.dataset.cat : ‘outros’;
if (!desc) { toast(‘Preencha a descricao’); return; }
if (amount <= 0) { toast(‘Digite um valor valido’); return; }
S.addTx({date:U.today(), description:desc, amount:amount, type:type, category:type===‘credit’?‘renda’:cat, memberId:’’});
closeModal(‘modalQuick’);
U.el(‘qDesc’).value = ‘’; U.el(‘qAmount’).value = ‘’;
var allType = document.querySelectorAll(’[data-qtype]’); for(var i=0;i<allType.length;i++) allType[i].classList.remove(‘active’);
var deb = document.querySelector(’[data-qtype=“debit”]’); if (deb) deb.classList.add(‘active’);
var allCat = document.querySelectorAll(’#qCatGrid .cat-btn’); for(var i=0;i<allCat.length;i++) allCat[i].classList.remove(‘selected’);
updateHeader();
if (S.ui.page === ‘dashboard’) rDashboard();
if (S.ui.page === ‘transactions’) refreshList(getFiltered());
toast(‘Transacao adicionada!’);
});
}

// — EVENT DELEGATION —
document.addEventListener(‘click’, function(e) {
if (e.target.closest(’#menuBtn’)) { U.el(‘sidebar’).classList.toggle(‘open’); U.el(‘sidebarOverlay’).classList.toggle(‘open’); return; }
if (e.target.id === ‘sidebarOverlay’) { U.el(‘sidebar’).classList.remove(‘open’); U.el(‘sidebarOverlay’).classList.remove(‘open’); return; }
var si = e.target.closest(’.sidebar-item[data-page]’);
if (si) { goTo(si.dataset.page); U.el(‘sidebar’).classList.remove(‘open’); U.el(‘sidebarOverlay’).classList.remove(‘open’); return; }
var nb = e.target.closest(’.nav-btn[data-nav]’);
if (nb) { if(nb.dataset.nav===‘add’) openModal(‘modalQuick’); else goTo(nb.dataset.nav); return; }
var mc = e.target.closest(’[data-close]’); if (mc) { closeModal(mc.dataset.close); return; }
if (e.target.classList.contains(‘modal-bg’) && e.target.id) { closeModal(e.target.id); return; }
var ti = e.target.closest(’.tx-item[data-txid]’);
if (ti && !e.target.closest(’[data-chcat]’) && !e.target.closest(’[data-deltx]’)) {
var sid = ti.dataset.txid.replace(/[^a-zA-Z0-9_]/g,’*’);
var det = U.el(’det*’+sid); if (det) det.classList.toggle(‘open’);
return;
}
var chcat = e.target.closest(’[data-chcat]’);
if (chcat) {
var parts = chcat.dataset.chcat.split(’|’);
S.updCat(parts[0], parts[1]);
if (U.el(‘txList’)) refreshList(getFiltered());
toast(‘Categoria atualizada!’);
return;
}
var deltx = e.target.closest(’[data-deltx]’);
if (deltx) {
var id = deltx.dataset.deltx;
var t = null; for(var i=0;i<S.transactions.length;i++){if(S.transactions[i].id===id){t=S.transactions[i];break;}}
showConfirm(‘Excluir “’ + (t?t.description:‘transacao’) + ‘”?’, function() {
S.delTx(id); if(U.el(‘txList’))refreshList(getFiltered()); updateHeader(); toast(‘Excluida.’);
});
return;
}
var fc = e.target.closest(’[data-filter]’);
if (fc) {
S.ui.txFilter = fc.dataset.filter; S.ui.search = ‘’;
var sx = U.el(‘txSearch’); if (sx) sx.value = ‘’;
var allF = document.querySelectorAll(’[data-filter]’);
for(var i=0;i<allF.length;i++) allF[i].classList.toggle(‘active’, allF[i].dataset.filter===fc.dataset.filter);
refreshList(getFiltered());
return;
}
var cg = e.target.closest(’[data-contribute]’);
if (cg) {
_pendingGoalId = cg.dataset.contribute;
var g = null; for(var i=0;i<S.goals.length;i++){if(S.goals[i].id===_pendingGoalId){g=S.goals[i];break;}}
if (g) { var cn=U.el(‘contribGoalName’);if(cn)cn.textContent=‘Meta: ‘+g.name; var ca=U.el(‘contribAmount’);if(ca)ca.value=’’; openModal(‘modalContrib’); }
return;
}
var dg = e.target.closest(’[data-delgoal]’);
if (dg) {
var gid = dg.dataset.delgoal;
var gobj = null; for(var i=0;i<S.goals.length;i++){if(S.goals[i].id===gid){gobj=S.goals[i];break;}}
showConfirm(‘Excluir meta “’ + (gobj?gobj.name:’’) + ‘”?’, function() { S.delGoal(gid); rGoals(); toast(‘Meta excluida.’); });
return;
}
var dm = e.target.closest(’[data-delmem]’);
if (dm) {
var mid = dm.dataset.delmem;
var mobj = null; for(var i=0;i<S.members.length;i++){if(S.members[i].id===mid){mobj=S.members[i];break;}}
showConfirm(‘Remover “’ + (mobj?mobj.name:’’) + ‘”?’, function() { S.delMem(mid); rMembers(); updateHeader(); toast(‘Membro removido.’); });
return;
}
if (e.target.id === ‘confirmYes’) { if(_confirmCb){_confirmCb();_confirmCb=null;} closeModal(‘modalConfirm’); return; }
});

var gsb = U.el(‘goalSaveBtn’);
if (gsb) gsb.addEventListener(‘click’, function() {
var name = (U.el(‘goalName’)||{value:’’}).value.trim();
var target = U.num((U.el(‘goalTarget’)||{value:’’}).value);
var current = U.num((U.el(‘goalCurrent’)||{value:’’}).value);
var month = (U.el(‘goalMonth’)||{value:’’}).value, year = (U.el(‘goalYear’)||{value:’’}).value;
var deadline = month && year ? year+’-’+month : ‘’;
if (!name) { toast(‘Digite o nome da meta’); return; }
if (target <= 0) { toast(‘Valor alvo invalido’); return; }
S.addGoal({name:name, targetAmount:target, currentAmount:current, deadline:deadline});
closeModal(‘modalGoal’);
var clearIds = [‘goalName’,‘goalTarget’,‘goalCurrent’];
for(var i=0;i<clearIds.length;i++){var e2=U.el(clearIds[i]);if(e2)e2.value=’’;}
var gm=U.el(‘goalMonth’);if(gm)gm.value=’’; var gy=U.el(‘goalYear’);if(gy)gy.value=’’;
if (S.ui.page === ‘budget’) rGoals();
toast(‘Meta criada!’);
});

var msb = U.el(‘memberSaveBtn’);
if (msb) msb.addEventListener(‘click’, function() {
var name = (U.el(‘memberName’)||{value:’’}).value.trim();
var limit = U.num((U.el(‘memberLimit’)||{value:’’}).value);
if (!name) { toast(‘Digite o nome’); return; }
if (!S.addMem({name:name, limit:limit})) { toast(‘Membro ja existe’); return; }
closeModal(‘modalMember’);
var mn=U.el(‘memberName’);if(mn)mn.value=’’; var ml=U.el(‘memberLimit’);if(ml)ml.value=’’;
if (S.ui.page === ‘family’) rFamily();
toast(‘Membro adicionado!’);
});

var csb = U.el(‘contribSaveBtn’);
if (csb) csb.addEventListener(‘click’, function() {
var amount = U.num((U.el(‘contribAmount’)||{value:’’}).value);
if (amount <= 0) { toast(‘Valor invalido’); return; }
if (_pendingGoalId) { S.contribGoal(_pendingGoalId, amount); closeModal(‘modalContrib’); _pendingGoalId = null; if(S.ui.page===‘budget’)rGoals(); toast(‘Aporte registrado!’); }
});

var pcb = U.el(‘previewConfirmBtn’);
if (pcb) pcb.addEventListener(‘click’, function() {
if (!_pendingImport.length) return;
for (var i=0;i<_pendingImport.length;i++) S.transactions.unshift(_pendingImport[i]);
S.save(); _pendingImport = [];
closeModal(‘modalPreview’); updateHeader();
if (S.ui.page === ‘transactions’) rTransactions();
if (S.ui.page === ‘dashboard’) rDashboard();
toast(‘Transacoes importadas!’);
});

// — INIT —
S.load();
initQuickAdd();
goTo(‘dashboard’);

}); // end DOMContentLoaded
</script>
