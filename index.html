<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"/>
    
    <!-- PWA iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="FinançaFamiliar"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180/00e5a0/000000?text=FF"/>
    
    <title>FinançaFamiliar</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    
    <style>
        :root {
            --bg: #0a0c10;
            --surface: #111318;
            --surface2: #181b22;
            --border: #1e2130;
            --accent: #00e5a0;
            --accent-dim: rgba(0,229,160,0.12);
            --accent-soft: rgba(0,229,160,0.25);
            --danger: #ff4d6d;
            --danger-dim: rgba(255,77,109,0.12);
            --warning: #f5a623;
            --warning-dim: rgba(245,166,35,0.12);
            --purple: #a78bfa;
            --blue: #38bdf8;
            --orange: #fb923c;
            --pink: #f472b6;
            --green: #34d399;
            --yellow: #fbbf24;
            --text: #eef0f6;
            --text-muted: #6b7280;
            --text-dim: #2e3344;
            --radius: 16px;
            --radius-sm: 10px;
            --nav-h: 72px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
        }
        input, textarea {
            -webkit-user-select: text;
        }
        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        #app {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            padding-top: calc(14px + env(safe-area-inset-top));
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 50;
        }
        .header-logo {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
        }
        .header-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }
        .header-balance {
            text-align: right;
        }
        .header-balance-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .header-balance-value {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
        }
        .page {
            display: none;
            padding: 16px;
            flex-direction: column;
            gap: 16px;
        }
        .page.active {
            display: flex;
        }

        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: #111318;
            border-top: 1px solid var(--border);
            display: flex;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 999;
            height: calc(var(--nav-h) + env(safe-area-inset-bottom));
            box-shadow: 0 -4px 24px rgba(0,0,0,0.7);
        }
        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 9px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            padding: 8px 2px;
            transition: color 0.2s;
            position: relative;
        }
        .nav-btn.active {
            color: var(--accent);
        }
        .nav-btn .nav-icon {
            font-size: 18px;
            line-height: 1;
        }
        .nav-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: var(--accent);
            border-radius: 0 0 2px 2px;
            transition: width 0.2s;
        }
        .nav-btn.active::after {
            width: 28px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .stat-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .section-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
        }

        .tx-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .tx-item:last-child {
            border-bottom: none;
        }
        .tx-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .tx-info {
            flex: 1;
            min-width: 0;
        }
        .tx-desc {
            font-size: 13px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .tx-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .tx-amount {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.3px;
            flex-shrink: 0;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }
        .field label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .field input, .field select, .field textarea {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            color: var(--text);
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        .field input:focus, .field select:focus {
            border-color: var(--accent);
        }

        .btn {
            padding: 13px 20px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 14px;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: opacity 0.15s;
            width: 100%;
        }
        .btn-accent {
            background: var(--accent);
            color: #000;
        }
        .btn-ghost {
            background: var(--border);
            color: var(--text-muted);
        }
        .btn:active {
            opacity: 0.8;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .upload-area:active {
            border-color: var(--accent);
        }

        .alert {
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .alert-warning {
            background: var(--warning-dim);
            border: 1px solid var(--warning);
            color: var(--warning);
        }
        .alert-danger {
            background: var(--danger-dim);
            border: 1px solid var(--danger);
            color: var(--danger);
        }
        .alert-success {
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .import-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--surface);
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid var(--border);
            font-size: 12px;
        }

        .empty {
            padding: 40px 20px;
            text-align: center;
        }
        .empty-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        #toast {
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="app">
    <header class="header">
        <div>
            <div class="header-logo">FinançaFamiliar</div>
            <div class="header-sub" id="headerSub">Minha Família · Abril</div>
        </div>
        <div class="header-balance">
            <div class="header-balance-label">Saldo Total</div>
            <div class="header-balance-value" id="headerBalance">R$ 0,00</div>
        </div>
    </header>

    <main class="content">
        <div class="page active" id="page-dashboard">
            <div class="grid2">
                <div class="stat-card">
                    <div class="stat-label">Receitas ↗</div>
                    <div class="stat-value" id="dash-receitas">R$ 0,00</div>
                    <div class="stat-sub" id="dash-receitas-sub">0 entradas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Despesas ↘</div>
                    <div class="stat-value" id="dash-despesas">R$ 0,00</div>
                    <div class="stat-sub" id="dash-despesas-sub">0 saídas</div>
                </div>
            </div>

            <div class="card">
                <div class="section-title">Últimas Transações</div>
                <div id="topGastos"></div>
            </div>
        </div>

        <div class="page" id="page-transacoes">
            <input type="text" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;width:100%" id="txSearch" placeholder="Procurar transação..." oninput="renderTransactions()"/>
            <div id="txSummary" style="font-size:11px;color:var(--text-muted);margin:4px 0"></div>
            <div id="txList"></div>
        </div>

        <div class="page" id="page-importar">
            <div class="card">
                <div class="section-title">Lançamento Manual</div>
                <div class="field"><label>Descrição</label><input id="manDesc" placeholder="Ex: Aluguel, Mercado..."/></div>
                <div class="field"><label>Valor (R$)</label><input id="manVal" type="number" step="0.01" placeholder="0,00"/></div>
                <div class="field"><label>Data</label><input id="manDate" type="date"/></div>
                <div class="field"><label>Tipo</label><select id="manType"><option value="debit">Despesa</option><option value="credit">Receita</option></select></div>
                <button class="btn btn-accent" onclick="addManual()">Salvar Transação</button>
            </div>

            <div class="card">
                <div class="section-title">Importar Extrato PDF</div>
                <div class="upload-area" onclick="document.getElementById('pdfInput').click()">
                    <div style="font-size:24px;margin-bottom:8px">📄</div>
                    <div style="font-size:13px;font-weight:700">Selecionar PDF</div>
                    <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Nubank, Inter, Bradesco, Itaú...</div>
                    <input type="file" id="pdfInput" hidden accept="application/pdf" onchange="handlePDF(this)"/>
                </div>
                <div id="importResult" style="margin-top:12px"></div>
            </div>
        </div>

        <div class="page" id="page-config">
            <div class="card">
                <div class="section-title">Perfil</div>
                <div class="field"><label>Nome da Família</label><input id="cfgNome" onchange="saveConfig()"/></div>
                <div class="field"><label>Renda Mensal (R$)</label><input id="cfgRenda" type="number" onchange="saveConfig()"/></div>
            </div>
            <div class="card">
                <div class="section-title">Dados</div>
                <div style="display:flex;flex-direction:column;gap:10px">
                    <button class="btn btn-ghost" onclick="exportJSON()">📥 Exportar Backup</button>
                    <button class="btn btn-ghost" onclick="document.getElementById('importJsonInput').click()">📤 Importar Backup</button>
                    <input type="file" id="importJsonInput" hidden accept="application/json" onchange="importJSON(this)"/>
                    <button class="btn btn-danger" onclick="clearData()">🗑️ Apagar Dados</button>
                </div>
            </div>
            <div style="text-align:center;padding:20px;font-size:11px;color:var(--text-muted)">FinançaFamiliar v3.1 · Web App</div>
        </div>
    </main>

    <nav class="nav">
        <button class="nav-btn active" onclick="showPage('dashboard', this)">
            <span class="nav-icon">🏠</span><span>Início</span>
        </button>
        <button class="nav-btn" id="nav-tx" onclick="showPage('transacoes', this)">
            <span class="nav-icon">📑</span><span>Extrato</span>
        </button>
        <button class="nav-btn" onclick="showPage('importar', this)">
            <span class="nav-icon">📥</span><span>Importar</span>
        </button>
        <button class="nav-btn" onclick="showPage('config', this)">
            <span class="nav-icon">⚙️</span><span>Config</span>
        </button>
    </nav>
</div>

<script>
const CATS = [
    {id:'alimentacao', label:'Alimentação', icon:'🍽️', color:'#fb923c'},
    {id:'transporte',  label:'Transporte',  icon:'🚗', color:'#38bdf8'},
    {id:'moradia',     label:'Moradia',     icon:'🏠', color:'#a78bfa'},
    {id:'saude',       label:'Saúde',       icon:'💊', color:'#f472b6'},
    {id:'educacao',    label:'Educação',    icon:'📚', color:'#34d399'},
    {id:'lazer',       label:'Lazer',       icon:'🎬', color:'#fbbf24'},
    {id:'assinaturas', label:'Assinaturas', icon:'📱', color:'#60a5fa'},
    {id:'renda',       label:'Renda',       icon:'💼', color:'#00e5a0'},
    {id:'outros',      label:'Outros',      icon:'📦', color:'#9ca3af'},
];

const KEYWORDS = {
    alimentacao:['ifood','rappi','mcdonalds','burger','pizza','restaurante','padaria','supermercado','mercado','carrefour','extra','pao de acucar','atacadao','lanchonete','sushi','delivery','uber eats','hortifrutti','açougue','hortifruti','refeição','almoço','café','pão','bolo','doce','bala','refrigerante','suco','bebida'],
    transporte:['uber','99taxi','cabify','combustivel','gasolina','etanol','shell','posto','estacionamento','pedagio','onibus','metro','passagem','taxi','trem','viajem','viagem','aeroporto','aéreo','combustível','combustivel','valet'],
    moradia:['aluguel','condominio','iptu','energia','eletricidade','agua','saneamento','gas','internet','vivo','claro','tim','oi','net','telecom','telefone','wifi','adsl','fibra','banda larga'],
    saude:['farmacia','drogasil','drogaraia','ultrafarma','medico','consulta','clinica','hospital','laboratorio','exame','plano de saude','unimed','bradesco saude','amil','sulamerica','dental','dentista','oftalmologista','psicólogo','psicólogo','vacina','medicamento','remédio','droga','farmácia'],
    educacao:['escola','faculdade','cursinho','idioma','curso','livro','material','alura','udemy','coursera','descomplica','professora','professor','aula','educação','treinamento','workshop','seminário','palestra'],
    lazer:['cinema','netflix','spotify','amazon prime','disney','hbo','deezer','youtube','steam','playstation','xbox','teatro','show','ingresso','parque','viagem','hotel','airbnb','booking','bar','restaurante','pub','discoteca','boate','jogo','game','filme','série','música','livro','revista','jornal'],
    assinaturas:['netflix','spotify','amazon','disney','hbo','apple','google one','icloud','dropbox','adobe','canva','chatgpt','claude','subscription','assinatura','premium','plus','pro'],
    renda:['salario','salário','pagamento','deposito','depósito','pix rec','ted rec','transferencia recebida','bônus','bonus','décimo','décimo terceiro','décimo 13','gratificação','comissão','freelance','venda','receita'],
};

function autoCat(desc) {
    const d = desc.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    for (const [cat, kws] of Object.entries(KEYWORDS)) {
        if (kws.some(k => d.includes(k))) return cat;
    }
    return 'outros';
}

let state = {
    transactions: [],
    config: {nome:'Minha Família', renda:8500},
};

function save() {
    try { localStorage.setItem('ff_state', JSON.stringify(state)); } catch(e){}
}
function load() {
    try {
        const s = localStorage.getItem('ff_state');
        if (s) { state = Object.assign({}, state, JSON.parse(s)); return; }
    } catch(e){}
    state.transactions = [
        {id:'d1',date:'2025-04-03',description:'iFood - Jantar família',amount:87.50,type:'debit',category:'alimentacao'},
        {id:'d2',date:'2025-04-02',description:'Uber - Trabalho',amount:32.90,type:'debit',category:'transporte'},
        {id:'d3',date:'2025-04-01',description:'Netflix',amount:55.90,type:'debit',category:'assinaturas'},
        {id:'d4',date:'2025-04-01',description:'Supermercado Extra',amount:423.60,type:'debit',category:'alimentacao'},
        {id:'d11',date:'2025-03-27',description:'Salário Março',amount:8500.00,type:'credit',category:'renda'},
    ];
}

function fmt(v) {
    return 'R$ ' + Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function getCat(id) { return CATS.find(c=>c.id===id) || CATS[CATS.length-1]; }
function uid() { return 'tx-'+Date.now()+'-'+Math.random().toString(36).slice(2,7); }

function debits() { return state.transactions.filter(t=>t.type==='debit'); }
function credits() { return state.transactions.filter(t=>t.type==='credit'); }
function totalDebit() { return debits().reduce((s,t)=>s+t.amount,0); }
function totalCredit() { return credits().reduce((s,t)=>s+t.amount,0); }
function balance() { return totalCredit()-totalDebit(); }

function showPage(id, btn) {
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('page-'+id).classList.add('active');
    if(btn) btn.classList.add('active');
    renderPage(id);
}

async function extractPDFText(file) {
    try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(' ');
            fullText += pageText + '\n';
        }
        return fullText;
    } catch (error) {
        throw new Error('Não foi possível ler o PDF.');
    }
}

async function handlePDF(input) {
    const file = input.files[0];
    if (!file) return;
    const el = document.getElementById('importResult');
    el.innerHTML = '<div class="alert alert-warning">⏳ Lendo PDF...</div>';
    try {
        const text = await extractPDFText(file);
        let parsed = [];
        const lines = text.split('\n');
        for (let line of lines) {
            const dateMatch = line.match(/(\d{2}[\/\-]\d{2}(?:[\/\-]\d{2,4})?)/);
            const valueMatch = line.match(/R?\$?\s*([\d]{1,3}(?:\.[\d]{3})*,\d{2})/);
            if (dateMatch && valueMatch) {
                const value = parseFloat(valueMatch[1].replace(/\./g, '').replace(',', '.'));
                if (value > 0) {
                    const desc = line.replace(dateMatch[0], '').replace(valueMatch[0], '').trim().slice(0, 60) || 'Transação importada';
                    const isCredit = /crédito|credito|pagamento|pix rec|ted rec|depósito|salário|entrada/i.test(line);
                    const parts = dateMatch[1].split(/[\/\-]/);
                    const year = parts[2] ? (parts[2].length === 2 ? '20' + parts[2] : parts[2]) : new Date().getFullYear();
                    const dateISO = year + '-' + parts[1].padStart(2, '0') + '-' + parts[0].padStart(2, '0');
                    parsed.push({ id: uid(), date: dateISO, description: desc, amount: value, type: isCredit ? 'credit' : 'debit', category: isCredit ? 'renda' : autoCat(desc) });
                }
            }
        }
        if (parsed.length > 0) {
            el.innerHTML = '<div class="alert alert-success">✅ ' + parsed.length + ' transações encontradas!</div>' +
            '<button class="btn btn-accent" style="margin-top:12px" onclick="confirmImport(\'' + JSON.stringify(parsed).replace(/'/g, "\\'") + '\')">✅ Importar Tudo</button>';
        } else {
            el.innerHTML = '<div class="alert alert-warning">⚠️ Nenhuma transação encontrada.</div>';
        }
        input.value = '';
    } catch (error) {
        el.innerHTML = '<div class="alert alert-danger">❌ Erro ao ler PDF.</div>';
        input.value = '';
    }
}

function confirmImport(jsonStr) {
    const arr = JSON.parse(jsonStr);
    state.transactions = arr.concat(state.transactions);
    save(); renderAll();
    document.getElementById('importResult').innerHTML = '<div class="alert alert-success">✅ Importado com sucesso!</div>';
}

function addManual() {
    const desc = document.getElementById('manDesc').value.trim();
    const val = parseFloat(document.getElementById('manVal').value);
    const date = document.getElementById('manDate').value || new Date().toISOString().split('T')[0];
    const type = document.getElementById('manType').value;
    if (!desc || !val || val <= 0) return showToast('⚠️ Preencha descrição e valor.');
    state.transactions.unshift({ id: uid(), date: date, description: desc, amount: val, type: type, category: type === 'credit' ? 'renda' : autoCat(desc) });
    save(); renderAll();
    document.getElementById('manDesc').value = ''; document.getElementById('manVal').value = '';
    showToast('✅ Transação adicionada!');
}

function renderHeader() {
    const bal = balance();
    const el = document.getElementById('headerBalance');
    el.textContent = fmt(bal);
    el.style.color = bal >= 0 ? 'var(--accent)' : 'var(--danger)';
    const cfg = state.config.nome || 'Minha Família';
    const month = new Date().toLocaleString('pt-BR', { month: 'long' });
    document.getElementById('headerSub').textContent = cfg + ' · ' + month.charAt(0).toUpperCase() + month.slice(1);
}

function renderDashboard() {
    const tc = totalCredit(), td = totalDebit();
    document.getElementById('dash-receitas').textContent = fmt(tc);
    document.getElementById('dash-receitas-sub').textContent = credits().length + ' entradas';
    document.getElementById('dash-despesas').textContent = fmt(td);
    document.getElementById('dash-despesas-sub').textContent = debits().length + ' saídas';
    const sorted = debits().sort(function(a, b) { return b.amount - a.amount; }).slice(0, 5);
    var html = '';
    if (sorted.length === 0) {
        html = '<div class="empty"><div class="empty-text">Nenhuma transação</div></div>';
    } else {
        for (var i = 0; i < sorted.length; i++) {
            var t = sorted[i];
            var cat = getCat(t.category);
            html += '<div class="tx-item"><div class="tx-icon" style="background:' + cat.color + '22;">' + cat.icon + '</div><div class="tx-info"><div class="tx-desc">' + t.description + '</div><div class="tx-meta">' + cat.label + ' · ' + t.date.slice(8, 10) + '/' + t.date.slice(5, 7) + '</div></div><div class="tx-amount" style="color:var(--danger)">' + fmt(t.amount) + '</div></div>';
        }
    }
    document.getElementById('topGastos').innerHTML = html;
}

function renderTransactions() {
    const search = (document.getElementById('txSearch') || { value: '' }).value.toLowerCase();
    let txs = state.transactions.slice().sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
    if (search) txs = txs.filter(function(t) { return t.description.toLowerCase().indexOf(search) !== -1; });
    const td = txs.filter(function(t) { return t.type === 'debit'; }).reduce(function(s, t) { return s + t.amount; }, 0);
    const tc = txs.filter(function(t) { return t.type === 'credit'; }).reduce(function(s, t) { return s + t.amount; }, 0);
    document.getElementById('txSummary').innerHTML = txs.length + ' transações · <span style="color:var(--danger)">-' + fmt(td) + '</span> · <span style="color:var(--accent)">+' + fmt(tc) + '</span>';
    var html = '';
    if (txs.length === 0) {
        html = '<div class="empty"><div class="empty-text">Nenhuma transação</div></div>';
    } else {
        for (var i = 0; i < txs.length; i++) {
            var t = txs[i];
            var cat = getCat(t.category);
            var dateF = t.date.split('-').reverse().slice(0, 2).join('/');
            html += '<div class="tx-item"><div class="tx-icon" style="background:' + cat.color + '22;">' + cat.icon + '</div><div class="tx-info"><div class="tx-desc">' + t.description + '</div><div class="tx-meta">' + dateF + ' · ' + cat.label + '</div></div><div class="tx-amount" style="color:' + (t.type === 'credit' ? 'var(--accent)' : 'var(--text)') + '">' + (t.type === 'credit' ? '+' : '-') + fmt(t.amount) + '</div></div>';
        }
    }
    document.getElementById('txList').innerHTML = html;
}

function renderConfig() {
    document.getElementById('cfgNome').value = state.config.nome;
    document.getElementById('cfgRenda').value = state.config.renda;
}

function saveConfig() {
    state.config.nome = document.getElementById('cfgNome').value;
    state.config.renda = parseFloat(document.getElementById('cfgRenda').value) || 0;
    save(); renderHeader();
}

function exportJSON() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'financafamiliar-backup.json'; a.click();
}

function importJSON(input) {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function() {
        try {
            const data = JSON.parse(reader.result);
            if (data.transactions) { state = Object.assign({}, state, data); save(); renderAll(); showToast('✅ Backup importado!'); }
        } catch (e) { showToast('⚠️ Erro ao ler o backup.'); }
        input.value = '';
    };
    reader.readAsText(file);
}

function clearData() {
    if (confirm('Apagar todos os dados?')) { localStorage.removeItem('ff_state'); state.transactions = []; save(); renderAll(); showToast('✅ Dados apagados.'); }
}

function showToast(msg) {
    let t = document.getElementById('toast');
    if (!t) {
        t = document.createElement('div'); t.id = 'toast';
        t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1e2130;color:#fff;padding:10px 20px;border-radius:10px;z-index:9999;border:1px solid #00e5a044;';
        document.body.appendChild(t);
    }
    t.textContent = msg; t.style.opacity = '1';
    clearTimeout(t._timer); t._timer = setTimeout(function() { t.style.opacity = '0'; }, 3000);
}

function renderPage(id) {
    renderHeader();
    if (id === 'dashboard') renderDashboard();
    else if (id === 'transacoes') renderTransactions();
    else if (id === 'config') renderConfig();
}

function renderAll() {
    renderHeader();
    const active = document.querySelector('.page.active');
    if (active) renderPage(active.id.replace('page-', ''));
}

window.addEventListener('DOMContentLoaded', function() {
    load();
    document.getElementById('manDate').value = new Date().toISOString().split('T')[0];
    renderAll();
});
</script>
</body>
</html>
