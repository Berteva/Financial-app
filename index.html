<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0c10"/>
<title>FinançaFamiliar - Controle Financeiro Inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
/* ============================================
   RESET & VARIÁVEIS CORRIGIDAS
   ============================================ */
:root {
  --bg: #0a0c10;
  --surface: #111318;
  --surface2: #181b22;
  --border: #1e2130;
  --accent: #00e5a0;
  --accent-dim: rgba(0, 229, 160, 0.12);
  --accent-soft: rgba(0, 229, 160, 0.25);
  --danger: #ff4d6d;
  --danger-dim: rgba(255, 77, 109, 0.12);
  --warning: #f5a623;
  --warning-dim: rgba(245, 166, 35, 0.12);
  --purple: #a78bfa;
  --blue: #38bdf8;
  --orange: #fb923c;
  --pink: #f472b6;
  --green: #34d399;
  --yellow: #fbbf24;
  --text: #eef0f6;
  --text-muted: #6b7280;
  --radius: 16px;
  --radius-sm: 10px;
  --nav-h: 72px;
  --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
}

#app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  background: var(--bg);
}

/* ============================================
   SCROLLBAR PERSONALIZADA
   ============================================ */
::-webkit-scrollbar {
  width: 4px;
}

::-webkit-scrollbar-track {
  background: var(--border);
}

::-webkit-scrollbar-thumb {
  background: var(--accent);
  border-radius: 4px;
}

/* ============================================
   HEADER
   ============================================ */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  padding-top: calc(14px + env(safe-area-inset-top));
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  z-index: 50;
  backdrop-filter: blur(10px);
}

.header-logo {
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.5px;
}

.header-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.header-balance {
  text-align: right;
}

.header-balance-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.header-balance-value {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
  transition: var(--transition);
}

/* ============================================
   CONTENT
   ============================================ */
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
}

.page {
  display: none;
  padding: 16px;
  flex-direction: column;
  gap: 16px;
  animation: fadeIn 0.3s ease;
}

.page.active {
  display: flex;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ============================================
   NAVEGAÇÃO
   ============================================ */
.nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(17, 19, 24, 0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 999;
  height: var(--nav-h);
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.5);
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 9px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  padding: 8px 2px;
  transition: var(--transition);
  position: relative;
}

.nav-btn.active {
  color: var(--accent);
}

.nav-icon {
  font-size: 20px;
  line-height: 1;
  transition: transform 0.2s ease;
}

.nav-btn:active .nav-icon {
  transform: scale(0.95);
}

.nav-btn::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 2px;
  background: var(--accent);
  border-radius: 2px 2px 0 0;
  transition: width 0.2s ease;
}

.nav-btn.active::after {
  width: 24px;
}

.nav-btn.nav-add {
  color: var(--accent);
  font-weight: 700;
}

.nav-btn.nav-add .nav-icon {
  font-size: 24px;
}

/* ============================================
   COMPONENTES
   ============================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  transition: var(--transition);
}

.card:active {
  transform: scale(0.99);
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  transition: var(--transition);
}

.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.stat-value {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.progress-wrap {
  height: 6px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  border-radius: 99px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.section-title {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 12px;
  font-weight: 600;
}

/* Transações */
.tx-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: var(--transition);
}

.tx-item:hover {
  background: var(--surface2);
  margin: 0 -8px;
  padding: 12px 8px;
  border-radius: var(--radius-sm);
}

.tx-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.tx-info {
  flex: 1;
  min-width: 0;
}

.tx-desc {
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
}

.tx-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.tx-amount {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
  flex-shrink: 0;
}

.tx-detail {
  display: none;
  padding: 12px 0 8px 52px;
  flex-wrap: wrap;
  gap: 8px;
}

.tx-detail.open {
  display: flex;
  animation: slideDown 0.2s ease;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Categorias */
.cat-chip {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: var(--transition);
}

.cat-chip:hover {
  transform: translateY(-1px);
}

/* Score */
.score-wrap {
  display: flex;
  align-items: center;
  gap: 20px;
}

.score-ring-container {
  position: relative;
  width: 100px;
  height: 100px;
  flex-shrink: 0;
}

.score-ring-container svg {
  transform: rotate(-90deg);
}

.score-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.score-num {
  font-size: 26px;
  font-weight: 800;
  font-family: 'Syne', sans-serif;
}

.score-label {
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Modal */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-bg.open {
  display: flex;
  animation: fadeIn 0.2s ease;
}

.modal {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 24px 24px 0 0;
  padding: 24px 20px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from {
    transform: translateY(100%);
  }
  to {
    transform: translateY(0);
  }
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-close {
  background: var(--border);
  border: none;
  color: var(--text-muted);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.modal-close:hover {
  background: var(--danger);
  color: white;
}

/* Formulários */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}

.field label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}

.field input,
.field select,
.field textarea {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  color: var(--text);
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  width: 100%;
  transition: var(--transition);
}

.field input:focus,
.field select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-dim);
}

/* Botões */
.btn {
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 14px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: var(--transition);
  width: 100%;
  position: relative;
  overflow: hidden;
}

.btn::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

.btn:active::after {
  width: 200px;
  height: 200px;
}

.btn-accent {
  background: var(--accent);
  color: #000;
}

.btn-danger {
  background: var(--danger);
  color: #fff;
}

.btn-ghost {
  background: var(--border);
  color: var(--text-muted);
}

/* Grids */
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.cat-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 4px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: none;
  cursor: pointer;
  transition: var(--transition);
}

.cat-btn.selected {
  border-color: currentColor;
  background: var(--accent-dim);
  transform: scale(1.02);
}

/* Toast */
#toast {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface2);
  color: var(--text);
  padding: 12px 24px;
  border-radius: 40px;
  font-size: 14px;
  font-weight: 500;
  z-index: 1100;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  border: 1px solid var(--accent);
  backdrop-filter: blur(10px);
  white-space: nowrap;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

/* Empty State */
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-muted);
}

.empty-icon {
  font-size: 64px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-text {
  font-size: 14px;
}

/* Loading */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
}

.loading::after {
  content: '...';
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0%, 20% { content: '.'; }
  40% { content: '..'; }
  60%, 100% { content: '...'; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================================
// MÓDULO: CONSTANTES E CONFIGURAÇÃO
// ============================================
const APP_CONSTANTS = {
  STORAGE_KEY: 'financa_familiar_v2',
  CATEGORIES: [
    { id: 'alimentacao', label: 'Alimentação', icon: '🍽️', color: '#fb923c', defaultLimit: 1500 },
    { id: 'transporte', label: 'Transporte', icon: '🚗', color: '#38bdf8', defaultLimit: 600 },
    { id: 'moradia', label: 'Moradia', icon: '🏠', color: '#a78bfa', defaultLimit: 2000 },
    { id: 'saude', label: 'Saúde', icon: '💊', color: '#f472b6', defaultLimit: 400 },
    { id: 'educacao', label: 'Educação', icon: '📚', color: '#34d399', defaultLimit: 800 },
    { id: 'lazer', label: 'Lazer', icon: '🎬', color: '#fbbf24', defaultLimit: 500 },
    { id: 'assinaturas', label: 'Assinaturas', icon: '📱', color: '#60a5fa', defaultLimit: 300 },
    { id: 'renda', label: 'Renda', icon: '💼', color: '#00e5a0', defaultLimit: 0 },
    { id: 'outros', label: 'Outros', icon: '📦', color: '#9ca3af', defaultLimit: 400 }
  ],
  KEYWORDS: {
    alimentacao: ['ifood', 'rappi', 'mcdonalds', 'burger', 'pizza', 'restaurante', 'padaria', 'supermercado', 'mercado', 'carrefour', 'extra', 'pao de acucar', 'atacadao'],
    transporte: ['uber', '99taxi', 'combustivel', 'gasolina', 'posto', 'estacionamento', 'onibus', 'metro', 'taxi'],
    moradia: ['aluguel', 'condominio', 'iptu', 'energia', 'agua', 'gas', 'internet', 'vivo', 'claro', 'tim'],
    saude: ['farmacia', 'drogasil', 'medico', 'consulta', 'hospital', 'exame', 'plano de saude', 'unimed'],
    educacao: ['escola', 'faculdade', 'cursinho', 'curso', 'livro', 'material', 'alura', 'udemy'],
    lazer: ['cinema', 'netflix', 'spotify', 'amazon prime', 'disney', 'hbo', 'steam', 'playstation', 'viagem'],
    assinaturas: ['netflix', 'spotify', 'amazon', 'disney', 'hbo', 'apple', 'google one', 'icloud', 'dropbox'],
    renda: ['salario', 'salário', 'pagamento', 'deposito', 'pix', 'transferencia']
  },
  DEMO_TRANSACTIONS: [
    { id: 'd1', date: '2025-04-03', description: 'iFood - Jantar Família', amount: 87.50, type: 'debit', category: 'alimentacao', memberId: '' },
    { id: 'd2', date: '2025-04-02', description: 'Uber - Trabalho', amount: 32.90, type: 'debit', category: 'transporte', memberId: '' },
    { id: 'd3', date: '2025-04-01', description: 'Netflix', amount: 55.90, type: 'debit', category: 'assinaturas', memberId: '' },
    { id: 'd4', date: '2025-04-01', description: 'Supermercado Extra', amount: 423.60, type: 'debit', category: 'alimentacao', memberId: '' },
    { id: 'd5', date: '2025-04-01', description: 'Condomínio Abril', amount: 850.00, type: 'debit', category: 'moradia', memberId: '' },
    { id: 'd6', date: '2025-03-31', description: 'Drogasil - Remédios', amount: 118.40, type: 'debit', category: 'saude', memberId: '' },
    { id: 'd7', date: '2025-03-27', description: 'Salário Março', amount: 8500.00, type: 'credit', category: 'renda', memberId: '' }
  ]
};

// ============================================
// MÓDULO: UTILITÁRIOS PUROS
// ============================================
const Utils = {
  formatCurrency(value) {
    return 'R$ ' + Math.abs(value).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },
  
  formatShortCurrency(value) {
    if (value >= 1000) return 'R$ ' + (value / 1000).toFixed(1).replace('.', ',') + 'k';
    return this.formatCurrency(value);
  },
  
  formatDate(dateStr) {
    if (!dateStr) return '';
    const [year, month, day] = dateStr.split('-');
    return `${day}/${month}`;
  },
  
  getTodayISO() {
    return new Date().toISOString().split('T')[0];
  },
  
  generateId(prefix = 'id') {
    return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
  },
  
  calculatePercentage(value, total) {
    return total > 0 ? Math.min(100, Math.round((value / total) * 100)) : 0;
  },
  
  getProgressColor(percentage) {
    if (percentage >= 100) return 'var(--danger)';
    if (percentage >= 75) return 'var(--warning)';
    return 'var(--accent)';
  },
  
  autoCategorize(description) {
    const desc = description.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    for (const [category, keywords] of Object.entries(APP_CONSTANTS.KEYWORDS)) {
      if (keywords.some(keyword => desc.includes(keyword))) return category;
    }
    return 'outros';
  },
  
  debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  }
};

// ============================================
// MÓDULO: ESTADO CENTRAL (REATIVO)
// ============================================
class AppState {
  constructor() {
    this.data = {
      transactions: [],
      members: [],
      goals: [],
      config: { familyName: 'Minha Família', monthlyIncome: 8500, emergencyFund: 0 },
      categoryLimits: {},
      ui: { currentPage: 'dashboard', transactionFilter: 'all', periodFilter: 'month' }
    };
    this.listeners = [];
    this.load();
  }
  
  load() {
    try {
      const saved = localStorage.getItem(APP_CONSTANTS.STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        this.data = { ...this.data, ...parsed };
        return;
      }
    } catch (e) { console.warn('Failed to load state:', e); }
    
    // Initialize with demo data
    this.data.transactions = [...APP_CONSTANTS.DEMO_TRANSACTIONS];
    this.data.categoryLimits = Object.fromEntries(
      APP_CONSTANTS.CATEGORIES.map(cat => [cat.id, cat.defaultLimit])
    );
  }
  
  save() {
    try {
      localStorage.setItem(APP_CONSTANTS.STORAGE_KEY, JSON.stringify(this.data));
      this.notifyListeners();
    } catch (e) { console.error('Failed to save state:', e); }
  }
  
  subscribe(listener) {
    this.listeners.push(listener);
    return () => {
      this.listeners = this.listeners.filter(l => l !== listener);
    };
  }
  
  notifyListeners() {
    this.listeners.forEach(listener => listener(this.data));
  }
  
  // Getters computados
  getTotalCredit() {
    return this.data.transactions.filter(t => t.type === 'credit').reduce((sum, t) => sum + t.amount, 0);
  }
  
  getTotalDebit() {
    return this.data.transactions.filter(t => t.type === 'debit').reduce((sum, t) => sum + t.amount, 0);
  }
  
  getBalance() {
    return this.getTotalCredit() - this.getTotalDebit();
  }
  
  getCategoryTotal(categoryId) {
    return this.data.transactions
      .filter(t => t.type === 'debit' && t.category === categoryId)
      .reduce((sum, t) => sum + t.amount, 0);
  }
  
  getCategoryLimit(categoryId) {
    return this.data.categoryLimits[categoryId] || 
           APP_CONSTANTS.CATEGORIES.find(c => c.id === categoryId)?.defaultLimit || 0;
  }
  
  getMemberSpending(memberId) {
    return this.data.transactions
      .filter(t => t.type === 'debit' && t.memberId === memberId)
      .reduce((sum, t) => sum + t.amount, 0);
  }
  
  // Mutations
  addTransaction(transaction) {
    this.data.transactions.unshift({ ...transaction, id: Utils.generateId('tx') });
    this.save();
  }
  
  updateTransactionCategory(transactionId, newCategory) {
    const index = this.data.transactions.findIndex(t => t.id === transactionId);
    if (index !== -1) {
      this.data.transactions[index].category = newCategory;
      this.save();
    }
  }
  
  deleteTransaction(transactionId) {
    this.data.transactions = this.data.transactions.filter(t => t.id !== transactionId);
    this.save();
  }
  
  addMember(member) {
    this.data.members.push({ ...member, id: Utils.generateId('mem') });
    this.save();
  }
  
  deleteMember(memberId) {
    this.data.members = this.data.members.filter(m => m.id !== memberId);
    // Remove member association from transactions
    this.data.transactions.forEach(t => {
      if (t.memberId === memberId) t.memberId = '';
    });
    this.save();
  }
  
  addGoal(goal) {
    this.data.goals.push({ ...goal, id: Utils.generateId('goal'), currentAmount: goal.currentAmount || 0 });
    this.save();
  }
  
  addGoalContribution(goalId, amount) {
    const goal = this.data.goals.find(g => g.id === goalId);
    if (goal) {
      goal.currentAmount = Math.min(goal.targetAmount, goal.currentAmount + amount);
      this.save();
    }
  }
  
  deleteGoal(goalId) {
    this.data.goals = this.data.goals.filter(g => g.id !== goalId);
    this.save();
  }
  
  updateConfig(config) {
    this.data.config = { ...this.data.config, ...config };
    this.save();
  }
  
  updateCategoryLimit(categoryId, limit) {
    this.data.categoryLimits[categoryId] = limit;
    this.save();
  }
  
  setCurrentPage(page) {
    this.data.ui.currentPage = page;
    this.save();
  }
  
  clearAllData() {
    localStorage.removeItem(APP_CONSTANTS.STORAGE_KEY);
    this.data = {
      transactions: [...APP_CONSTANTS.DEMO_TRANSACTIONS],
      members: [],
      goals: [],
      config: { familyName: 'Minha Família', monthlyIncome: 8500, emergencyFund: 0 },
      categoryLimits: Object.fromEntries(APP_CONSTANTS.CATEGORIES.map(cat => [cat.id, cat.defaultLimit])),
      ui: { currentPage: 'dashboard', transactionFilter: 'all', periodFilter: 'month' }
    };
    this.save();
  }
}

  renderCurrentPage() {
    const currentPage = this.state.data.ui.currentPage;

    // Update active nav

  renderDashboard(container) {
    const totalCredit = this.state.getTotalCredit();
    const totalDebit = this.state.getTotalDebit();

    const score = this.calculateScore();
    
    container.innerHTML = `

      </div>
      
      <div class="card">
        <div class="section-title">Saúde Financeira</div>
        <div class="score-wrap">

            <svg width="100" height="100" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="42" fill="none" stroke="var(--border)" stroke-width="10"/>
              <circle id="scoreArc" cx="50" cy="50" r="42" fill="none" stroke="${score.color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="${264 - (264 * score.value / 100)}"/>
            </svg>

            </div>

          <div style="flex:1">
            <div style="font-size:14px;font-weight:700;margin-bottom:6px;color:${score.color}">${score.message}</div>

          </div>
        </div>
      </div>
      
      <div class="card">
        <div class="section-title">🔥 Maiores Gastos</div>
        <div id="topExpenses"></div>
      </div>
    `;
    
    // Render top expenses
    const topExpenses = [...this.state.data.transactions]
      .filter(t => t.type === 'debit')
      .sort((a, b) => b.amount - a.amount)
      .slice(0, 3);
    
    const topExpensesDiv = document.getElementById('topExpenses');
    if (topExpensesDiv) {
      topExpensesDiv.innerHTML = topExpenses.length === 0 ? 
        '<div class="empty-text">Nenhuma despesa registrada</div>' :
        topExpenses.map(tx => {
          const category = APP_CONSTANTS.CATEGORIES.find(c => c.id === tx.category);
          return `

                <div class="tx-meta">${category.label} · ${Utils.formatDate(tx.date)}</div>

              <div class="tx-amount" style="color:var(--danger)">${Utils.formatCurrency(tx.amount)}</div>
            </div>
          `;
        }).join('');

  }
  
  calculateScore() {
    let score = 0;
    const details = [];
    const monthlyIncome = this.state.data.config.monthlyIncome || this.state.getTotalCredit() || 1;
    const balance = this.state.getBalance();
    const totalDebit = this.state.getTotalDebit();
    const savings = balance > 0 ? balance : 0;
    const emergencyFund = this.state.data.config.emergencyFund || 0;
    
    // Positive balance (30 points)
    if (balance >= 0) {
      score += 30;
      details.push('✅ Saldo positivo');
    } else {
      details.push('❌ Saldo negativo');
    }
    
    // Savings rate (20 points)
    if (savings >= monthlyIncome * 0.1) {
      score += 20;
      details.push('✅ Poupança ≥ 10% da renda');
    } else {
      details.push('⚠️ Poupança abaixo de 10%');
    }
    
    // Category limits (20 points)
    const exceededCategories = APP_CONSTANTS.CATEGORIES.filter(cat => {
      const spent = this.state.getCategoryTotal(cat.id);
      const limit = this.state.getCategoryLimit(cat.id);
      return limit > 0 && spent > limit;
    });
    
    if (exceededCategories.length === 0) {
      score += 20;
      details.push('✅ Limites respeitados');
    } else {
      details.push(`❌ ${exceededCategories.length} categoria(s) estourada(s)`);
    }
    
    // Emergency fund (15 points)
    const monthlyExpenses = totalDebit;
    if (emergencyFund >= monthlyExpenses * 3) {
      score += 15;
      details.push('✅ Reserva de emergência adequada');
    } else {
      details.push('⚠️ Reserva de emergência insuficiente');
    }
    
    // Food expense ratio (15 points)
    const foodExpense = this.state.getCategoryTotal('alimentacao');
    if (totalDebit > 0 && foodExpense <= totalDebit * 0.3) {
      score += 15;
      details.push('✅ Alimentação ≤ 30% dos gastos');
    } else {
      details.push('⚠️ Alimentação > 30% dos gastos');
    }
    
    let message = 'Em Desenvolvimento';
    let color = 'var(--warning)';
    if (score >= 71) {
      message = 'Excelente! 🎉';
      color = 'var(--accent)';
    } else if (score >= 41) {
      message = 'Bom, mas pode melhorar';
      color = 'var(--warning)';
    } else {
      message = 'Atenção Necessária 🚨';
      color = 'var(--danger)';
    }
    
    return { value: score, message, details, color };
  }
  
  renderTransactions(container) {
    const filter = this.state.data.ui.transactionFilter;
    let filtered = [...this.state.data.transactions].sort((a, b) => new Date(b.date) - new Date(a.date));
    
    if (filter === 'credit') filtered = filtered.filter(t => t.type === 'credit');
    else if (filter === 'debit') filtered = filtered.filter(t => t.type === 'debit');
    else if (filter !== 'all') filtered = filtered.filter(t => t.category === filter);
    
    const totalCredit = filtered.filter(t => t.type === 'credit').reduce((s, t) => s + t.amount, 0);
    const totalDebit = filtered.filter(t => t.type === 'debit').reduce((s, t) => s + t.amount, 0);
    
    container.innerHTML = `
      <input class="search-bar" id="transactionSearch" placeholder="🔍 Buscar transação..." />
      <div class="chips" id="filterChips"></div>
      <div class="card" style="padding:10px 4px;">
        <div style="padding:4px 16px 12px;font-size:12px;color:var(--text-muted);">
          ${filtered.length} transações · 
          <span style="color:var(--danger)">-${Utils.formatCurrency(totalDebit)}</span> · 
          <span style="color:var(--accent)">+${Utils.formatCurrency(totalCredit)}</span>
        </div>
        <div id="transactionsList"></div>
      </div>
    `;
    
    // Render filter chips
    const filters = [
      { id: 'all', label: 'Todos' },
      { id: 'debit', label: '💸 Despesas' },
      { id: 'credit', label: '💰 Receitas' },
      ...APP_CONSTANTS.CATEGORIES.map(c => ({ id: c.id, label: `${c.icon} ${c.label}` }))
    ];
    
    const chipsDiv = document.getElementById('filterChips');
    if (chipsDiv) {
      chipsDiv.innerHTML = filters.map(f => `
        <button class="chip ${filter === f.id ? 'active' : ''}" data-filter="${f.id}">${f.label}</button>
      `).join('');
    }

    if (listDiv) {
      if (filtered.length === 0) {
        listDiv.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Nenhuma transação encontrada</div></div>';
      } else {
        listDiv.innerHTML = filtered.map(tx => {

          return `
            <div class="tx-item" data-transaction-id="${tx.id}">
              <div class="tx-icon" style="background:${category.color}22">${category.icon}</div>
              <div class="tx-info">
                <div class="tx-desc">${tx.description}</div>
                <div class="tx-meta">${Utils.formatDate(tx.date)} · ${category.label}${member ? ` · ${member.name}` : ''}</div>
              </div>
              <div class="tx-amount" style="color:${tx.type === 'credit' ? 'var(--accent)' : 'var(--text)'}">
                ${tx.type === 'credit' ? '+' : '-'}${Utils.formatCurrency(tx.amount)}
              </div>
            </div>
            <div class="tx-detail" id="detail-${tx.id}">
              ${APP_CONSTANTS.CATEGORIES.filter(c => c.id !== 'renda').map(c => `
                <button class="cat-chip" data-change-cat="${tx.id}|${c.id}" style="background:${tx.category === c.id ? c.color + '33' : 'var(--border)'};color:${tx.category === c.id ? c.color : 'var(--text-muted)'}">
                  ${c.icon} ${c.label}
                </button>
              `).join('')}
              <button class="cat-chip" data-delete-tx="${tx.id}" style="background:var(--danger-dim);color:var(--danger)">🗑️ Excluir</button>
            </div>
          `;
        }).join('');
      }
    }
    
    // Setup search
    const searchInput = document.getElementById('transactionSearch');
    if (searchInput) {
      searchInput.addEventListener('input', Utils.debounce((e) => {
        const term = e.target.value.toLowerCase();
        const items = document.querySelectorAll('.tx-item');
        items.forEach(item => {
          const desc = item.querySelector('.tx-desc')?.textContent.toLowerCase() || '';
          item.style.display = desc.includes(term) ? 'flex' : 'none';
        });
      }, 300));
    }
  }
  
  renderBudget(container) {
    const monthlyIncome = this.state.data.config.monthlyIncome || this.state.getTotalCredit() || 1;
    const totalDebit = this.state.getTotalDebit();
    const balance = this.state.getBalance();
    const needs = ['moradia', 'alimentacao', 'saude', 'transporte'].reduce((sum, cat) => sum + this.state.getCategoryTotal(cat), 0);
    const wants = ['lazer', 'assinaturas', 'educacao'].reduce((sum, cat) => sum + this.state.getCategoryTotal(cat), 0);
    const savings = Math.max(0, balance);
    
    container.innerHTML = `
      <div class="card">
        <div class="section-title">Regra 50 · 30 · 20</div>
        <div id="rule502030"></div>
      </div>
      
      <div class="card">
        <div class="section-title">Limite por Categoria</div>
        <div id="categoryLimits"></div>
      </div>
      
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="section-title">🎯 Metas Financeiras</div>
        <button class="btn btn-accent" style="width:auto;padding:7px 14px;font-size:12px;" data-action="open-goal-modal">+ Nova Meta</button>
      </div>
      <div id="goalsList"></div>
    `;
    
    // Render 50-30-20
    const rules = [
      { label: 'Necessidades (50%)', value: needs, target: monthlyIncome * 0.5, color: 'var(--accent)' },
      { label: 'Desejos (30%)', value: wants, target: monthlyIncome * 0.3, color: 'var(--purple)' },
      { label: 'Poupança (20%)', value: savings, target: monthlyIncome * 0.2, color: 'var(--blue)' }
    ];
    
    const ruleDiv = document.getElementById('rule502030');
    if (ruleDiv) {
      ruleDiv.innerHTML = rules.map(rule => {
        const percentage = Utils.calculatePercentage(rule.value, rule.target);
        const isOver = rule.value > rule.target;
        return `
          <div style="margin-bottom:16px">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px">
              <span>${rule.label}</span>
              <span style="color:${isOver ? 'var(--danger)' : 'var(--text)'}">
                ${Utils.formatCurrency(rule.value)} / ${Utils.formatCurrency(rule.target)}
              </span>
            </div>
            <div class="progress-wrap">
              <div class="progress-bar" style="width:${percentage}%;background:${isOver ? 'var(--danger)' : rule.color}"></div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // Render category limits
    const limitsDiv = document.getElementById('categoryLimits');
    if (limitsDiv) {
      limitsDiv.innerHTML = APP_CONSTANTS.CATEGORIES.filter(c => c.id !== 'renda').map(cat => {
        const spent = this.state.getCategoryTotal(cat.id);
        const limit = this.state.getCategoryLimit(cat.id);
        const percentage = Utils.calculatePercentage(spent, limit);
        const isOver = spent > limit && limit > 0;
        return `
          <div style="padding:12px 0;border-bottom:1px solid var(--border)">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <span style="font-size:13px">${cat.icon} ${cat.label}</span>
              <span style="font-size:13px;font-weight:700;color:${isOver ? 'var(--danger)' : 'var(--text)'}">
                ${Utils.formatCurrency(spent)} / ${Utils.formatCurrency(limit)}
              </span>
            </div>
            <div class="progress-wrap">
              <div class="progress-bar" style="width:${percentage}%;background:${Utils.getProgressColor(percentage)}"></div>
            </div>
            ${isOver ? `<div style="font-size:11px;color:var(--danger);margin-top:4px">⚠️ Ultrapassado em ${Utils.formatCurrency(spent - limit)}</div>` : ''}
          </div>
        `;
      }).join('');
    }
    
    // Render goals
    this.renderGoals();
  }
  
  renderGoals() {
    const goalsDiv = document.getElementById('goalsList');

    if (this.state.data.goals.length === 0) {
      goalsDiv.innerHTML = '<div class="card" style="text-align:center;color:var(--text-muted)">Nenhuma meta cadastrada</div>';

        <div class="card">

              <button class="btn btn-accent" style="width:auto;padding:4px 10px;font-size:11px" data-contribute-goal="${goal.id}">+ Aporte</button>

  generateTips() {
    const tips = [];
    const balance = this.state.getBalance();
    const totalDebit = this.state.getTotalDebit();
    const monthlyIncome = this.state.data.config.monthlyIncome || 1;
    
    if (balance < 0) {
      tips.push({
        icon: '🚨',
        color: 'var(--danger)',
        title: 'Gastos maiores que receitas!',
        text: `Você está ${Utils.formatCurrency(Math.abs(balance))} negativo. Revise seus gastos urgentemente.`
      });
    }
    
    const foodExpense = this.state.getCategoryTotal('alimentacao');
    if (foodExpense > 1500) {
      tips.push({
        icon: '🍽️',
        color: 'var(--orange)',
        title: 'Alimentação acima do ideal',
        text: `Gastou ${Utils.formatCurrency(foodExpense)} em alimentação. Cozinhar em casa pode economizar até R$300/mês.`
      });
    }
    
    const subscriptions = this.state.getCategoryTotal('assinaturas');
    if (subscriptions > 200) {
      tips.push({
        icon: '📱',
        color: 'var(--blue)',
        title: 'Revise suas assinaturas',
        text: `${Utils.formatCurrency(subscriptions)} em serviços mensais. Cancele os que não usa.`
      });
    }
    
    const emergencyFund = this.state.data.config.emergencyFund || 0;
    const monthsCovered = totalDebit > 0 ? (emergencyFund / totalDebit).toFixed(1) : 0;
    tips.push({
      icon: '🛡️',
      color: 'var(--green)',
      title: `Reserva de Emergência: ${monthsCovered} meses`,
      text: `Meta: 6 meses de despesas (${Utils.formatCurrency(totalDebit * 6)}). Sua reserva atual: ${Utils.formatCurrency(emergencyFund)}.`
    });
    
    return tips;
  }

  setupEventDelegation() {
    this.app.addEventListener('click', (e) => {
      // Navigation
      const navBtn = e.target.closest('[data-nav]');
      if (navBtn) {
        const page = navBtn.dataset.nav;
        if (page === 'add') {
          this.openModal('modal-quick');
        } else {
          this.state.setCurrentPage(page);
          this.renderCurrentPage();
        }
        return;
      }
      
      // Modal close
      const closeBtn = e.target.closest('[data-modal-close]');
      if (closeBtn) {
        const modalId = closeBtn.dataset.modalClose;
        this.closeModal(modalId);
        return;
      }
      
      // Modal background close
      const modalBg = e.target.closest('.modal-bg');
      if (modalBg && modalBg.classList.contains('open')) {
        this.closeModal(modalBg.id);
        return;
      }
      
      // Transaction detail toggle
      const txItem = e.target.closest('.tx-item');
      if (txItem && !e.target.closest('.cat-chip')) {
        const detail = document.getElementById(`detail-${txItem.dataset.transactionId}`);
        if (detail) detail.classList.toggle('open');
        return;
      }
      
      // Change category
      const changeCat = e.target.closest('[data-change-cat]');
      if (changeCat) {
        const [txId, catId] = changeCat.dataset.changeCat.split('|');
        this.state.updateTransactionCategory(txId, catId);
        this.renderCurrentPage();
        this.showToast('Categoria atualizada!');
        return;
      }
      
      // Delete transaction
      const deleteTx = e.target.closest('[data-delete-tx]');
      if (deleteTx) {
        const txId = deleteTx.dataset.deleteTx;
        this.showConfirm('Deseja excluir esta transação?', () => {
          this.state.deleteTransaction(txId);
          this.renderCurrentPage();
          this.showToast('Transação excluída!');
        });
        return;
      }
      
      // Filter transactions
      const filterBtn = e.target.closest('[data-filter]');
      if (filterBtn) {
        this.state.data.ui.transactionFilter = filterBtn.dataset.filter;
        this.renderCurrentPage();
        return;
      }
      
      // Quick add
      if (e.target.closest('[data-action="quick-add"]')) {
        const desc = document.getElementById('quickDesc')?.value.trim();
        const amount = parseFloat(document.getElementById('quickAmount')?.value);
        const type = document.querySelector('[data-quick-type].active')?.dataset.quickType || 'debit';
        const category = document.querySelector('[data-quick-cat].selected')?.dataset.quickCat || 'outros';
        
        if (!desc || !amount || amount <= 0) {
          this.showToast('⚠️ Preencha descrição e valor válido');
          return;
        }
        
        this.state.addTransaction({
          date: Utils.getTodayISO(),
          description: desc,
          amount: amount,
          type: type,
          category: type === 'credit' ? 'renda' : category,
          memberId: ''
        });
        
        this.closeModal('modal-quick');
        document.getElementById('quickDesc').value = '';
        document.getElementById('quickAmount').value = '';
        this.showToast('✅ Transação adicionada!');
        return;
      }
      
      // Manual add
      if (e.target.closest('[data-action="manual-add"]')) {
        const desc = document.getElementById('manualDesc')?.value.trim();
        const amount = parseFloat(document.getElementById('manualAmount')?.value);
        const date = document.getElementById('manualDate')?.value || Utils.getTodayISO();
        const type = document.querySelector('[data-manual-type].active')?.dataset.manualType || 'debit';
        const category = document.querySelector('[data-manual-cat].selected')?.dataset.manualCat || 'outros';
        const memberId = document.getElementById('manualMember')?.value || '';
        
        if (!desc || !amount || amount <= 0) {
          this.showToast('⚠️ Preencha descrição e valor válido');
          return;
        }
        
        this.state.addTransaction({
          date: date,
          description: desc,
          amount: amount,
          type: type,
          category: type === 'credit' ? 'renda' : category,
          memberId: memberId
        });
        
        document.getElementById('manualDesc').value = '';
        document.getElementById('manualAmount').value = '';
        this.showToast('✅ Transação adicionada!');
        this.renderCurrentPage();
        return;
      }
      
      // Open goal modal
      if (e.target.closest('[data-action="open-goal-modal"]')) {
        this.openModal('modal-goal');
        return;
      }
      
      // Add goal
      if (e.target.closest('[data-action="add-goal"]')) {
        const name = document.getElementById('goalName')?.value.trim();
        const target = parseFloat(document.getElementById('goalTarget')?.value);
        const current = parseFloat(document.getElementById('goalCurrent')?.value) || 0;
        const deadline = document.getElementById('goalDeadline')?.value;
        
        if (!name || !target || target <= 0) {
          this.showToast('⚠️ Preencha nome e valor alvo');
          return;
        }
        
        this.state.addGoal({ name, targetAmount: target, currentAmount: current, deadline });
        this.closeModal('modal-goal');
        this.showToast('✅ Meta criada!');
        this.renderCurrentPage();
        return;
      }
      
      // Contribute to goal
      const contributeBtn = e.target.closest('[data-contribute-goal]');
      if (contributeBtn) {
        const goalId = contributeBtn.dataset.contributeGoal;
        const goal = this.state.data.goals.find(g => g.id === goalId);
        if (goal) {
          document.getElementById('contributionGoalName').textContent = `Meta: ${goal.name}`;
          document.getElementById('contributionAmount').value = '';
          this.openModal('modal-contribution');
          this._pendingGoalId = goalId;
        }
        return;
      }
      
      // Add contribution
      if (e.target.closest('[data-action="add-contribution"]')) {
        const amount = parseFloat(document.getElementById('contributionAmount')?.value);
        if (!amount || amount <= 0) {
          this.showToast('⚠️ Digite um valor válido');
          return;
        }
        if (this._pendingGoalId) {
          this.state.addGoalContribution(this._pendingGoalId, amount);
          this.closeModal('modal-contribution');
          this.showToast('✅ Aporte registrado!');
          this.renderCurrentPage();
        }
        return;
      }
      
      // Delete goal
      const deleteGoalBtn = e.target.closest('[data-delete-goal]');
      if (deleteGoalBtn) {
        const goalId = deleteGoalBtn.dataset.deleteGoal;
        this.showConfirm('Deseja excluir esta meta?', () => {
          this.state.deleteGoal(goalId);
          this.renderCurrentPage();
          this.showToast('Meta excluída!');
        });
        return;
      }
      
      // Open member modal
      if (e.target.closest('[data-action="open-member-modal"]')) {
        this.openModal('modal-member');
        return;
      }
      
      // Add member
      if (e.target.closest('[data-action="add-member"]')) {
        const name = document.getElementById('memberName')?.value.trim();
        const limit = parseFloat(document.getElementById('memberLimit')?.value) || 0;
        
        if (!name) {
          this.showToast('⚠️ Digite o nome do membro');
          return;
        }
        
        this.state.addMember({ name, limit });
        this.closeModal('modal-member');
        this.showToast('✅ Membro adicionado!');
        this.renderCurrentPage();
        return;
      }
      
      // Delete member
      const deleteMemberBtn = e.target.closest('[data-delete-member]');
      if (deleteMemberBtn) {
        const memberId = deleteMemberBtn.dataset.deleteMember;
        this.showConfirm('Remover este membro? As transações vinculadas ficarão sem vínculo.', () => {
          this.state.deleteMember(memberId);
          this.renderCurrentPage();
          this.showToast('Membro removido!');
        });
        return;
      }
      
      // Export CSV
      if (e.target.closest('[data-action="export-csv"]')) {
        this.exportCSV();
        return;
      }
      
      // Export JSON
      if (e.target.closest('[data-action="export-json"]')) {
        this.exportJSON();
        return;
      }
      
      // Import JSON
      const importJsonBtn = e.target.closest('[data-action="import-json"]');
      if (importJsonBtn) {
        const input = importJsonBtn.querySelector('input');
        if (input) input.click();
        return;
      }
      
      // Clear data
      if (e.target.closest('[data-action="clear-data"]')) {
        this.showConfirm('Todos os dados serão apagados permanentemente!', () => {
          this.state.clearAllData();
          this.renderCurrentPage();
          this.showToast('Dados apagados! Demo restaurada.');
        });
        return;
      }
      
      // Update category limit
      const limitInput = e.target.closest('.limit-input');
      if (limitInput) {
        const category = limitInput.dataset.category;
        const limit = parseFloat(limitInput.value) || 0;
        this.state.updateCategoryLimit(category, limit);
        this.showToast('Limite atualizado!');
        return;
      }
      
      // Config save
      const configInputs = ['configName', 'configIncome', 'configEmergency'];
      if (configInputs.some(id => e.target.id === id)) {
        this.state.updateConfig({
          familyName: document.getElementById('configName')?.value || '',
          monthlyIncome: parseFloat(document.getElementById('configIncome')?.value) || 0,
          emergencyFund: parseFloat(document.getElementById('configEmergency')?.value) || 0
        });
        this.updateHeader();
        const totalDebit = this.state.getTotalDebit();
        const months = totalDebit > 0 ? (this.state.data.config.emergencyFund / totalDebit).toFixed(1) : 0;
        const emergencyInfo = document.getElementById('emergencyInfo');
        if (emergencyInfo) {
          emergencyInfo.textContent = `Sua reserva cobre ${months} meses de despesas. Meta: 6 meses (${Utils.formatCurrency(totalDebit * 6)})`;
        }
        return;
      }
    });
    
    // Type toggles delegation
    this.app.addEventListener('click', (e) => {
      // Quick type toggle
      const quickType = e.target.closest('[data-quick-type]');
      if (quickType) {
        document.querySelectorAll('[data-quick-type]').forEach(btn => btn.classList.remove('active'));
        quickType.classList.add('active');
        const isDebit = quickType.dataset.quickType === 'debit';
        const catGrid = document.getElementById('quickCatGrid');
        if (catGrid && !isDebit) catGrid.style.opacity = '0.5';
        else if (catGrid) catGrid.style.opacity = '1';
        return;
      }
      
      // Manual type toggle
      const manualType = e.target.closest('[data-manual-type]');
      if (manualType) {
        document.querySelectorAll('[data-manual-type]').forEach(btn => btn.classList.remove('active'));
        manualType.classList.add('active');
        const isDebit = manualType.dataset.manualType === 'debit';
        const catGrid = document.getElementById('manualCatGrid');
        if (catGrid && !isDebit) catGrid.style.opacity = '0.5';
        else if (catGrid) catGrid.style.opacity = '1';
        return;
      }
      
      // Quick category select
      const quickCat = e.target.closest('[data-quick-cat]');
      if (quickCat) {
        document.querySelectorAll('[data-quick-cat]').forEach(btn => btn.classList.remove('selected'));
        quickCat.classList.add('selected');
        return;
      }
      
      // Manual category select
      const manualCat = e.target.closest('[data-manual-cat]');
      if (manualCat) {
        document.querySelectorAll('[data-manual-cat]').forEach(btn => btn.classList.remove('selected'));
        manualCat.classList.add('selected');
        return;
      }
    });
  }
  
  attachModalListeners() {
    // Setup quick add category grid
    const quickCatGrid = document.getElementById('quickCatGrid');
    if (quickCatGrid) {
      quickCatGrid.innerHTML = APP_CONSTANTS.CATEGORIES.filter(c => c.id !== 'renda').map(cat => `
        <button class="cat-btn" data-quick-cat="${cat.id}" style="color:${cat.color}">
          <span class="ci">${cat.icon}</span>
          <span class="cl">${cat.label}</span>
        </button>
      `).join('');
    }
    
    // Setup quick type toggle
    const quickTypeDiv = document.getElementById('quickTypeToggle');
    if (quickTypeDiv) {
      quickTypeDiv.innerHTML = `
        <button class="toggle-btn active-red active" data-quick-type="debit">💸 Despesa</button>
        <button class="toggle-btn" data-quick-type="credit">💰 Receita</button>
      `;
    }
  }
  
  openModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
      modal.classList.add('open');
      modal.style.display = 'flex';
    }
  }
  
  closeModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
      modal.classList.remove('open');
      modal.style.display = 'none';
    }
  }
  
  showConfirm(message, onConfirm) {
    const confirmMsg = document.getElementById('confirmMessage');
    if (confirmMsg) confirmMsg.textContent = message;
    
    const confirmYes = document.querySelector('[data-action="confirm-yes"]');
    const handleConfirm = () => {
      onConfirm();
      this.closeModal('modal-confirm');
      confirmYes.removeEventListener('click', handleConfirm);
    };
    confirmYes?.addEventListener('click', handleConfirm, { once: true });
    
    this.openModal('modal-confirm');
  }
  
  showToast(message) {
    let toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.style.opacity = '1';
    clearTimeout(toast._timeout);
    toast._timeout = setTimeout(() => {
      toast.style.opacity = '0';
    }, 3000);
  }
  
  exportCSV() {
    const rows = ['Data,Descrição,Valor,Tipo,Categoria,Membro'];
    this.state.data.transactions.forEach(tx => {
      const member = this.state.data.members.find(m => m.id === tx.memberId);
      rows.push(`${tx.date},"${tx.description}",${tx.type === 'debit' ? -tx.amount : tx.amount},${tx.type === 'debit' ? 'Despesa' : 'Receita'},${APP_CONSTANTS.CATEGORIES.find(c => c.id === tx.category)?.label || tx.category},${member?.name || ''}`);
    });
    const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `financas_${Utils.getTodayISO()}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
    this.showToast('✅ CSV exportado!');
  }
  
  exportJSON() {
    const data = {
      transactions: this.state.data.transactions,
      members: this.state.data.members,
      goals: this.state.data.goals,
      config: this.state.data.config,
      categoryLimits: this.state.data.categoryLimits
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `financas_backup_${Utils.getTodayISO()}.json`;
    link.click();
    URL.revokeObjectURL(link.href);
    this.showToast('✅ Backup exportado!');
  }
}

// ============================================
// INICIALIZAÇÃO
// ============================================
const appState = new AppState();
const appRenderer = new UIRenderer(appState, document.getElementById('app'));

// File input handlers
document.addEventListener('change', (e) => {
  const input = e.target;
  if (input.files && input.accept === '.json') {
    const file = input.files[0];
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.transactions) {
          appState.data.transactions = data.transactions;
          appState.data.members = data.members || [];
          appState.data.goals = data.goals || [];
          appState.data.config = { ...appState.data.config, ...data.config };
          appState.data.categoryLimits = { ...appState.data.categoryLimits, ...data.categoryLimits };
          appState.save();
          appRenderer.renderCurrentPage();
          appRenderer.showToast('✅ Backup importado com sucesso!');
        } else {
          appRenderer.showToast('⚠️ Arquivo inválido');
        }
      } catch {
        appRenderer.showToast('⚠️ Erro ao ler o arquivo');
      }
      input.value = '';
    };
    reader.readAsText(file);
  }
});
</script>
